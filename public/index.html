<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git API</title>
  <script type="importmap">{"imports":{"@li3/":"https://cdn.li3.dev/@li3/"}}</script>
  <script type="module">import '@li3/web';</script>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="component" href="/components/repo-sidebar.html">
  <link rel="component" href="/components/repo-viewer.html">
  <link rel="component" href="/components/repo-panel.html">
  <link rel="component" href="/components/file-preview.html">
  <style>
    @custom-variant dark (&:where(.dark, .dark *));
    repo-sidebar { display: block; height: 100%; width: 16rem; flex-shrink: 0; }
    repo-viewer { display: block; height: 100%; min-height: 0; min-width: 0; flex: 1 1 auto; }
    repo-panel { display: block; height: 100%; width: 16rem; flex-shrink: 0; }
    file-preview { display: contents; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
  </style>
</head>
<body class="h-screen w-full overflow-hidden bg-white text-sm text-gray-900 transition-colors dark:bg-gray-950 dark:text-gray-100">
  <template app>
    <div class="flex h-screen flex-col bg-white text-gray-900 dark:bg-gray-950 dark:text-gray-100" class-dark="darkMode">
    <header class="relative z-20 flex h-14 flex-shrink-0 items-center justify-between border-b border-gray-200 bg-gray-50 px-4 dark:border-gray-800 dark:bg-gray-900">
      <div class="flex items-center gap-3">
        <button class="p-2 text-gray-500 md:hidden" on-click="toggleMenu()" aria-label="Open menu"><i class="fa-solid fa-bars text-lg"></i></button>
        <div class="flex items-center gap-2 text-lg font-semibold tracking-tight"><i class="fa-brands fa-git-alt text-xl text-orange-500"></i><span>Git API</span></div>
      </div>
      <div class="flex items-center gap-4">
        <button class="rounded-full p-1 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white" on-click="toggleTheme()" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
        <a attr-href="userUrl" class="flex items-center gap-3 border-l border-gray-200 pl-4 dark:border-gray-700" title="Open profile"><div class="hidden text-right leading-tight sm:block"><div class="font-medium">{{ userName }}</div><div class="text-xs text-gray-500 dark:text-gray-400">{{ userEmail }}</div></div><img attr-src="userAvatar" attr-alt="userName" class="h-8 w-8 rounded-full border border-gray-200 object-cover dark:border-gray-700"></a>
      </div>
    </header>
    <div class="relative flex flex-1 overflow-hidden">
      <repo-sidebar bind-repositories="repositories" bind-selected="selectedRepo" bind-open="menuOpen" on-select="selectRepo($event)" on-create-repository="createRepository($event)"></repo-sidebar>
      <main class="flex min-w-0 flex-1 flex-col overflow-hidden bg-white dark:bg-gray-950 md:flex-row">
        <repo-viewer class="min-h-0 min-w-0 flex-1" bind-repo="selectedRepo" bind-repositories="repositories" bind-entries="entries" bind-commits="commits" on-select-file="selectFile($event)" on-upload="uploadFiles($event)" on-commit="commitChanges($event)" on-create-repository="createRepository($event)"></repo-viewer>
        <repo-panel bind-repo="selectedRepo" bind-branches="branches" bind-tags="tags"></repo-panel>
      </main>
      <file-preview bind-path="previewPath" bind-content="previewContent" bind-visible="previewVisible" on-close="closePreview()"></file-preview>
    </div>
    </div>
    <script setup>
      import { ref, computed, onInit, watch } from '@li3/web';

      export default function () {
        const repositories = ref([]);
        const selectedRepo = ref(null);
        const entries = ref([]);
        const commits = ref([]);
        const branches = ref([]);
        const tags = ref([]);
        const previewPath = ref('');
        const previewContent = ref('');
        const menuOpen = ref(false);
        const darkMode = ref(true);
        const userUrl = ref('#');
        const profile = ref(null);
        const userName = computed(() => profile.value?.name || profile.value?.preferred_username || 'Guest');
        const userEmail = computed(() => profile.value?.email || 'Not signed in');
        const userAvatar = computed(() => profile.value?.picture || profile.value?.avatar || profile.value?.avatar_url || profile.value?.image || profile.value?.photo || `https://placehold.co/100x100/6366f1/ffffff?text=${encodeURIComponent(userName.value.slice(0, 1).toUpperCase())}`);
        const previewVisible = computed(() => Boolean(previewPath.value));

        const urlState = () => {
          const url = new URL(window.location.href);
          return { owner: url.searchParams.get('owner'), repo: url.searchParams.get('repo'), path: url.searchParams.get('path') };
        };
        const setUrl = (repo, file) => {
          const url = new URL(window.location.href);
          if (repo) { url.searchParams.set('owner', repo.owner); url.searchParams.set('repo', repo.repo); } else { url.searchParams.delete('owner'); url.searchParams.delete('repo'); }
          if (file) url.searchParams.set('path', file); else url.searchParams.delete('path');
          window.history.pushState({}, '', url);
        };
        const api = async (url) => { const response = await fetch(url); if (!response.ok) throw new Error(`Request failed: ${response.status}`); return response.json(); };
        const loadRepo = async (repo, file = '') => {
          if (!repo) { entries.value = []; commits.value = []; branches.value = []; tags.value = []; previewPath.value = ''; return; }
          const base = `/repos/${encodeURIComponent(repo.owner)}/${encodeURIComponent(repo.repo)}`;
          const [tree, log, branchList, tagList] = await Promise.all([api(`${base}/tree`), api(`${base}/log`), api(`${base}/branches`), api(`${base}/tags`)]);
          entries.value = tree;
          commits.value = log;
          branches.value = branchList;
          tags.value = tagList;
          if (file) { previewPath.value = file; previewContent.value = await fetch(`${base}/file?path=${encodeURIComponent(file)}`).then((response) => response.text()); } else { previewPath.value = ''; previewContent.value = ''; }
        };
        const selectRepo = (event) => { const repo = event.detail; selectedRepo.value = repo; menuOpen.value = false; setUrl(repo); loadRepo(repo).catch(() => { entries.value = []; }); };
        const selectFile = (event) => { const file = event.detail; if (!selectedRepo.value) return; setUrl(selectedRepo.value, file.path); loadRepo(selectedRepo.value, file.path).catch(() => { previewContent.value = 'Unable to load file'; }); };
        const closePreview = () => { previewPath.value = ''; setUrl(selectedRepo.value); };
        const toggleTheme = () => { darkMode.value = !darkMode.value; };
        const toggleMenu = () => { menuOpen.value = !menuOpen.value; };
        const refreshRepositories = async () => { repositories.value = await api('/repos').catch(() => []); };
        const createRepository = async (event) => {
          const name = (event.detail || '').trim();
          if (!name || !/^[a-zA-Z0-9._-]+$/.test(name)) return;
          const owner = 'jane-doe';
          const response = await fetch(`/repos/${encodeURIComponent(owner)}/${encodeURIComponent(name)}`, { method: 'POST' });
          if (!response.ok) return;
          await refreshRepositories();
          selectRepo({ detail: { owner, repo: name } });
        };
        const tokenHeaders = () => { const token = window.localStorage.getItem('access_token'); return token ? { Authorization: `Bearer ${token}` } : {}; };
        const commitChanges = async (event) => {
          if (!selectedRepo.value) return;
          const base = `/repos/${encodeURIComponent(selectedRepo.value.owner)}/${encodeURIComponent(selectedRepo.value.repo)}`;
          await fetch(`${base}/commit`, { method: 'POST', headers: { 'Content-Type': 'application/json', ...tokenHeaders() }, body: JSON.stringify({ message: event.detail || 'autocommit' }) });
          await loadRepo(selectedRepo.value);
        };
        const uploadFiles = async (event) => {
          if (!selectedRepo.value) return;
          const files = Array.from(event.detail || []);
          const base = `/repos/${encodeURIComponent(selectedRepo.value.owner)}/${encodeURIComponent(selectedRepo.value.repo)}`;
          for (const file of files) {
            const content = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result).split(',')[1]); reader.onerror = reject; reader.readAsDataURL(file); });
            await fetch(`${base}/files`, { method: 'POST', headers: { 'Content-Type': 'application/json', ...tokenHeaders() }, body: JSON.stringify({ path: file.name, content }) });
          }
          await loadRepo(selectedRepo.value);
        };
        const restoreRoute = () => {
          const route = urlState();
          const repo = repositories.value.find((item) => item.owner === route.owner && item.repo === route.repo) || null;
          selectedRepo.value = repo;
          if (repo) loadRepo(repo, route.path).catch(() => { entries.value = []; });
        };
        onInit(async () => { repositories.value = await api('/repos').catch(() => []); userUrl.value = (await api('/config').catch(() => ({}))).oidcUserUrl || '#'; const session = await api('/session').catch(() => ({ authenticated: false })); profile.value = session.authenticated ? session.profile : null; restoreRoute(); window.addEventListener('popstate', restoreRoute); });
        watch(selectedRepo, (repo) => { if (!repo) loadRepo(null); });
        return { darkMode, userUrl, userName, userEmail, userAvatar, repositories, selectedRepo, entries, commits, branches, tags, previewPath, previewContent, previewVisible, menuOpen, selectRepo, selectFile, closePreview, toggleTheme, toggleMenu, createRepository, uploadFiles, commitChanges };
      }
    </script>
  </template>
</body>
</html>
