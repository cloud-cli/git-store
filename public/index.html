<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git API</title>
    <script type="importmap">
      { "imports": { "@li3/": "https://cdn.li3.dev/@li3/" } }
    </script>
    <script type="module">
      import "@li3/web";
    </script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .workspace {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #9ca3af;
        border-radius: 4px;
      }
    </style>
  </head>
  <body class="bg-white text-sm text-gray-900 dark:bg-gray-950 dark:text-gray-100">
    <template app>
      <header
        class="relative z-30 flex h-14 flex-shrink-0 items-center justify-between border-b border-gray-200 bg-gray-50 px-4 dark:border-gray-800 dark:bg-gray-900"
        class-dark="darkMode"
      >
        <div class="flex items-center gap-3">
          <template if="showWorkspace"
            ><button
              class="p-2 text-gray-500 dark:text-gray-300 md:hidden"
              on-click="toggleSidebar()"
              aria-label="Toggle repositories"
            >
              <i class="fa-solid fa-bars text-lg"></i></button
          ></template>
          <a href="/" class="flex items-center gap-2 text-lg font-semibold tracking-tight"
            ><i class="fa-brands fa-git-alt text-xl text-orange-500"></i><span>Git API</span></a
          >
        </div>
        <div class="flex items-center gap-4">
          <button
            class="rounded-full p-1 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white"
            on-click="toggleTheme()"
            aria-label="Toggle theme"
          >
            <i class="fa-solid fa-circle-half-stroke"></i>
          </button>
          <template if="profile"
            ><a
              attr-href="profileUrl"
              class="flex items-center gap-3 border-l border-gray-200 pl-4 dark:border-gray-700"
              title="Open profile"
            >
              <span class="hidden text-right leading-tight sm:block"
                ><span class="block font-medium">{{ userEmail }}</span
                ><span class="block text-xs text-gray-500 dark:text-gray-400">{{ userEmail }}</span></span
              >
              <img
                attr-src="userAvatar"
                attr-alt="userEmail"
                class="h-8 w-8 rounded-full border border-gray-200 object-cover dark:border-gray-700"
              /> </a
          ></template>
          <template if="!profile"
            ><a
              attr-href="userUrl"
              title="Sign in with OIDC"
              class="inline-flex items-center gap-2 rounded-md bg-indigo-600 px-4 py-2 font-medium text-white transition-colors hover:bg-indigo-500"
            >
              <i class="fa-solid fa-arrow-right-to-bracket"></i>
              <span>Sign in</span>
            </a></template
          >
        </div>
      </header>
      <script state type="application/json">
        { "profile": null, "userUrl": "#", "darkMode": true, "showWorkspace": false }
      </script>
      <script setup>
        import { ref, computed, onInit } from "@li3/web";
        export default function () {
          const profile = ref(null);
          const routeParams = new URL(window.location.href).searchParams;
          const showWorkspace = ref(routeParams.has("org") && routeParams.has("repo"));
          const userUrl = ref("#");
          const loginUrl = ref("#");
          const profileUrl = ref("#");
          const savedTheme = localStorage.getItem("theme");
          const darkMode = ref(
            savedTheme ? savedTheme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches,
          );
          const userAlias = computed(() => profile.value?.alias || "Signed in");
          const userEmail = computed(() => profile.value?.email || "Signed in");
          const userAvatar = computed(
            () =>
              profile.value?.picture ||
              profile.value?.avatar ||
              profile.value?.avatar_url ||
              profile.value?.image ||
              profile.value?.photo ||
              "https://placehold.co/100x100/6366f1/ffffff?text=U",
          );
          const toggleTheme = () => {
            darkMode.value = !darkMode.value;
            localStorage.setItem("theme", darkMode.value ? "dark" : "light");
            document.documentElement.classList.toggle("dark", darkMode.value);
            window.dispatchEvent(new CustomEvent("git-api-theme", { detail: darkMode.value }));
          };
          const toggleSidebar = () => window.dispatchEvent(new CustomEvent("git-api-sidebar-toggle"));
          onInit(async () => {
            document.documentElement.classList.toggle("dark", darkMode.value);
            const config = await fetch("/ui/config")
              .then((response) => response.json())
              .catch(() => ({}));
            const token = localStorage.getItem("access_token");
            const sessionResponse = await fetch("/ui/session", {
              headers: token ? { Authorization: `Bearer ${token}` } : {},
            }).catch(() => null);
            const session = sessionResponse?.ok
              ? await sessionResponse.json().catch(() => ({ authenticated: false }))
              : { authenticated: false };
            profile.value = session.authenticated ? session.profile : null;
            profileUrl.value = config.oidcUserUrl || "#";
            const returnTo = `${window.location.pathname}${window.location.search}${window.location.hash}`;
            loginUrl.value = config.oidcLoginUrl
              ? `${config.oidcLoginUrl}?returnTo=${encodeURIComponent(returnTo)}`
              : "#";
            userUrl.value = profile.value ? profileUrl.value : loginUrl.value;
            window.addEventListener("git-api-theme", (event) => {
              darkMode.value = event.detail;
            });
          });
          return {
            profile,
            userUrl,
            profileUrl,
            darkMode,
            showWorkspace,
            userEmail,
            userAvatar,
            toggleTheme,
            toggleSidebar,
          };
        }
      </script>
    </template>

    <div class="workspace">
      <template app>
        <template if="showWorkspace">
          <aside
            class="absolute inset-y-0 left-0 z-40 flex h-full w-64 flex-shrink-0 -translate-x-full flex-col border-r border-gray-200 bg-gray-50 transition-transform dark:border-gray-800 dark:bg-gray-900 md:relative md:translate-x-0"
            class-dark="darkMode"
            class-translate-x-0="menuOpen"
          >
            <div class="flex items-center justify-between border-b border-gray-200 p-3 dark:border-gray-800">
              <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">
                Repositories
              </h2>
              <button
                popovertarget="create-repo-popover"
                style="anchor-name: --create-repository-anchor"
                class="p-2 text-gray-500 dark:text-gray-300"
                aria-label="Create repository"
              >
                <i class="fa-solid fa-plus"></i>
              </button>
            </div>
            <div class="space-y-2 border-b border-gray-200 p-3 dark:border-gray-800">
              <label class="block text-xs font-medium text-gray-500 dark:text-gray-300" for="org-select"
                >Organization</label
              >
              <select
                id="org-select"
                class="w-full rounded-md border border-gray-300 bg-white px-2 py-2 dark:border-gray-700 dark:bg-gray-900"
                on-change="selectOrg($event.target.value)"
              >
                <option value="">Select organization</option>
                <template for="org of orgs"
                  ><option attr-value="org.slug" attr-selected="org.slug === selectedOrg">
                    {{ org.slug }}
                  </option></template
                >
              </select>
              <form class="flex gap-1" on-submit.prevent="createOrg()">
                <input
                  class="min-w-0 flex-1 rounded-md border border-gray-300 bg-transparent px-2 py-1 dark:border-gray-700"
                  placeholder="organization-slug"
                  aria-label="New organization slug"
                  on-input="setOrgName($event.target.value)"
                />
                <button class="rounded bg-indigo-600 px-2 text-white" type="submit" aria-label="Create organization">
                  <i class="fa-solid fa-plus"></i>
                </button>
              </form>
              <template if="orgError"
                ><p class="text-xs text-red-600 dark:text-red-400" role="alert">{{ orgError }}</p></template
              >
            </div>
            <div class="flex-1 space-y-1 overflow-y-auto p-2">
              <template if="!selectedOrg"
                ><p class="px-3 py-2 text-xs text-gray-500 dark:text-gray-300">
                  Create an organization to get started.
                </p></template
              >
              <template if="selectedOrg && !repositories.length"
                ><p class="px-3 py-2 text-xs text-gray-500 dark:text-gray-300">
                  No repositories in this organization yet. Create one to get started.
                </p></template
              >
              <template for="repo of repositories"
                ><a
                  attr-href="repoHref(repo)"
                  class="flex items-center gap-2 rounded-md px-3 py-2 text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
                  class-selected="isSelected(repo)"
                  on-click="closeMenu()"
                  ><i class="fa-solid fa-book-bookmark text-xs text-gray-400"></i>{{ repo.repo }}</a
                ></template
              >
            </div>
            <div
              popover="auto"
              id="create-repo-popover"
              style="
                position: fixed;
                inset: auto;
                margin: 0;
                position-anchor: --create-repository-anchor;
                top: anchor(bottom);
                left: anchor(left);
              "
              class="w-64 rounded-lg border border-gray-200 bg-white p-4 shadow-xl dark:border-gray-700 dark:bg-gray-900"
            >
              <!-- Show sign-in button when not authenticated -->
              <template if="!localStorage.getItem('access_token')">
                <div class="text-center py-8">
                  <a
                    href="/ui/auth/login"
                    class="inline-flex items-center gap-2 rounded-md bg-indigo-600 px-4 py-2 font-medium text-white hover:bg-indigo-500"
                    aria-label="Sign in to create repository"
                  >
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    <span>Sign in to create repository</span>
                  </a>
                  <p class="mt-2 text-xs text-gray-500 dark:text-gray-400">Create a repository after signing in</p>
                </div>
                <!-- Show form when authenticated -->
              </template>
              <template if="localStorage.getItem('access_token')">
                <form on-submit.prevent="createRepository()" class="space-y-4">
                  <h2 class="text-lg font-semibold">Create repository</h2>
                  <label class="block text-sm text-gray-600 dark:text-gray-300"
                    >Repository name<input
                      class="mt-1 w-full rounded-md border border-gray-300 bg-transparent px-3 py-2 outline-none focus:border-indigo-500 dark:border-gray-700"
                      placeholder="my-project"
                      required
                      on-input="setRepoName($event.target.value)"
                  /></label>
                  <template if="errorMessage"
                    ><p class="text-xs text-red-600 dark:text-red-400" role="alert">{{ errorMessage }}</p></template
                  >
                  <div class="flex justify-end gap-2">
                    <button
                      type="button"
                      class="rounded-md px-3 py-2 text-gray-500 dark:text-gray-300"
                      popovertarget="create-repo-popover"
                      popovertargetaction="hide"
                    >
                      Cancel
                    </button>
                    <button
                      class="rounded-md bg-indigo-600 px-3 py-2 font-medium text-white hover:bg-indigo-500"
                      type="submit"
                    >
                      Create
                    </button>
                  </div>
                </form>
              </template>
            </div>
          </aside>
          <template if="menuOpen"
            ><div class="fixed inset-0 z-30 bg-black/40 md:hidden" on-click="closeMenu()"></div
          ></template>
        </template>
        <script state type="application/json">
          {
            "repositories": [],
            "orgs": [],
            "selectedOrg": "",
            "showWorkspace": false,
            "menuOpen": false,
            "repoName": "",
            "errorMessage": "",
            "orgError": "",
            "darkMode": true
          }
        </script>
        <script setup>
          import { ref, onInit } from "@li3/web";
          export default function () {
            const repositories = ref([]);
            const orgs = ref([]);
            const selectedOrg = ref("");
            const initialParams = new URL(window.location.href).searchParams;
            const showWorkspace = ref(initialParams.has("org") && initialParams.has("repo"));
            const orgName = ref("");
            const orgError = ref("");
            const menuOpen = ref(false);
            const repoName = ref("");
            const errorMessage = ref("");
            const savedTheme = localStorage.getItem("theme");
            const darkMode = ref(
              savedTheme ? savedTheme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches,
            );
            const route = () => new URL(window.location.href).searchParams;
            const repoHref = (repo) =>
              `/?org=${encodeURIComponent(selectedOrg.value)}&repo=${encodeURIComponent(repo.repo)}`;
            const setOrgName = (value) => {
              orgName.value = value;
            };
            const selectOrg = (slug) => {
              const current = new URL(window.location.href);
              if (slug) current.searchParams.set("org", slug);
              else current.searchParams.delete("org");
              current.searchParams.delete("repo");
              current.searchParams.delete("path");
              current.searchParams.delete("dir");
              window.location.assign(current);
            };
            const loadRepositories = async () => {
              const org = new URL(window.location.href).searchParams.get("org") || selectedOrg.value;
              selectedOrg.value = org;
              const response = org
                ? await fetch(`/api/v1/orgs/${encodeURIComponent(org)}/repos`, { headers: tokenHeaders() }).catch(
                    () => null,
                  )
                : null;
              const result = response?.ok ? await response.json().catch(() => ({})) : {};
              repositories.value = Array.isArray(result) ? result : Array.isArray(result.repos) ? result.repos : [];
            };
            const createOrg = async () => {
              const slug = orgName.value.trim();
              orgError.value = "";
              if (!/^[a-zA-Z0-9](?:[a-zA-Z0-9._-]{0,61}[a-zA-Z0-9])?$/.test(slug)) {
                orgError.value =
                  "Use 1–63 letters, numbers, dots, underscores, or hyphens; start and end with a letter or number.";
                return;
              }
              try {
                const response = await fetch("/api/v1/orgs", {
                  method: "POST",
                  headers: { "Content-Type": "application/json", ...tokenHeaders() },
                  body: JSON.stringify({ slug }),
                });
                if (!response.ok) throw new Error("Organization creation failed.");
                const result = await response.json();
                window.location.assign(`/?org=${encodeURIComponent(result.slug)}`);
              } catch (error) {
                orgError.value = error.message || "Organization creation failed.";
              }
            };
            const isSelected = (repo) => route().get("repo") === repo.repo;
            const setRepoName = (value) => {
              repoName.value = value;
            };
            const tokenHeaders = () => {
              const token = localStorage.getItem("access_token");
              return token ? { Authorization: `Bearer ${token}` } : {};
            };
            const closeMenu = () => {
              menuOpen.value = false;
            };
            const createRepository = async () => {
              const name = repoName.value.trim();
              errorMessage.value = "";
              if (!/^[a-zA-Z0-9._-]+$/.test(name)) {
                errorMessage.value = "Use letters, numbers, dots, underscores, or hyphens.";
                return;
              }
              try {
                const response = await fetch(
                  `/api/v1/orgs/${encodeURIComponent(new URL(window.location.href).searchParams.get("org"))}/repos/${encodeURIComponent(name)}`,
                  {
                    method: "POST",
                    headers: tokenHeaders(),
                  },
                );
                if (response.ok) window.location.assign(repoHref({ repo: name }));
                else {
                  const result = await response.json().catch(() => ({}));
                  errorMessage.value =
                    response.status === 401 || response.status === 403
                      ? "Sign in with repository write access."
                      : `${result.error || "Repository creation failed"} (${result.code || response.status})`;
                }
              } catch {
                errorMessage.value = "Repository creation failed.";
              }
            };
            onInit(async () => {
              window.addEventListener("git-api-theme", (event) => {
                darkMode.value = event.detail;
              });
              window.addEventListener("git-api-sidebar-toggle", () => {
                menuOpen.value = !menuOpen.value;
              });
              window.addEventListener("keydown", (event) => {
                if (event.key === "Escape" && menuOpen.value) closeMenu();
              });
              const response = await fetch("/api/v1/orgs", { headers: tokenHeaders() }).catch(() => null);
              const result = response?.ok ? await response.json().catch(() => ({})) : {};
              orgs.value = Array.isArray(result) ? result : Array.isArray(result.orgs) ? result.orgs : [];
              const requested = new URL(window.location.href).searchParams.get("org");
              selectedOrg.value = orgs.value.some((org) => org.slug === requested)
                ? requested
                : orgs.value[0]?.slug || "";
              if (selectedOrg.value && requested !== selectedOrg.value) {
                const current = new URL(window.location.href);
                current.searchParams.set("org", selectedOrg.value);
                history.replaceState(null, "", current);
              }
              await loadRepositories();
            });
            return {
              repositories,
              orgs,
              selectedOrg,
              showWorkspace,
              orgError,
              menuOpen,
              repoName,
              errorMessage,
              darkMode,
              repoHref,
              isSelected,
              closeMenu,
              setRepoName,
              setOrgName,
              selectOrg,
              createOrg,
              createRepository,
            };
          }
        </script>
      </template>

      <main class="flex min-w-0 flex-1 flex-col overflow-hidden bg-white dark:bg-gray-950 md:flex-row">
        <template app>
          <section
            class="flex min-h-0 min-w-0 flex-1 flex-col overflow-y-auto bg-white p-4 dark:bg-gray-950 md:p-6"
            class-dark="darkMode"
            on-dragover.prevent="setDragging(true)"
            on-dragleave="setDragging(false)"
            on-drop.prevent="upload($event)"
          >
            <template if="!repo"
              ><div class="flex min-h-full flex-1 items-center justify-center text-center">
                <div class="mx-auto w-full max-w-2xl p-6 sm:p-10">
                  <template if="!org"
                    ><div class="mx-auto mb-8 max-w-md text-center">
                      <img
                        src="/ui/welcome.svg"
                        alt="A repository workspace with connected branches"
                        class="mx-auto mb-8 w-full max-w-sm"
                      />
                      <p
                        class="mb-2 text-xs font-semibold uppercase tracking-[0.2em] text-indigo-600 dark:text-indigo-300"
                      >
                        Step 1 of 2 · Workspace
                      </p>
                      <h1 class="text-3xl font-semibold tracking-tight">Create an organization</h1>
                      <p class="mt-3 text-gray-600 dark:text-gray-300">
                        Organizations keep your repositories together. Choose a name to get started.
                      </p>
                    </div>
                    <form
                      class="mx-auto flex w-full max-w-md flex-col gap-3 sm:flex-row"
                      on-submit.prevent="createOrganization()"
                    >
                      <label class="sr-only" for="first-org-name">Organization name</label>
                      <input
                        id="first-org-name"
                        class="min-w-0 flex-1 rounded-md border border-gray-300 bg-white px-3 py-3 text-gray-900 placeholder:text-gray-500 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100 dark:placeholder:text-gray-400"
                        placeholder="my-organization"
                        required
                        on-input="setOrgName($event.target.value)"
                      />
                      <button
                        class="rounded-md bg-indigo-600 px-5 py-3 font-medium text-white hover:bg-indigo-500"
                        type="submit"
                      >
                        Create organization
                      </button>
                    </form>
                    <template if="orgError"
                      ><p class="mt-3 text-center text-sm text-red-600 dark:text-red-400" role="alert">
                        {{ orgError }}
                      </p></template
                    >
                  </template>
                  <template if="org"
                    ><div class="mx-auto max-w-md text-center">
                      <div
                        class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300"
                      >
                        <i class="fa-solid fa-building text-2xl"></i>
                      </div>
                      <p
                        class="mb-2 text-xs font-semibold uppercase tracking-[0.2em] text-indigo-600 dark:text-indigo-300"
                      >
                        Step 2 of 2 · {{ org }}
                      </p>
                      <h1 class="text-3xl font-semibold tracking-tight">Create your first repository</h1>
                      <p class="mt-3 text-gray-600 dark:text-gray-300">
                        Your repository will belong to
                        <strong class="text-gray-900 dark:text-gray-100">{{ org }}</strong>.
                      </p>
                    </div>
                    <form
                      class="mx-auto mt-8 flex w-full max-w-md flex-col gap-3 sm:flex-row"
                      on-submit.prevent="createFirstRepository()"
                    >
                      <label class="sr-only" for="first-repo-name">Repository name</label>
                      <input
                        id="first-repo-name"
                        class="min-w-0 flex-1 rounded-md border border-gray-300 bg-white px-3 py-3 text-gray-900 placeholder:text-gray-500 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100 dark:placeholder:text-gray-400"
                        placeholder="my-first-repository"
                        required
                        on-input="setRepoName($event.target.value)"
                      />
                      <button
                        class="rounded-md bg-indigo-600 px-5 py-3 font-medium text-white hover:bg-indigo-500"
                        type="submit"
                      >
                        Create repository
                      </button>
                    </form>
                    <template if="errorMessage"
                      ><p class="mt-3 text-center text-sm text-red-600 dark:text-red-400" role="alert">
                        {{ errorMessage }}
                      </p></template
                    >
                  </template>
                </div>
              </div></template
            >
            <template if="repo"
              ><div class="mb-4 flex items-center gap-2 text-xs text-gray-500 dark:text-gray-300">
                <span
                  class="rounded bg-indigo-50 px-2 py-1 font-medium text-indigo-700 dark:bg-indigo-950 dark:text-indigo-200"
                  >{{ org }}</span
                >
                <span>/</span>
                <h1 class="text-lg font-semibold text-gray-900 dark:text-gray-100">{{ repo.repo }}</h1>
                <a attr-href="rootHref" class="hover:text-indigo-600 dark:hover:text-indigo-300">Repository root</a
                ><span>/</span><span>{{ directory || 'Root' }}</span>
                <button
                  popovertarget="add-file-popover"
                  style="anchor-name: --add-file-anchor"
                  class="ml-2 text-xs text-indigo-600 hover:underline dark:text-indigo-300"
                >
                  + Add file
                </button>
              </div>
              <template if="errorMessage"
                ><p class="mb-3 text-xs text-red-600 dark:text-red-400" role="alert">{{ errorMessage }}</p></template
              >
              <div
                popover="auto"
                id="add-file-popover"
                style="
                  position: fixed;
                  inset: auto;
                  margin: 0;
                  position-anchor: --add-file-anchor;
                  top: anchor(bottom);
                  left: anchor(left);
                "
                class="w-64 rounded-lg border border-gray-200 bg-white p-4 shadow-xl dark:border-gray-700 dark:bg-gray-900"
              >
                <form on-submit.prevent="addFileToRepo()" class="space-y-4">
                  <h3 class="text-sm font-semibold">Add file</h3>
                  <label class="block text-xs text-gray-600 dark:text-gray-300"
                    >Full relative path<input
                      class="mt-1 w-full rounded-md border border-gray-300 bg-transparent px-3 py-2 outline-none focus:border-indigo-500 dark:border-gray-700"
                      placeholder="src/index.html"
                      required
                      on-input="setAddFilePath($event.target.value)"
                  /></label>
                  <template if="errorMessage"
                    ><p class="text-xs text-red-600 dark:text-red-400" role="alert">{{ errorMessage }}</p></template
                  >
                  <div class="flex justify-end gap-2">
                    <button
                      type="button"
                      class="rounded-md px-2 py-1 text-gray-500 dark:text-gray-300"
                      popovertarget="add-file-popover"
                      popovertargetaction="hide"
                    >
                      Cancel
                    </button>
                    <button

              <template if="commits.length > 0">
                <div

                >

                  <div class="min-w-0 flex-1">

                <template if="hasUncommitted"
                  ><form class="mb-3 flex gap-2" on-submit.prevent="commitChanges()">
                    <input
                      class="min-w-0 flex-1 rounded-md border border-amber-300 bg-amber-50 px-3 py-2 dark:border-amber-800 dark:bg-amber-950/30"
                      placeholder="Commit message"
                      on-input="setCommitMessage($event.target.value)"
                    /><button class="rounded-md bg-indigo-600 px-3 py-2 font-medium text-white hover:bg-indigo-500">
                      Commit
                    </button>
                  </form>
                  <template if="errorMessage"
                    ><p class="mb-3 text-xs text-red-600 dark:text-red-400" role="alert">
                      {{ errorMessage }}
                    </p></template
                  ></template
                >
                <div
                  class="flex min-h-64 flex-1 flex-col overflow-hidden rounded-lg border border-gray-200 dark:border-gray-800"
                >
                  <div
                    class="flex items-center gap-2 p-2 border-b border-gray-200 dark:border-gray-800 dark:bg-gray-900/50"
                  >
                    <label for="repo-upload-input" class="sr-only">Upload files</label>
                    <input
                      id="repo-upload-input"
                      class="max-w-full text-xs text-gray-600 file:mr-2 file:rounded file:border-0 file:bg-transparent file:px-2 file:py-1 file:text-xs file:text-indigo-600 dark:text-gray-300 dark:file:text-indigo-300"
                      type="file"
                      multiple
                      on-change="handleFileSelect($event.target.files)"

                  </div>
                  <ul class="divide-y divide-gray-100 overflow-y-auto dark:divide-gray-800">

                      ><li

                        <a attr-href="entryHref(entry)" class="flex min-w-0 flex-1 items-center gap-3"

                            ></span

              <template if="commits.length === 0">

                    <p class="mt-2 text-gray-600 dark:text-gray-300">Start by uploading your first file.</p>
                    <template if="dragging"
                      ><p class="mt-2 text-sm font-medium text-indigo-600 dark:text-indigo-300">

                      </p></template
                    >
                    <label for="repo-file-input" class="sr-only">Select files to upload</label>
                    <input

                      class="mt-6 max-w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-xs dark:border-gray-700 dark:bg-gray-950"
                      type="file"
                      multiple
                      on-change="handleFileSelect($event.target.files)"
                    />

                      ><p class="mt-2 text-xs text-red-600 dark:text-red-400" role="alert">
                        {{ errorMessage }}
                      </p></template
                    >
                  </div>
                </div>
              </template>
              <template if="previewPath"
                ><div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 md:p-10">
                  <section
                    class="flex h-full w-full max-w-5xl flex-col overflow-hidden rounded-lg border border-gray-200 bg-white shadow-2xl dark:border-gray-700 dark:bg-gray-900"
                    role="dialog"
                    aria-modal="true"
                    aria-label="File preview"
                  >

                      class="flex items-center justify-between border-b border-gray-200 px-4 py-3 dark:border-gray-800"

                        attr-href="rootHref"
                        class="rounded px-2 py-1 text-gray-500 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800"

                        ><i class="fa-solid fa-xmark"></i
                      ></a>

                  </section>
                </div></template

            </template>
          </section>
          <script state type="application/json">
            {
              "org": "",
              "repo": null,
              "entries": [],
              "commits": [],
              "directory": "",
              "previewPath": "",
              "fileContent": "",
              "repoName": "",
              "commitMessage": "",
              "dragging": false,
              "errorMessage": "",
              "darkMode": true
            }
          </script>
          <script setup>
            import { ref, computed, onInit } from "@li3/web";
            export default function () {
              const org = ref(new URL(window.location.href).searchParams.get("org") || "");
              const orgName = ref("");
              const orgError = ref("");
              const repo = ref(null);
              const entries = ref([]);
              const commits = ref([]);
              const directory = ref("");
              const previewPath = ref("");
              const fileContent = ref("");
              const repoName = ref("");
              const addFilePath = ref("");
              const commitMessage = ref("");
              const dragging = ref(false);
              const errorMessage = ref("");
              const savedTheme = localStorage.getItem("theme");
              const darkMode = ref(
                savedTheme ? savedTheme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches,
              );
              const hasUncommitted = computed(() => entries.value.some((entry) => entry.uncommitted));
              const url = () => new URL(window.location.href);
              const base = () =>
                `/api/v1/orgs/${encodeURIComponent(new URL(window.location.href).searchParams.get("org"))}/repos/${encodeURIComponent(repo.value.repo)}`;
              const rootHref = computed(
                () =>
                  `/?org=${encodeURIComponent(url().searchParams.get("org") || "")}&repo=${encodeURIComponent(repo.value?.repo || "")}`,
              );
              const setRepoName = (value) => {
                repoName.value = value;
              };
              const setOrgName = (value) => {
                orgName.value = value;
              };
              const createOrganization = async () => {
                const slug = orgName.value.trim();
                orgError.value = "";
                if (!/^[a-zA-Z0-9](?:[a-zA-Z0-9._-]{0,61}[a-zA-Z0-9])?$/.test(slug)) {
                  orgError.value =
                    "Use 1–63 letters, numbers, dots, underscores, or hyphens; start and end with a letter or number.";
                  return;
                }
                try {
                  const response = await fetch("/api/v1/orgs", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", ...tokenHeaders() },
                    body: JSON.stringify({ slug }),
                  });
                  if (!response.ok) {
                    const result = await response.json().catch(() => ({}));
                    throw new Error(
                      response.status === 401 || response.status === 403
                        ? "Sign in with repository write access to create an organization."
                        : result.error || "Organization creation failed.",
                    );
                  }
                  const result = await response.json();
                  window.location.assign(`/?org=${encodeURIComponent(result.slug)}`);
                } catch (error) {
                  orgError.value = error.message || "Organization creation failed.";
                }
              };
              const setCommitMessage = (value) => {
                commitMessage.value = value;
              };
              const setAddFilePath = (value) => {
                addFilePath.value = value;
              };
              const setDragging = (value) => {
                dragging.value = value;
              };
              const entryHref = (entry) => {
                const target = entry.type === "directory" ? { dir: entry.path } : { path: entry.path };
                const current = url();
                current.searchParams.set("repo", repo.value.repo);
                current.searchParams.delete("path");
                current.searchParams.delete("dir");
                current.searchParams.set(
                  entry.type === "directory" ? "dir" : "path",
                  target[entry.type === "directory" ? "dir" : "path"],
                );
                return `${current.pathname}${current.search}${current.hash}`;
              };
              const tokenHeaders = () => {
                const token = localStorage.getItem("access_token");
                return token ? { Authorization: `Bearer ${token}` } : {};
              };
              const load = async () => {
                const current = url();
                const name = current.searchParams.get("repo");
                directory.value = current.searchParams.get("dir") || "";
                previewPath.value = current.searchParams.get("path") || "";
                if (!name || !current.searchParams.get("org")) {
                  repo.value = null;
                  return;
                }
                repo.value = { repo: name };
                const apiBase = `/api/v1/orgs/${encodeURIComponent(current.searchParams.get("org"))}/repos/${encodeURIComponent(name)}`;
                const [treeResponse, logResponse] = await Promise.all([
                  fetch(`${apiBase}/tree${directory.value ? `?path=${encodeURIComponent(directory.value)}` : ""}`, {
                    headers: tokenHeaders(),
                  }),
                  fetch(`${apiBase}/log`, { headers: tokenHeaders() }),
                ]);
                if (treeResponse.ok) entries.value = await treeResponse.json();
                if (logResponse.ok) commits.value = await logResponse.json();
                if (previewPath.value) {
                  const response = await fetch(`${apiBase}/file?path=${encodeURIComponent(previewPath.value)}`, {
                    headers: tokenHeaders(),
                  });
                  fileContent.value = response.ok ? await response.text() : "Unable to load file";
                }
              };
              const createFirstRepository = async () => {
                const name = repoName.value.trim();
                if (!/^[a-zA-Z0-9._-]+$/.test(name)) {
                  errorMessage.value = "Use letters, numbers, dots, underscores, or hyphens.";
                  return;
                }
                try {
                  const response = await fetch(
                    `/api/v1/orgs/${encodeURIComponent(org.value)}/repos/${encodeURIComponent(name)}`,
                    {
                      method: "POST",
                      headers: tokenHeaders(),
                    },
                  );
                  if (response.ok)
                    window.location.assign(`/?org=${encodeURIComponent(org.value)}&repo=${encodeURIComponent(name)}`);
                  else {
                    const result = await response.json().catch(() => ({}));
                    errorMessage.value =
                      response.status === 401 || response.status === 403
                        ? "Sign in with repository write access."
                        : `${result.error || "Repository creation failed"} (${result.code || response.status})`;
                  }
                } catch {
                  errorMessage.value = "Repository creation failed.";
                }
              };
              const addFileToRepo = async () => {
                const filePath = addFilePath.value.trim();
                if (!filePath) {
                  errorMessage.value = "Enter a file path.";
                  return;
                }
                if (filePath.startsWith("/") || filePath.split("/").includes("..") || filePath.includes("\\")) {
                  errorMessage.value = "Invalid path: use a repository-relative path without '..'.";
                  return;
                }

                errorMessage.value = "";
                try {
                  const fileResponse = await fetch(`${base()}/files`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", ...tokenHeaders() },
                    body: JSON.stringify({ path: filePath, content: "" }),
                  });
                  if (!fileResponse.ok) {
                    errorMessage.value = "Failed to create file.";
                    return;
                  }
                  const stageResponse = await fetch(`${base()}/stage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", ...tokenHeaders() },
                    body: JSON.stringify({ files: [filePath] }),
                  });
                  if (!stageResponse.ok) {
                    errorMessage.value = "Failed to stage file.";
                    return;
                  }
                  const commitResponse = await fetch(`${base()}/commit`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", ...tokenHeaders() },
                    body: JSON.stringify({ message: `Add ${filePath}` }),
                  });
                  if (!commitResponse.ok) {
                    errorMessage.value = "Failed to commit file.";
                    return;
                  }
                  window.location.reload();
                } catch {
                  errorMessage.value = "Could not create and commit the file.";
                }
              };
              const commitChanges = async () => {
                errorMessage.value = "";
                try {
                  const files = entries.value
                    .filter((entry) => entry.uncommitted && entry.type === "file")
                    .map((entry) => entry.path);
                  if (files.length) {
                    const stage = await fetch(`${base()}/stage`, {
                      method: "POST",
                      headers: { "Content-Type": "application/json", ...tokenHeaders() },
                      body: JSON.stringify({ files }),
                    });
                    if (!stage.ok) throw new Error("Could not stage files. Sign in and try again.");
                  }
                  const response = await fetch(`${base()}/commit`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", ...tokenHeaders() },
                    body: JSON.stringify({ message: commitMessage.value || "autocommit" }),
                  });
                  if (!response.ok) throw new Error("Could not commit changes. Sign in and try again.");
                  const current = url();
                  current.searchParams.delete("path");
                  window.location.assign(current);
                } catch (error) {
                  errorMessage.value = error.message;
                }
              };
              const uploadFiles = async (files) => {
                const uploadedPaths = [];
                for (const file of Array.from(files)) {
                  const content = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(String(reader.result).split(",")[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                  });
                  const filePath = directory.value ? `${directory.value}/${file.name}` : file.name;
                  const response = await fetch(`${base()}/files`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", ...tokenHeaders() },
                    body: JSON.stringify({ path: filePath, content }),
                  });
                  if (!response.ok) {
                    throw new Error("Upload failed. Sign in with repository write access and try again.");
                  }
                  uploadedPaths.push(filePath);
                }
                if (commits.value.length === 0 && uploadedPaths.length > 0) {
                  const stage = await fetch(`${base()}/stage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", ...tokenHeaders() },
                    body: JSON.stringify({ files: uploadedPaths }),
                  });
                  if (!stage.ok) throw new Error("Could not stage the uploaded files.");
                  const commit = await fetch(`${base()}/commit`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", ...tokenHeaders() },
                    body: JSON.stringify({ message: "Initial commit" }),
                  });
                  if (!commit.ok) throw new Error("Could not commit the uploaded files.");
                }
              };
              const upload = async (event) => {
                dragging.value = false;
                errorMessage.value = "";
                try {
                  await uploadFiles(event.dataTransfer.files);
                  window.location.reload();
                } catch (error) {
                  errorMessage.value = error.message;
                }
              };
              onInit(() => {
                load().catch(() => {
                  errorMessage.value = "Unable to load this repository.";
                });
                window.addEventListener("git-api-theme", (event) => {
                  darkMode.value = event.detail;
                });
              });
              const handleFileSelect = async (files) => {
                errorMessage.value = "";
                try {
                  await uploadFiles(files);
                  window.location.reload();
                } catch (error) {
                  errorMessage.value = error.message;
                }
              };
              return {
                repo,
                org,
                orgError,
                entries,
                commits,
                directory,
                previewPath,
                fileContent,
                repoName,
                addFilePath,
                commitMessage,
                dragging,
                errorMessage,
                darkMode,
                hasUncommitted,
                rootHref,
                setRepoName,
                setOrgName,
                setAddFilePath,
                setCommitMessage,
                setDragging,
                entryHref,
                createFirstRepository,
                createOrganization,
                addFileToRepo,
                commitChanges,
                upload,
                handleFileSelect,
              };
            }
          </script>
        </template>

        <template app>
          <template if="repo"
            ><aside
              class="h-40 w-full flex-shrink-0 overflow-y-auto border-t border-gray-200 bg-gray-50 p-4 dark:border-gray-800 dark:bg-gray-900 md:h-full md:w-64 md:border-l md:border-t-0"
              class-dark="darkMode"
            >
              <div class="mb-6">
                <h3
                  class="mb-3 flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-300"
                >
                  <i class="fa-solid fa-code-branch"></i> Branches
                  <button
                    popovertarget="branch-popover"
                    style="anchor-name: --branch-popover-anchor"
                    class="text-xs text-indigo-600 hover:underline dark:text-indigo-300"
                    aria-label="Create branch"
                  >
                    +
                  </button>
                </h3>
                <div
                  popover="auto"
                  id="branch-popover"
                  style="
                    position: fixed;
                    inset: auto;
                    margin: 0;
                    position-anchor: --branch-popover-anchor;
                    top: anchor(bottom);
                    left: anchor(left);
                  "
                  class="w-48 rounded-lg border border-gray-200 bg-white p-4 shadow-xl dark:border-gray-700 dark:bg-gray-900"
                >
                  <form on-submit.prevent="createBranch()" class="space-y-4">
                    <h3 class="text-sm font-semibold">Create branch</h3>
                    <label class="block text-xs text-gray-600 dark:text-gray-300"
                      >Branch name<input
                        class="mt-1 w-full rounded-md border border-gray-300 bg-transparent px-3 py-2 outline-none focus:border-indigo-500 dark:border-gray-700"
                        placeholder="main"
                        required
                        on-input="setBranchName($event.target.value)"
                    /></label>
                    <template if="errorMessage"
                      ><p class="text-xs text-red-600 dark:text-red-400" role="alert">{{ errorMessage }}</p></template
                    >
                    <div class="flex justify-end gap-2">
                      <button
                        type="button"
                        class="rounded-md px-2 py-1 text-gray-500 dark:text-gray-300"
                        popovertarget="branch-popover"
                        popovertargetaction="hide"
                      >
                        Cancel
                      </button>
                      <button
                        class="rounded-md bg-indigo-600 px-2 py-1 text-sm font-medium text-white hover:bg-indigo-500"
                        type="submit"
                      >
                        Create
                      </button>
                    </div>
                  </form>
                </div>
                <ul class="space-y-1">
                  <template for="branch of branches"
                    ><li>
                      <a
                        attr-href="refHref(branch)"
                        class="block rounded px-2 py-1.5 text-sm text-gray-600 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
                        >{{ branch }}</a
                      >
                    </li></template
                  >
                  <template if="!branches.length"
                    ><p class="text-xs text-gray-500 dark:text-gray-300">
                      No branches.
                      <button
                        type="button"
                        class="underline text-indigo-600 hover:text-indigo-800 dark:text-indigo-300 dark:hover:text-indigo-200"
                        popovertarget="branch-popover"
                      >
                        Create one
                      </button>
                    </p></template
                  >
                </ul>
              </div>
              <div>
                <h3
                  class="mb-3 flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-300"
                >
                  <i class="fa-solid fa-tags"></i> Tags
                  <button
                    popovertarget="tag-popover"
                    style="anchor-name: --tag-popover-anchor"
                    class="text-xs text-indigo-600 hover:underline dark:text-indigo-300"
                    aria-label="Create tag"
                  >
                    +
                  </button>
                </h3>
                <div
                  popover="auto"
                  id="tag-popover"
                  style="
                    position: fixed;
                    inset: auto;
                    margin: 0;
                    position-anchor: --tag-popover-anchor;
                    top: anchor(bottom);
                    left: anchor(left);
                  "
                  class="w-48 rounded-lg border border-gray-200 bg-white p-4 shadow-xl dark:border-gray-700 dark:bg-gray-900"
                >
                  <form on-submit.prevent="createTag()" class="space-y-4">
                    <h3 class="text-sm font-semibold">Create tag</h3>
                    <label class="block text-xs text-gray-600 dark:text-gray-300"
                      >Tag name<input
                        class="mt-1 w-full rounded-md border border-gray-300 bg-transparent px-3 py-2 outline-none focus:border-indigo-500 dark:border-gray-700"
                        placeholder="v1.0.0"
                        required
                        on-input="setTagName($event.target.value)"
                    /></label>
                    <template if="errorMessage"
                      ><p class="text-xs text-red-600 dark:text-red-400" role="alert">{{ errorMessage }}</p></template
                    >
                    <div class="flex justify-end gap-2">
                      <button
                        type="button"
                        class="rounded-md px-2 py-1 text-gray-500 dark:text-gray-300"
                        popovertarget="tag-popover"
                        popovertargetaction="hide"
                      >
                        Cancel
                      </button>
                      <button
                        class="rounded-md bg-indigo-600 px-2 py-1 text-sm font-medium text-white hover:bg-indigo-500"
                        type="submit"
                      >
                        Create
                      </button>
                    </div>
                  </form>
                </div>
                <ul class="space-y-1">
                  <template for="tag of tags"
                    ><li>
                      <a
                        attr-href="refHref(tag)"
                        class="flex items-center gap-2 rounded px-2 py-1.5 text-sm text-gray-600 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
                        ><i class="fa-solid fa-tag text-xs opacity-50"></i>{{ tag }}</a
                      >
                    </li></template
                  >
                  <template if="!tags.length"
                    ><p class="text-xs text-gray-500 dark:text-gray-300">
                      No tags.
                      <button
                        type="button"
                        class="underline text-indigo-600 hover:text-indigo-800 dark:text-indigo-300 dark:hover:text-indigo-200"
                        popovertarget="tag-popover"
                      >
                        Create one
                      </button>
                    </p></template
                  >
                </ul>
              </div>
            </aside></template
          >
          <script state type="application/json">
            { "repo": null, "branches": [], "tags": [], "errorMessage": "", "darkMode": true }
          </script>
          <script setup>
            import { ref, onInit } from "@li3/web";
            export default function () {
              const repo = ref(null);
              const branches = ref([]);
              const tags = ref([]);
              const branchName = ref("");
              const tagName = ref("");
              const errorMessage = ref("");
              const savedTheme = localStorage.getItem("theme");
              const darkMode = ref(
                savedTheme ? savedTheme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches,
              );
              const tokenHeaders = () => {
                const token = localStorage.getItem("access_token");
                return token ? { Authorization: `Bearer ${token}` } : {};
              };
              const refHref = (name) => {
                const current = new URL(window.location.href);
                current.searchParams.set("ref", name);
                return `${current.pathname}${current.search}${current.hash}`;
              };
              onInit(async () => {
                const query = new URL(window.location.href).searchParams;
                const name = query.get("repo");
                if (name && query.get("org")) {
                  repo.value = { repo: name };
                  const base = `/api/v1/orgs/${encodeURIComponent(query.get("org"))}/repos/${encodeURIComponent(name)}`;
                  const results = await Promise.all([
                    fetch(`${base}/branches`, { headers: tokenHeaders() }),
                    fetch(`${base}/tags`, { headers: tokenHeaders() }),
                  ]);
                  branches.value = results[0].ok ? await results[0].json() : [];
                  tags.value = results[1].ok ? await results[1].json() : [];
                }
                window.addEventListener("git-api-theme", (event) => {
                  darkMode.value = event.detail;
                });
              });
              const setBranchName = (value) => {
                branchName.value = value;
              };
              const setTagName = (value) => {
                tagName.value = value;
              };
              const createBranch = async () => {
                const name = branchName.value.trim();
                if (!name) return;
                errorMessage.value = "";
                try {
                  const response = await fetch(
                    `/api/v1/orgs/${encodeURIComponent(new URL(window.location.href).searchParams.get("org"))}/repos/${encodeURIComponent(repo.value.repo)}/branches`,
                    {
                      method: "POST",
                      headers: { "Content-Type": "application/json", ...tokenHeaders() },
                      body: JSON.stringify({ name }),
                    },
                  );
                  if (response.ok) window.location.reload();
                  else errorMessage.value = "Failed to create branch.";
                } catch {
                  errorMessage.value = "Failed to create branch.";
                }
              };
              const createTag = async () => {
                const name = tagName.value.trim();
                if (!name) return;
                errorMessage.value = "";
                try {
                  const response = await fetch(
                    `/api/v1/orgs/${encodeURIComponent(new URL(window.location.href).searchParams.get("org"))}/repos/${encodeURIComponent(repo.value.repo)}/tags`,
                    {
                      method: "POST",
                      headers: { "Content-Type": "application/json", ...tokenHeaders() },
                      body: JSON.stringify({ name }),
                    },
                  );
                  if (response.ok) window.location.reload();
                  else errorMessage.value = "Failed to create tag.";
                } catch {
                  errorMessage.value = "Failed to create tag.";
                }
              };
              return {
                repo,
                branches,
                tags,
                branchName,
                tagName,
                errorMessage,
                darkMode,
                refHref,
                setBranchName,
                setTagName,
                createBranch,
                createTag,
              };
            }
          </script>
        </template>
      </main>
    </div>
  </body>
</html>
