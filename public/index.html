<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitMini</title>
    <script type="importmap">
      { "imports": { "@li3/": "https://at-li3.static.apphor.de/" } }
    </script>
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <link rel="component" href="https://sodium.static.apphor.de/code-block.html" />
    <link rel="component" href="/ui/components/commit-hash.html" />
    <link rel="component" href="/ui/components/file-preview.html" />
    <link rel="component" href="/ui/components/selectable-code.html" />
    <link rel="component" href="/ui/components/organization-landing.html" />
    <link rel="component" href="/ui/components/organization-settings.html" />
    <link rel="component" href="/ui/components/org-webhooks.html" />
    <link rel="component" href="/ui/components/machine-git-credentials.html" />
    <link rel="component" href="/ui/components/personal-access-tokens.html" />
    <link rel="component" href="/ui/components/profile-settings.html" />
    <link rel="component" href="/ui/components/team-settings.html" />
    <link rel="component" href="/ui/components/sign-in-landing.html" />
    <script type="module">
      import "@li3/web";
    </script>
    <script>
      document.documentElement.classList.toggle("dark", window.matchMedia("(prefers-color-scheme: dark)").matches);
    </script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style type="text/tailwindcss">
      @source inline("hidden");
      @custom-variant dark (&:where(.dark, .dark *));
      @theme {
        --color-app-bg: #eef2ec;
        --color-brand: #3b714b;
        --color-brand-hover: #2f563b;
        --color-text-main: #1c201e;
        --font-sans: Inter, sans-serif;
      }
    </style>
  </head>
  <body
    class="m-0 flex h-dvh min-h-0 w-full flex-col overflow-hidden bg-app-bg font-sans text-sm text-text-main [scrollbar-width:thin] [scrollbar-color:#9ca3af_transparent] dark:bg-[#111713] dark:text-gray-100 max-md:h-auto max-md:min-h-dvh max-md:overflow-x-hidden max-md:overflow-y-auto"
  >
    <template app>
      <header
        class="relative z-30 flex h-[88px] shrink-0 items-center justify-between bg-app-bg px-6 py-4 dark:bg-[#111713] max-md:h-[72px] max-md:px-4 max-md:py-3"
      >
        <div class="flex min-w-0 items-center gap-2 overflow-hidden md:gap-3">
          <template if="showWorkspace && !settings"
            ><button
              class="p-2 text-gray-500 dark:text-gray-300 md:hidden"
              on-click="toggleSidebar()"
              aria-label="Toggle repositories"
            >
              <lucide-icon icon="menu" size="20"></lucide-icon></button
          ></template>
          <a href="/" class="flex h-full w-64 shrink-0 items-center gap-3 overflow-hidden max-md:w-32" aria-label="Home"
            ><svg
              data-testid="home-indicator"
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="0.5" y="0.5" width="23" height="23" rx="4" fill="#263d32" stroke="none" />
              <path d="M15 6a9 9 0 0 0-9 9V3" stroke="#c8e6a8" />
              <circle cx="18" cy="6" r="3" stroke="#c8e6a8" />
              <circle cx="6" cy="18" r="3" stroke="#c8e6a8" /></svg
            ><span class="text-2xl font-bold tracking-tight text-[#263d32] dark:text-[#c8e6a8]"
              >gitmini<span class="text-brand">.</span></span
            ></a
          >
          <nav
            aria-label="Workspace breadcrumbs"
            data-testid="workspace-breadcrumbs"
            class="flex min-w-0 items-center gap-4 overflow-hidden"
            class-hidden="!breadcrumbs.length"
          >
            <template for="breadcrumb of breadcrumbs"
              ><span class="shrink-0 text-gray-400" aria-hidden="true" class-hidden="!breadcrumb.showSeparator">/</span
              ><a
                data-testid="workspace-breadcrumb"
                attr-href="breadcrumb.href"
                attr-title="breadcrumb.label"
                class="max-w-[20vw] truncate text-base font-semibold hover:text-brand md:max-w-80 md:text-lg"
                >{{ breadcrumb.label }}</a
              ></template
            >
          </nav>
        </div>
        <div class="flex flex-shrink-0 items-center gap-2 sm:gap-4">
          <button
            class="rounded-full p-1 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white"
            on-click="toggleTheme()"
            aria-label="Toggle theme"
          >
            <lucide-icon bind-icon="darkMode ? 'sun' : 'moon'" size="20"></lucide-icon>
          </button>
          <template if="authStatus === 'authenticated' && profile"
            ><button
              on-click="openSettings()"
              type="button"
              class="flex items-center gap-4 rounded-full border border-gray-200 bg-white py-1.5 pl-1.5 pr-4 shadow-sm transition-shadow hover:shadow-md dark:border-[#344039] dark:bg-[#1a231d] max-md:gap-2 max-md:pr-2"
              title="Settings"
            >
              <span
                class="inline-flex size-8 shrink-0 items-center justify-center rounded-full bg-brand text-sm font-bold text-white"
                aria-hidden="true"
                >{{ userInitial }}</span
              >
              <span class="hidden flex-col justify-center leading-tight sm:flex"
                ><span class="text-sm font-semibold text-gray-900 dark:text-gray-100">{{ userAlias }}</span
                ><span class="text-[10px] text-gray-500 dark:text-gray-400">{{ userEmail }}</span></span
              >
              <lucide-icon icon="chevron-down" size="16" class="ml-1 shrink-0 text-gray-400"></lucide-icon></button
          ></template>
          <template if="authStatus === 'anonymous' || (authStatus === 'authenticated' && !profile)"
            ><a
              attr-href="userUrl"
              title="Sign in with OIDC"
              class="inline-flex items-center gap-2 rounded-lg bg-brand px-4 py-2 font-medium text-white transition-colors hover:bg-brand-hover"
            >
              <lucide-icon icon="log-in" size="18"></lucide-icon>
              <span>Sign in</span>
            </a></template
          >
        </div>
      </header>
      <div
        class="flex min-h-0 flex-1 gap-6 overflow-hidden bg-app-bg px-6 pb-6 pt-2 dark:bg-[#111713] max-md:min-h-[calc(100dvh-72px)] max-md:gap-4 max-md:overflow-visible max-md:p-4"
      >
        <template if="showWorkspace && orgRepositories.length > 0 && !settings">
          <aside
            data-testid="repository-sidebar"
            class="fixed inset-y-[72px] left-0 z-40 flex h-[calc(100dvh-72px)] w-52 min-h-0 shrink-0 -translate-x-full flex-col overflow-y-auto bg-app-bg transition-transform dark:bg-[#111713] max-md:shadow-[0_12px_32px_rgba(28,32,30,0.12)] md:relative md:inset-y-auto md:h-full md:min-h-0 md:max-h-full md:translate-x-0"
            class-translate-x-0="menuOpen"
          >
            <div class="relative pb-1">
              <div>
                <h2
                  data-testid="sidebar-section-heading"
                  class="flex min-h-[34px] items-center border-b border-[#e8ece9] py-0 pl-2 pr-9 text-[11px] font-bold uppercase tracking-[0.08em] text-[#65736a] dark:border-[#29342c] dark:text-[#aab6ac]"
                >
                  Repositories
                </h2>
                <nav
                  data-testid="repository-sidebar-list"
                  class="flex max-h-[min(50dvh,28rem)] flex-col gap-0.5 overflow-y-auto px-1 pb-2 pt-1 [scrollbar-gutter:stable]"
                >
                  <template for="repo of orgRepositories"
                    ><a
                      attr-href="repositoryNavHref(repo)"
                      class="flex min-h-8 items-center gap-2 rounded-md border border-transparent px-2 py-1.5 text-[13px] text-[#525e56] transition-colors hover:bg-white/55 dark:text-[#c1cbc3] dark:hover:bg-white/10 [&.selected]:border-[#cdded0] [&.selected]:bg-white [&.selected]:font-semibold [&.selected]:text-brand dark:[&.selected]:border-[#3d5844] dark:[&.selected]:bg-[#1a231d] dark:[&.selected]:text-[#a4d1ae]"
                      class-selected="isSelected(repo)"
                      on-click="closeMenu()"
                    >
                      <lucide-icon icon="bookmark" size="16" class="shrink-0 text-gray-400"></lucide-icon>
                      <span class="truncate">{{ repo.repo }}</span></a
                    ></template
                  >
                </nav>
              </div>
              <template if="canWrite"
                ><button
                  popovertarget="create-repo-popover"
                  class="[anchor-name:--create-repository-anchor] absolute right-1 top-[3px] inline-flex items-center gap-1 rounded-md bg-brand px-2 py-1 text-xs font-semibold text-white transition-colors hover:bg-brand-hover"
                  aria-label="Create repository"
                >
                  <lucide-icon icon="plus" size="14"></lucide-icon><span>New</span>
                </button></template
              >
              <template if="!canWrite"
                ><span
                  class="absolute right-2 top-[9px] text-[10px] text-[#87938a]"
                  title="Repository write access is required"
                  >Read-only</span
                ></template
              >
              <template if="canWrite"
                ><div
                  popover="auto"
                  id="create-repo-popover"
                  class="[position:fixed] inset-auto m-0 [position-anchor:--create-repository-anchor] [top:anchor(bottom)] [left:anchor(left)] open:max-md:[top:anchor(top)] open:max-md:left-4 open:max-md:w-auto open:max-md:max-w-[calc(100vw-32px)] open:max-md:max-h-[calc(100dvh-96px)] open:max-md:overflow-y-auto open:max-md:[translate:0_-100%] w-56 rounded-lg border border-gray-200 bg-white p-4 text-gray-900 shadow-xl dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100"
                >
                  <form on-submit.prevent="createRepository()" class="space-y-4">
                    <h2 class="text-lg font-semibold">Create repository</h2>
                    <label class="block text-sm text-gray-600 dark:text-gray-300"
                      >Repository name<input
                        class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 focus:border-brand focus:outline-2 focus:outline-brand/20 focus:outline-offset-1 dark:border-[#46544a] dark:bg-[#111713] dark:text-[#e5e9e5] dark:placeholder:text-[#98a49a]"
                        placeholder="my-project"
                        required
                        on-input="setRepoName($event.target.value)"
                    /></label>
                    <template if="errorMessage"
                      ><p class="text-xs text-red-600 dark:text-red-400" role="alert">{{ errorMessage }}</p></template
                    >
                    <div class="flex justify-end gap-2">
                      <button
                        type="button"
                        class="rounded-md px-3 py-2 text-gray-500 dark:text-gray-300"
                        popovertarget="create-repo-popover"
                        popovertargetaction="hide"
                      >
                        Cancel
                      </button>
                      <button
                        class="rounded-lg bg-brand px-3 py-2 font-medium text-white transition-colors hover:bg-brand-hover"
                        type="submit"
                      >
                        Create
                      </button>
                    </div>
                  </form>
                </div></template
              >
            </div>
            <template if="authStatus === 'authenticated' && repo && !settings">
              <div class="relative pb-1 dark:border-[#303b33]">
                <details class="group open:[&>summary>lucide-icon]:rotate-90">
                  <summary
                    data-testid="sidebar-section-heading"
                    class="flex min-h-[34px] cursor-pointer list-none items-center gap-[7px] border-b border-[#dfe5e0] py-0 pl-2 pr-9 text-[11px] font-bold uppercase tracking-[0.08em] text-[#65736a] marker:content-none dark:border-[#29342c] dark:text-[#aab6ac] [&::-webkit-details-marker]:hidden"
                  >
                    <lucide-icon
                      icon="chevron-right"
                      size="14"
                      class="block shrink-0 text-[#89958c] transition-transform"
                    ></lucide-icon
                    ><span>Branches</span>
                  </summary>
                  <ul class="space-y-0.5 px-1 pb-2 pt-1">
                    <template for="branch of branches"
                      ><li>
                        <a
                          attr-href="refHref(branch)"
                          class="block min-h-8 rounded-md border border-transparent px-2 py-[5px] text-[13px] text-[#525e56] transition-colors hover:bg-white/55 dark:text-[#c1cbc3] dark:hover:bg-white/10"
                          ><span class="truncate">{{ branch }}</span></a
                        >
                      </li></template
                    >
                    <template if="!branches.length"
                      ><li class="px-2 py-1 text-xs text-[#7a877e] dark:text-[#9aa69c]">
                        No branches.
                        <template if="canWrite"
                          ><button
                            type="button"
                            class="text-brand hover:text-brand-hover dark:text-green-300 dark:hover:text-green-200"
                            popovertarget="branch-popover"
                          >
                            Create one
                          </button></template
                        >
                      </li></template
                    >
                  </ul>
                </details>
                <template if="canWrite"
                  ><button
                    popovertarget="branch-popover"
                    class="[anchor-name:--branch-popover-anchor] absolute right-1 top-[3px] inline-flex size-[26px] items-center justify-center rounded-md text-[#66746a] hover:bg-white/75 hover:text-brand dark:text-[#aab6ac] dark:hover:bg-[#202a23] dark:hover:text-[#a4d1ae]"
                    aria-label="Create branch"
                  >
                    <lucide-icon icon="plus" size="16"></lucide-icon></button
                ></template>
                <template if="canWrite"
                  ><div
                    popover="auto"
                    id="branch-popover"
                    class="[position:fixed] inset-auto m-0 [position-anchor:--branch-popover-anchor] [top:anchor(bottom)] [left:anchor(left)] open:max-md:[top:anchor(top)] open:max-md:left-4 open:max-md:w-auto open:max-md:max-w-[calc(100vw-32px)] open:max-md:max-h-[calc(100dvh-96px)] open:max-md:overflow-y-auto open:max-md:[translate:0_-100%] w-48 rounded-lg border border-gray-200 bg-white p-4 text-gray-900 shadow-xl dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100"
                  >
                    <form on-submit.prevent="createBranch()" class="space-y-4">
                      <h3 class="text-sm font-semibold">Create branch</h3>
                      <label class="block text-xs text-gray-600 dark:text-gray-300"
                        >Branch name<input
                          class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 focus:border-brand focus:outline-2 focus:outline-brand/20 focus:outline-offset-1 dark:border-[#46544a] dark:bg-[#111713] dark:text-[#e5e9e5] dark:placeholder:text-[#98a49a]"
                          placeholder="main"
                          required
                          on-input="setBranchName($event.target.value)"
                      /></label>
                      <template if="errorMessage"
                        ><p class="text-xs text-red-600 dark:text-red-400" role="alert">{{ errorMessage }}</p></template
                      >
                      <div class="flex justify-end gap-2">
                        <button
                          type="button"
                          class="rounded-md px-2 py-1 text-gray-500 dark:text-gray-300"
                          popovertarget="branch-popover"
                          popovertargetaction="hide"
                        >
                          Cancel
                        </button>
                        <button
                          class="rounded-lg bg-brand px-2 py-1 text-sm font-medium text-white transition-colors hover:bg-brand-hover"
                          type="submit"
                        >
                          Create
                        </button>
                      </div>
                    </form>
                  </div></template
                >
              </div>
              <div class="relative pb-1 dark:border-[#303b33]">
                <details class="group open:[&>summary>lucide-icon]:rotate-90">
                  <summary
                    data-testid="sidebar-section-heading"
                    class="flex min-h-[34px] cursor-pointer list-none items-center gap-[7px] border-b border-[#dfe5e0] py-0 pl-2 pr-9 text-[11px] font-bold uppercase tracking-[0.08em] text-[#65736a] marker:content-none dark:border-[#29342c] dark:text-[#aab6ac] [&::-webkit-details-marker]:hidden"
                  >
                    <lucide-icon
                      icon="chevron-right"
                      size="14"
                      class="block shrink-0 text-[#89958c] transition-transform"
                    ></lucide-icon
                    ><span>Tags</span>
                  </summary>
                  <ul class="space-y-0.5 px-1 pb-2 pt-1">
                    <template for="tag of tags"
                      ><li>
                        <a
                          attr-href="refHref(tag)"
                          class="flex min-h-8 items-center gap-2 rounded-md border border-transparent px-2 py-[5px] text-[13px] text-[#525e56] transition-colors hover:bg-white/55 dark:text-[#c1cbc3] dark:hover:bg-white/10"
                          ><lucide-icon icon="tag" size="14" class="shrink-0 text-gray-400"></lucide-icon
                          ><span class="truncate">{{ tag }}</span></a
                        >
                      </li></template
                    >
                    <template if="!tags.length"
                      ><li class="px-2 py-1 text-xs text-[#7a877e] dark:text-[#9aa69c]">
                        No tags.
                        <template if="canWrite"
                          ><button
                            type="button"
                            class="text-brand hover:text-brand-hover dark:text-green-300 dark:hover:text-green-200"
                            popovertarget="tag-popover"
                          >
                            Create one
                          </button></template
                        >
                      </li></template
                    >
                  </ul>
                </details>
                <template if="canWrite"
                  ><button
                    popovertarget="tag-popover"
                    class="[anchor-name:--tag-popover-anchor] absolute right-1 top-[3px] inline-flex size-[26px] items-center justify-center rounded-md text-[#66746a] hover:bg-white/75 hover:text-brand dark:text-[#aab6ac] dark:hover:bg-[#202a23] dark:hover:text-[#a4d1ae]"
                    aria-label="Create tag"
                  >
                    <lucide-icon icon="plus" size="16"></lucide-icon></button
                ></template>
                <template if="canWrite"
                  ><div
                    popover="auto"
                    id="tag-popover"
                    class="[position:fixed] inset-auto m-0 [position-anchor:--tag-popover-anchor] [top:anchor(bottom)] [left:anchor(left)] open:max-md:[top:anchor(top)] open:max-md:left-4 open:max-md:w-auto open:max-md:max-w-[calc(100vw-32px)] open:max-md:max-h-[calc(100dvh-96px)] open:max-md:overflow-y-auto open:max-md:[translate:0_-100%] w-48 rounded-lg border border-gray-200 bg-white p-4 text-gray-900 shadow-xl dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100"
                  >
                    <form on-submit.prevent="createTag()" class="space-y-4">
                      <h3 class="text-sm font-semibold">Create tag</h3>
                      <label class="block text-xs text-gray-600 dark:text-gray-300"
                        >Tag name<input
                          class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 focus:border-brand focus:outline-2 focus:outline-brand/20 focus:outline-offset-1 dark:border-[#46544a] dark:bg-[#111713] dark:text-[#e5e9e5] dark:placeholder:text-[#98a49a]"
                          placeholder="v1.0.0"
                          required
                          on-input="setTagName($event.target.value)"
                      /></label>
                      <template if="errorMessage"
                        ><p class="text-xs text-red-600 dark:text-red-400" role="alert">{{ errorMessage }}</p></template
                      >
                      <div class="flex justify-end gap-2">
                        <button
                          type="button"
                          class="rounded-md px-2 py-1 text-gray-500 dark:text-gray-300"
                          popovertarget="tag-popover"
                          popovertargetaction="hide"
                        >
                          Cancel
                        </button>
                        <button
                          class="rounded-lg bg-brand px-2 py-1 text-sm font-medium text-white transition-colors hover:bg-brand-hover"
                          type="submit"
                        >
                          Create
                        </button>
                      </div>
                    </form>
                  </div></template
                >
              </div>
            </template>
          </aside>
          <template if="menuOpen"
            ><div class="fixed inset-x-0 bottom-0 top-[72px] z-30 bg-black/40 md:hidden" on-click="closeMenu()"></div
          ></template>
        </template>
        <main class="flex min-w-0 flex-1 flex-col overflow-hidden md:flex-row max-md:overflow-visible">
          <section
            class="flex min-h-0 min-w-0 flex-1 flex-col overflow-y-auto bg-transparent p-4 sm:p-6 max-md:overflow-visible"
            class-p-0="!org"
            on-dragover.prevent="setDragging(true)"
            on-dragleave="setDragging(false)"
            on-drop.prevent="upload($event)"
          >
            <template if="authStatus === 'anonymous'"
              ><sign-in-landing bind-sign-in-url="userUrl"></sign-in-landing
            ></template>
            <template if="authStatus === 'authenticated'">
              <template if="!canWrite"
                ><div
                  class="mb-4 rounded-md border border-amber-300 bg-amber-50 p-3 text-sm text-amber-900 dark:border-amber-800 dark:bg-amber-950/40 dark:text-amber-100"
                  role="status"
                >
                  Read-only access: this session does not have repository write access (repo:write). Ask your GitMini
                  administrator to enable it. You can browse repositories, but cannot create repositories or upload/add
                  files.
                </div></template
              >
              <template if="authStatus === 'authenticated' && settings && settingsTab === 'profile'"
                ><profile-settings class="flex min-h-0 flex-1" bind-profile="profile"></profile-settings
              ></template>
              <template if="authStatus === 'authenticated' && settings && settingsTab === 'organizations'"
                ><organization-settings
                  class="flex min-h-0 flex-1"
                  bind-can-write="canWrite"
                  bind-can-manage-org="canManageOrg"
                  bind-selected-org="settingsOrg"
                  bind-section="settingsSection"
                  bind-organizations="orgs"
                  bind-created="orgCreated"
                  bind-error="orgError"
                  on-createorg="createOrganization($event.detail)"
                  on-deleteorg="deleteOrganization($event.detail)"
                  on-retry="retryOrganizationLoad()"
                ></organization-settings
              ></template>
              <template if="authStatus === 'authenticated' && settings && settingsTab === 'tokens'"
                ><personal-access-tokens
                  class="flex min-h-0 flex-1"
                  bind-can-read="sessionCanRead"
                  bind-can-write="sessionCanWrite"
                ></personal-access-tokens
              ></template>
              <template if="authStatus === 'authenticated' && settings && settingsTab === 'team'"
                ><team-settings class="flex min-h-0 flex-1" on-teamchanged="refreshOrganizations()"></team-settings
              ></template>
              <template if="authStatus === 'authenticated' && repoLoadError && !settings"
                ><section class="m-auto max-w-xl p-6 text-center">
                  <p class="text-red-700 dark:text-red-300" role="alert">{{ repoLoadError }}</p>
                  <a attr-href="orgHref" class="mt-4 inline-block text-brand hover:underline dark:text-green-300"
                    >Back to organization</a
                  >
                </section></template
              >
              <template if="authStatus === 'authenticated' && !repo && !repoLoadError && !settings"
                ><organization-landing
                  class="flex min-h-0 flex-1"
                  bind-org="org"
                  bind-profile="profile"
                  bind-can-write="canWrite"
                  bind-organizations="orgs"
                  bind-organizations-loaded="organizationsLoaded"
                  bind-repositories="orgRepositories"
                  bind-repositories-loaded="orgRepositoriesLoaded"
                  bind-events="orgEvents"
                  bind-events-loaded="orgEventsLoaded"
                  bind-events-error="orgEventsError"
                  bind-has-more-events="orgEventsHasMore"
                  bind-org-error="orgError"
                  bind-error-message="errorMessage"
                  on-createorg="createOrganization($event.detail)"
                  on-createrepo="createFirstRepository($event.detail)"
                  on-loadmore="loadMoreEvents()"
                  on-retry="retryOrganizationLoad()"
                ></organization-landing
              ></template>
              <template if="repo && !settings"
                ><div class="flex min-h-0 flex-1 flex-col" data-repository-view>

          <script state>

          <script setup>
            import { ref, computed, onInit } from "@li3/web";
            export default function () {
              const org = ref(new URL(window.location.href).searchParams.get("org") || "");
              const routeOrg = ref(new URL(window.location.href).searchParams.get("org") || "");
              const routeRepo = ref(new URL(window.location.href).searchParams.get("repo") || "");
              const serverSession = ref(null);
              const authStatus = ref(
                serverSession.value?.checked
                  ? serverSession.value.authenticated
                    ? "authenticated"
                    : "anonymous"
                  : "anonymous",
              );
              const initialSettingsTab = new URL(window.location.href).searchParams.get("settings");
              const settings = ref(["profile", "organizations", "tokens", "team"].includes(initialSettingsTab));
              const settingsOrg = ref(new URL(window.location.href).searchParams.get("org") || "");
              const settingsSection = ref(new URL(window.location.href).searchParams.get("section") || "webhooks");
              const settingsTab = ref(
                ["profile", "organizations", "tokens", "team"].includes(initialSettingsTab)
                  ? initialSettingsTab
                  : "organizations",
              );
              const profile = ref(serverSession.value?.authenticated ? serverSession.value.profile : null);
              const sessionCanRead = ref(
                serverSession.value?.authenticated &&
                  (serverSession.value.canRead === true || serverSession.value.canWrite === true),
              );
              const sessionCanWrite = ref(serverSession.value?.authenticated && serverSession.value.canWrite === true);
              const canRead = ref(!routeOrg.value && sessionCanRead.value);
              const canWrite = ref(!routeOrg.value && sessionCanWrite.value);
              const canManageOrg = ref(!routeOrg.value && sessionCanWrite.value);
              const userUrl = ref("#");
              const darkMode = ref(window.matchMedia("(prefers-color-scheme: dark)").matches);
              const showWorkspace = ref(false);
              const menuOpen = ref(false);
              const orgs = ref([]);
              const organizationsLoaded = ref(false);
              const orgRepositories = ref([]);
              const orgRepositoriesLoaded = ref(false);
              const orgEvents = ref([]);
              const orgEventsLoaded = ref(false);
              const orgEventsError = ref("");
              const orgEventsHasMore = ref(false);
              const orgCreated = ref(false);
              const cloneUrlCopied = ref(false);
              const cloneUrlError = ref("");
              const repositoryTokenLabel = ref("");
              const repositoryTokenScope = ref("repo:read");
              const repositoryTokenExpiry = ref("");
              const repositoryTokenCreating = ref(false);
              const repositoryTokenError = ref("");
              const repositoryToken = ref("");
              const repositoryTokenCopied = ref(false);
              const branches = ref([]);
              const tags = ref([]);
              const branchName = ref("");
              const tagName = ref("");
              const repo = ref(null);
              const repoLabel = computed(() => routeRepo.value);
              const userAlias = computed(
                () => profile.value?.name || profile.value?.email?.split("@")[0] || "Signed in",
              );
              const userEmail = computed(() => profile.value?.email || "Signed in");
              const userInitial = computed(() => userAlias.value.trim().charAt(0).toUpperCase() || "U");
              const orgHref = computed(() => `/?org=${encodeURIComponent(routeOrg.value)}`);
              const repoHref = computed(
                () => `/?org=${encodeURIComponent(routeOrg.value)}&repo=${encodeURIComponent(routeRepo.value)}`,
              );
              const breadcrumbs = computed(() => {
                if (!profile.value || settings.value) return [];
                const items = [];
                if (routeOrg.value) {
                  items.push({
                    label: routeOrg.value,
                    href: orgHref.value,
                    showSeparator: false,
                  });
                }
                if (routeOrg.value && routeRepo.value) {
                  items.push({
                    label: routeRepo.value,
                    href: repoHref.value,
                    showSeparator: true,
                  });
                }
                return items;
              });
              const cloneUrl = computed(
                () =>
                  `${window.location.origin}/git/${encodeURIComponent(org.value)}/${encodeURIComponent(repoLabel.value)}.git`,
              );
              const folderHref = (targetDirectory) => {
                const current = url();
                current.searchParams.delete("path");
                current.searchParams.delete("dir");
                if (targetDirectory) current.searchParams.set("dir", targetDirectory);
                return `${current.pathname}${current.search}${current.hash}`;
              };
              const repositoryNavHref = (item) =>
                `/?org=${encodeURIComponent(org.value)}&repo=${encodeURIComponent(item.repo)}`;
              const isSelected = (item) => repoLabel.value === item.repo;
              const openSettings = () => navigate("/?settings=profile");
              const applyOrgCapabilities = (slug) => {
                const access = orgs.value.find((item) => item.slug === slug);

                  errorMessage.value = "Use letters, numbers, dots, underscores, or hyphens.";
                  return;
                }
                try {
                  const response = await fetch(
                    `/api/v1/orgs/${encodeURIComponent(org.value)}/repos/${encodeURIComponent(name)}`,
                    {
                      method: "POST",
                    },
                  );
                  if (response.ok)
                    await navigate(`/?org=${encodeURIComponent(org.value)}&repo=${encodeURIComponent(name)}`);
                  else {
                    const result = await response.json().catch(() => ({}));
                    errorMessage.value =
                      response.status === 401 || response.status === 403
                        ? "Sign in with repository write access."
                        : `${result.error || "Repository creation failed"} (${result.code || response.status})`;
                  }
                } catch {
                  errorMessage.value = "Repository creation failed.";
                }
              };
              const createRepository = async () => {
                if (!canWrite.value) {
                  errorMessage.value =
                    "Read-only access: repository write access (repo:write) is required to create a repository.";
                  return;
                }
                const name = repoName.value.trim();
                errorMessage.value = "";
                if (!/^[a-zA-Z0-9._-]+$/.test(name)) {
                  errorMessage.value = "Use letters, numbers, dots, underscores, or hyphens.";
                  return;
                }
                try {
                  const response = await fetch(
                    `/api/v1/orgs/${encodeURIComponent(org.value)}/repos/${encodeURIComponent(name)}`,
                    { method: "POST" },
                  );
                  if (!response.ok) {
                    const result = await response.json().catch(() => ({}));
                    throw new Error(
                      response.status === 401 || response.status === 403
                        ? "Sign in with repository write access."
                        : `${result.error || "Repository creation failed"} (${result.code || response.status})`,
                    );
                  }
                  repoName.value = "";
                  errorMessage.value = "";
                  resetAndClosePopover("create-repo-popover");
                  await navigate(repositoryNavHref({ repo: name }));
                } catch (error) {
                  errorMessage.value = error.message || "Repository creation failed.";
                }
              };
              const createBranch = async () => {
                if (!canWrite.value) {
                  errorMessage.value =
                    "Read-only access: ask your GitMini administrator to enable repository write access (repo:write).";
                  return;
                }
                const name = branchName.value.trim();
                if (!name) return;
                errorMessage.value = "";
                try {
                  const response = await fetch(`${base()}/branches`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name }),
                  });
                  if (response.ok) {
                    branchName.value = "";
                    errorMessage.value = "";
                    resetAndClosePopover("branch-popover");
                    await load();
                  } else throw new Error("Failed to create branch.");
                } catch (error) {
                  errorMessage.value = error.message;
                }
              };
              const createTag = async () => {
                if (!canWrite.value) {
                  errorMessage.value =
                    "Read-only access: ask your GitMini administrator to enable repository write access (repo:write).";
                  return;
                }
                const name = tagName.value.trim();
                if (!name) return;
                errorMessage.value = "";
                try {
                  const response = await fetch(`${base()}/tags`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name }),
                  });
                  if (response.ok) {
                    tagName.value = "";
                    errorMessage.value = "";
                    resetAndClosePopover("tag-popover");
                    await load();
                  } else throw new Error("Failed to create tag.");
                } catch (error) {
                  errorMessage.value = error.message;
                }
              };
              const addFileToRepo = async () => {
                if (!canWrite.value) {
                  addFileError.value =
                    "Read-only access: ask your GitMini administrator to enable repository write access (repo:write).";
                  return;
                }
                const filePath = addFilePath.value.trim();
                addFileError.value = "";
                if (!filePath) {
                  addFileError.value = "Enter a file path.";
                  return;
                }
                if (filePath.startsWith("/") || filePath.split("/").includes("..") || filePath.includes("\\")) {
                  addFileError.value = "Invalid path: use a repository-relative path without '..'.";
                  return;
                }

                try {
                  const fileResponse = await fetch(`${base()}/files`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ path: filePath, content: "" }),
                  });
                  if (!fileResponse.ok) {
                    const result = await fileResponse.json().catch(() => ({}));
                    addFileError.value =
                      fileResponse.status === 401
                        ? "Your sign-in session expired. Sign in again to create files."
                        : fileResponse.status === 403
                          ? "Your account does not have repository write access (repo:write)."
                          : result.error || `Failed to create file (${fileResponse.status}).`;
                    return;
                  }
                  const stageResponse = await fetch(`${base()}/stage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ files: [filePath] }),
                  });
                  if (!stageResponse.ok) {
                    const result = await stageResponse.json().catch(() => ({}));
                    addFileError.value = result.error || `Failed to stage file (${stageResponse.status}).`;
                    return;
                  }
                  const commitResponse = await fetch(`${base()}/commit`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: `Add ${filePath}` }),
                  });
                  if (!commitResponse.ok) {
                    const result = await commitResponse.json().catch(() => ({}));
                    addFileError.value = result.error || `Failed to commit file (${commitResponse.status}).`;
                    return;
                  }
                  addFilePath.value = "";
                  addFileError.value = "";
                  resetAndClosePopover("add-file-popover");
                  await load();
                } catch (error) {
                  addFileError.value = error.message || "Could not create and commit the file.";
                }
              };
              const commitChanges = async () => {
                if (!canWrite.value) {
                  errorMessage.value =
                    "Read-only access: ask your GitMini administrator to enable repository write access (repo:write).";
                  return;
                }
                errorMessage.value = "";
                try {
                  const files = entries.value
                    .filter((entry) => entry.uncommitted && entry.type === "file")
                    .map((entry) => entry.path);
                  if (files.length) {
                    const stage = await fetch(`${base()}/stage`, {
                      method: "POST",
                      headers: { "Content-Type": "application/json" },
                      body: JSON.stringify({ files }),
                    });
                    if (!stage.ok) throw new Error("Could not stage files. Sign in and try again.");
                  }
                  const response = await fetch(`${base()}/commit`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      message: commitMessage.value || "autocommit",
                    }),
                  });
                  if (!response.ok) throw new Error("Could not commit changes. Sign in and try again.");
                  const current = url();
                  current.searchParams.delete("path");
                  await navigate(current, false);
                } catch (error) {
                  errorMessage.value = error.message;
                }
              };
              const uploadFiles = async (files) => {
                if (!canWrite.value) {
                  errorMessage.value =
                    "Read-only access: repository write access (repo:write) is required to upload files.";
                  return;
                }
                const uploadedPaths = [];
                for (const file of Array.from(files)) {
                  const content = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(String(reader.result).split(",")[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                  });
                  const filePath = directory.value ? `${directory.value}/${file.name}` : file.name;
                  const response = await fetch(`${base()}/files`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ path: filePath, content }),
                  });
                  if (!response.ok) {
                    const result = await response.json().catch(() => ({}));
                    const message =
                      response.status === 401
                        ? "Your sign-in session expired. Sign in again to upload files."
                        : response.status === 403
                          ? "Your browser session does not have repository write access (repo:write). Ask your GitMini administrator to enable it."
                          : result.error || "Upload failed.";
                    throw new Error(`${message} (${response.status})`);
                  }
                  uploadedPaths.push(filePath);
                }
                if (commits.value.length === 0 && uploadedPaths.length > 0) {
                  const stage = await fetch(`${base()}/stage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ files: uploadedPaths }),
                  });
                  if (!stage.ok) {
                    const result = await stage.json().catch(() => ({}));
                    throw new Error(result.error || `Could not stage uploaded files (${stage.status}).`);
                  }
                  const commit = await fetch(`${base()}/commit`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: "Initial commit" }),
                  });
                  if (!commit.ok) {
                    const result = await commit.json().catch(() => ({}));
                    throw new Error(result.error || `Could not commit uploaded files (${commit.status}).`);
                  }
                }
              };
              const upload = async (event) => {
                dragging.value = false;
                if (!canWrite.value) {
                  errorMessage.value =
                    "Read-only access: repository write access (repo:write) is required to upload files.";
                  return;
                }
                errorMessage.value = "";
                try {
                  await uploadFiles(event.dataTransfer.files);
                  await load();
                } catch (error) {
                  errorMessage.value = error.message;
                }
              };
              onInit(async () => {
                const themeMedia = window.matchMedia("(prefers-color-scheme: dark)");
                const syncTheme = (isDark) => {
                  darkMode.value = isDark;
                  document.documentElement.classList.toggle("dark", isDark);
                };
                syncTheme(themeMedia.matches);
                themeMedia.addEventListener("change", (event) => syncTheme(event.matches));
                window.addEventListener("keydown", (event) => {
                  if (event.key === "Escape") closeMenu();
                });
                window.addEventListener("popstate", () => navigate(window.location.href, false));
                document.addEventListener("click", (event) => {
                  const link = event.target.closest("a[href]");
                  if (
                    !link ||
                    event.defaultPrevented ||
                    event.button !== 0 ||
                    event.metaKey ||
                    event.ctrlKey ||
                    event.shiftKey ||
                    event.altKey ||
                    link.target ||
                    link.origin !== location.origin
                  )
                    return;
                  const target = new URL(link.href);
                  if (target.pathname !== "/" && target.pathname !== "/ui/") return;
                  event.preventDefault();
                  navigate(target.href);
                });
                const config = await fetch("/ui/config")
                  .then((response) => response.json())
                  .catch(() => ({}));
                const currentUrl = url();
                const returnTo = `${currentUrl.pathname}${currentUrl.search}${currentUrl.hash}`;
                userUrl.value = config.oidcLoginUrl
                  ? `${config.oidcLoginUrl}?returnTo=${encodeURIComponent(returnTo)}`
                  : "#";
                let session = serverSession.value;
                if (!session?.checked) {
                  const sessionResponse = await fetch("/ui/session", {
                    credentials: "same-origin",
                  }).catch(() => null);
                  session = sessionResponse?.ok
                    ? await sessionResponse.json().catch(() => ({ authenticated: false }))
                    : { authenticated: false };
                }
                if (!session.authenticated) {
                  profile.value = null;
                  authStatus.value = "anonymous";
                  sessionCanRead.value = false;
                  sessionCanWrite.value = false;
                  applyOrgCapabilities("");
                  return;
                }
                profile.value = session.profile || null;
                sessionCanRead.value = session.canRead === true || session.canWrite === true;
                sessionCanWrite.value = session.canWrite === true;
                applyOrgCapabilities(org.value);
                const params = currentUrl.searchParams;
                org.value = params.get("org") || "";
                routeOrg.value = org.value;
                const requestedSettingsTab = params.get("settings");
                settings.value = ["profile", "organizations", "tokens", "team"].includes(requestedSettingsTab);
                settingsTab.value = ["profile", "organizations", "tokens", "team"].includes(requestedSettingsTab)
                  ? requestedSettingsTab
                  : "organizations";
                try {
                  await refreshOrganizations();
                } catch {
                  orgError.value = "Unable to load organizations.";
                }
                const requestedOrg = params.get("org");
                if (
                  requestedOrg &&
                  organizationsLoaded.value &&
                  !orgs.value.some((item) => item.slug === requestedOrg)
                ) {
                  if (orgs.value.length > 0) {
                    org.value = orgs.value[0].slug;
                    routeOrg.value = org.value;
                    currentUrl.searchParams.set("org", org.value);
                  } else {
                    org.value = "";
                    routeOrg.value = "";
                    currentUrl.searchParams.delete("org");
                  }
                  currentUrl.searchParams.delete("repo");
                  currentUrl.searchParams.delete("path");
                  currentUrl.searchParams.delete("dir");
                  await navigate(currentUrl, false);
                  return;
                }
                const initialRepositoryLoad = !settings.value && params.get("repo") ? load() : null;
                try {
                  await refreshOrgRepositories();
                } catch {
                  orgError.value = "Unable to load repositories for this organization.";
                }
                if (initialRepositoryLoad) {
                  try {
                    await initialRepositoryLoad;
                  } catch {
                    errorMessage.value = "Unable to load this repository.";
                  }
                } else if (!settings.value) {
                  try {
                    await load();
                  } catch {
                    errorMessage.value = "Unable to load this repository.";
                  }
                }
                authStatus.value = "authenticated";
              });
              const handleFileSelect = async (files) => {
                if (!canWrite.value) {
                  errorMessage.value =
                    "Read-only access: repository write access (repo:write) is required to upload files.";
                  return;
                }
                errorMessage.value = "";
                try {
                  await uploadFiles(files);
                  await load();
                } catch (error) {
                  errorMessage.value = error.message;
                }
              };
              return {
                profile,
                canRead,
                canWrite,
                canManageOrg,
                sessionCanRead,
                sessionCanWrite,
                userUrl,
                darkMode,
                showWorkspace,
                menuOpen,
                userAlias,
                userEmail,
                userInitial,
                breadcrumbs,
                repoLabel,
                repoHref,
                repositoryNavHref,
                directorySegments,
                entryIcon,
                folderHref,
                isSelected,
                openSettings,
                closePreview,
                setThreadSelection,
                toggleTheme,
                toggleSidebar,
                closeMenu,
                repo,
                settings,
                orgs,
                organizationsLoaded,
                orgRepositories,
                orgRepositoriesLoaded,
                orgEvents,
                orgEventsLoaded,
                orgEventsError,
                orgEventsHasMore,
                orgCreated,
                settingsTab,
                settingsOrg,
                settingsSection,
                orgHref,
                routeOrg,
                retryOrganizationLoad,
                loadMoreEvents,
                org,
                orgError,
                cloneUrl,
                cloneUrlCopied,
                cloneUrlError,
                repositoryTokenLabel,
                repositoryTokenScope,
                repositoryTokenExpiry,
                repositoryTokenCreating,
                repositoryTokenError,
                repositoryToken,
                repositoryTokenCopied,
                entries,
                commits,
                directory,
                previewPath,
                previewLanguage,
                previewIcon,
                fileContent,
                previewUrl,
                previewLoading,
                previewCommit,
                threadSelection,
                repoName,
                addFilePath,
                commitMessage,
                dragging,
                errorMessage,
                repoLoadError,
                addFileError,
                authStatus,
                hasUncommitted,
                rootHref,
                branches,
                tags,
                refHref,
                setBranchName,
                setTagName,
                createBranch,
                createTag,
                setRepoName,
                setAddFilePath,
                setCommitMessage,
                setDragging,
                entryHref,
                createFirstRepository,
                createOrganization,
                deleteOrganization,
                refreshOrganizations,
                createRepository,
                deleteRepository,
                setRepositoryTokenLabel,
                setRepositoryTokenScope,
                setRepositoryTokenExpiry,
                clearRepositoryToken,
                setClonePopoverOpen,
                toggleClonePopover,
                handleClonePopoverToggle,
                copyCloneUrl,
                copyRepositoryToken,
                createRepositoryToken,
                addFileToRepo,
                commitChanges,
                upload,
                handleFileSelect,
              };
            }
          </script>
        </main>
      </div>
    </template>
  </body>
</html>
