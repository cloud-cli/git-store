<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Store</title>
    <script type="importmap">
      { "imports": { "@li3/": "https://cdn.li3.dev/@li3/" } }
    </script>
    <link rel="component" href="/ui/components/organization-landing.html" />
    <link rel="component" href="/ui/components/organization-settings.html" />
    <link rel="component" href="/ui/components/sign-in-landing.html" />
    <script type="module">
      import "@li3/web";
    </script>
    <script>
      document.documentElement.classList.toggle("dark", window.matchMedia("(prefers-color-scheme: dark)").matches);
    </script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
      @theme {
        --color-app-bg: #eef2ec;
        --color-brand: #3b714b;
        --color-brand-hover: #2f563b;
        --color-text-main: #1c201e;
      }
    </style>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #eef2ec;
        color: #1c201e;
        font-family: Inter, sans-serif;
      }
      html.dark body {
        background: #111713;
        color: #e5e9e5;
      }
      .flow-topbar {
        height: 88px;
        border: 0;
        background: #eef2ec;
        padding: 16px 24px;
      }
      .dark .flow-topbar {
        background: #111713;
      }
      .home-indicator {
        display: block;
        width: 24px;
        height: 24px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: #3b714b;
      }
      .flow-user-card {
        min-height: 56px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #fff;
        padding: 6px 14px 6px 8px;
        box-shadow: 0 1px 2px rgb(28 32 30 / 8%);
      }
      .dark .flow-user-card {
        border-color: #344039;
        background: #1a231d;
      }
      .flow-avatar {
        display: inline-flex;
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #d6ecc9;
        color: #2c533c;
        font-size: 18px;
        font-weight: 700;
      }
      .flow-workspace {
        gap: 24px;
        padding: 8px 24px 24px;
        background: #eef2ec;
      }
      .flow-repo-breadcrumb {
        display: inline;
      }
      html.dark .flow-workspace {
        background: #111713;
      }
      .flow-repo-sidebar {
        border: 0;
        background: transparent;
      }
      .dark .flow-repo-sidebar {
        background: #111713;
      }
      .flow-sidebar-section {
        position: relative;
        border-top: 1px solid #dfe5e0;
        padding-bottom: 4px;
      }
      .flow-sidebar-section:first-child {
        border-top: 0;
      }
      .flow-sidebar-heading {
        display: flex;
        min-height: 34px;
        align-items: center;
        gap: 7px;
        padding: 0 36px 0 8px;
        color: #65736a;
        cursor: pointer;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        list-style: none;
        text-transform: uppercase;
      }
      .flow-sidebar-heading::-webkit-details-marker {
        display: none;
      }
      .flow-sidebar-heading .flow-disclosure-icon {
        color: #89958c;
        font-size: 13px;
        transition: transform 120ms ease;
      }
      .flow-sidebar-section details[open] > .flow-sidebar-heading {
        margin-bottom: 4px;
        border-bottom: 1px solid #e8ece9;
      }
      .flow-sidebar-section details[open] > .flow-sidebar-heading .flow-disclosure-icon {
        transform: rotate(90deg);
      }
      .dark .flow-sidebar-section {
        border-color: #303b33;
      }
      .dark .flow-sidebar-heading {
        color: #aab6ac;
      }
      .dark .flow-sidebar-section details[open] > .flow-sidebar-heading {
        border-color: #29342c;
      }
      .flow-sidebar-action {
        position: absolute;
        top: 3px;
        right: 4px;
        display: inline-flex;
        width: 26px;
        height: 26px;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        color: #66746a;
      }
      .flow-sidebar-action:hover {
        background: rgb(255 255 255 / 75%);
        color: #3b714b;
      }
      .flow-sidebar-readonly {
        position: absolute;
        top: 9px;
        right: 8px;
        color: #87938a;
        font-size: 10px;
      }
      .flow-sidebar-content {
        padding: 4px 4px 8px;
      }
      .flow-sidebar-item {
        min-height: 32px;
        border: 1px solid transparent;
        border-radius: 6px;
        color: #525e56;
        font-size: 13px;
        padding: 5px 8px;
      }
      .flow-sidebar-item:hover {
        background: rgb(255 255 255 / 55%);
      }
      .flow-sidebar-item.selected {
        border-color: #cdded0;
        background: #fff;
        color: #3b714b;
        font-weight: 600;
      }
      .dark .flow-sidebar-action {
        color: #aab6ac;
      }
      .dark .flow-sidebar-action:hover {
        background: #202a23;
        color: #a4d1ae;
      }
      .dark .flow-sidebar-item {
        color: #c1cbc3;
      }
      .dark .flow-sidebar-item.selected {
        border-color: #3d5844;
        background: #1a231d;
        color: #a4d1ae;
      }
      .flow-sidebar-empty {
        padding: 4px 8px;
        color: #7a877e;
        font-size: 12px;
      }
      .dark .flow-sidebar-empty {
        color: #9aa69c;
      }
      .flow-main {
        background: transparent;
      }
      .flow-main-content {
        background: transparent;
        padding: 0;
      }
      .flow-repo-page {
        display: flex;
        min-height: 0;
        flex: 1 1 auto;
        flex-direction: column;
      }
      organization-landing,
      organization-settings,
      sign-in-landing {
        display: flex;
        min-height: 0;
        flex: 1 1 auto;
      }
      .flow-repository-card {
        min-height: 0;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 1px 2px rgb(28 32 30 / 8%);
      }
      .dark .flow-repository-card {
        border-color: #344039;
        background: #171e19;
      }
      .flow-commit-header {
        min-height: 64px;
        border-color: #e5e7eb;
        background: rgb(248 250 249 / 86%);
      }
      .dark .flow-commit-header {
        border-color: #344039;
        background: #1d2620;
      }
      .flow-file-row {
        min-height: 45px;
        border-color: #eef0ee;
      }
      .dark .flow-file-row {
        border-color: #303b33;
      }
      .flow-dropzone {
        min-height: 120px;
        border: 2px dashed #e1e6e2;
        border-radius: 9px;
      }
      .flow-dropzone.dragging {
        border-color: #3b714b;
        background: #f1f7f1;
      }
      .dark .flow-dropzone {
        border-color: #3a4940;
      }
      .flow-onboarding-card {
        border: 1px solid #e1e5e1;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 1px 2px rgb(28 32 30 / 10%);
      }
      .dark .flow-onboarding-card {
        border-color: #344039;
        background: #1a231d;
      }
      .flow-icon-badge {
        background: #eef2ec;
        color: #3b714b;
      }
      .dark .flow-icon-badge {
        background: #23362a;
        color: #a4d1ae;
      }
      .flow-action {
        background: #3b714b;
        transition: background-color 150ms ease;
      }
      .flow-action:hover {
        background: #2f563b;
      }
      .flow-input {
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
      }
      .flow-input:focus {
        border-color: #3b714b;
        outline: 2px solid rgb(59 113 75 / 18%);
        outline-offset: 1px;
      }
      .dark .flow-input {
        border-color: #46544a;
        background: #111713;
        color: #e5e9e5;
      }
      .dark .flow-input::placeholder {
        color: #98a49a;
      }
      .flow-popover[popover] {
        position: fixed;
        inset: auto;
        margin: 0;
        top: anchor(bottom);
        left: anchor(left);
      }
      .workspace {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      @media (max-width: 767px) {
        html,
        body {
          height: auto;
          min-height: 100%;
        }
        body {
          min-height: 100vh;
          overflow-x: hidden;
          overflow-y: auto;
        }
        .flow-topbar {
          height: 72px;
          padding: 12px 16px;
        }
        .flow-user-card {
          min-height: 44px;
          gap: 8px;
          padding: 4px 8px;
        }
        .flow-avatar {
          width: 34px;
          height: 34px;
          font-size: 15px;
        }
        .flow-workspace {
          min-height: calc(100vh - 72px);
          gap: 16px;
          padding: 16px;
        }
        .flow-repo-sidebar {
          background: #eef2ec;
          box-shadow: 0 12px 32px rgb(28 32 30 / 12%);
        }
        html.dark .flow-repo-sidebar {
          background: #111713;
        }
        .flow-repo-breadcrumb {
          display: none;
        }
        .workspace {
          min-height: calc(100vh - 72px);
          overflow: visible;
        }
        .workspace > main,
        .workspace > main > section {
          overflow: visible;
        }
        .flow-popover[popover]:popover-open {
          inset: auto;
          top: anchor(top);
          left: 16px;
          width: auto;
          max-width: calc(100vw - 32px);
          max-height: calc(100vh - 96px);
          overflow-y: auto;
          translate: 0 -100%;
        }
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #9ca3af;
        border-radius: 4px;
      }
    </style>
  </head>
  <body class="bg-app-bg text-sm text-text-main dark:bg-gray-950 dark:text-gray-100">
    <template app>
      <header class="flow-topbar relative z-30 flex flex-shrink-0 items-center justify-between">
        <div class="flex min-w-0 flex-1 items-center gap-2 overflow-hidden md:gap-3">
          <template if="showWorkspace && !settings"
            ><button
              class="p-2 text-gray-500 dark:text-gray-300 md:hidden"
              on-click="toggleSidebar()"
              aria-label="Toggle repositories"
            >
              <i class="ph ph-list text-lg"></i></button
          ></template>
          <a href="/" class="flex flex-shrink-0 items-center" aria-label="Home"
            ><span class="home-indicator" aria-hidden="true"></span
          ></a>
          <template if="profile && org && !settings"
            ><template if="showWorkspace"
              ><span class="flex-shrink-0 text-gray-400">/</span
              ><a
                attr-href="orgHref"
                attr-title="org"
                class="max-w-[18vw] truncate text-sm font-medium hover:text-brand md:max-w-80"
                >{{ org }}</a
              ></template
            ></template
          >
          <template if="profile && repoLabel && !settings"
            ><span class="flow-repo-breadcrumb flex-shrink-0 text-gray-400">/</span
            ><a
              attr-href="repoHref"
              attr-title="repo"
              class="flow-repo-breadcrumb max-w-[20vw] truncate text-sm font-medium hover:text-brand md:max-w-80"
              >{{ repoLabel }}</a
            ></template
          >
        </div>
        <div class="flex flex-shrink-0 items-center gap-2 sm:gap-4">
          <button
            class="rounded-full p-1 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white"
            on-click="toggleTheme()"
            aria-label="Toggle theme"
          >
            <i class="ph text-xl" bind-class="{ 'ph-sun': darkMode, 'ph-moon': !darkMode }"></i>
          </button>
          <template if="authStatus === 'authenticated' && profile"
            ><button
              on-click="openSettings()"
              type="button"
              class="flow-user-card flex items-center gap-3"
              title="Settings"
            >
              <span class="flow-avatar" aria-hidden="true">{{ userInitial }}</span>
              <span class="hidden text-right leading-tight sm:block"
                ><span class="block font-medium">{{ userAlias }}</span
                ><span class="block text-xs text-gray-500 dark:text-gray-400">{{ userEmail }}</span></span
              >
            </button></template
          >
          <template if="authStatus === 'anonymous' || (authStatus === 'authenticated' && !profile)"
            ><a
              attr-href="userUrl"
              title="Sign in with OIDC"
              class="flow-action inline-flex items-center gap-2 rounded-lg px-4 py-2 font-medium text-white transition-colors"
            >
              <i class="ph ph-arrow-right-to-line"></i>
              <span>Sign in</span>
            </a></template
          >
        </div>
      </header>
      <div class="flow-workspace workspace">
        <template if="showWorkspace && orgRepositories.length > 0 && !settings">
          <aside
            class="flow-repo-sidebar fixed inset-y-[72px] left-0 z-40 flex h-[calc(100vh-72px)] w-56 min-h-0 flex-shrink-0 -translate-x-full flex-col overflow-y-auto transition-transform md:relative md:inset-y-auto md:h-auto md:translate-x-0"
            class-translate-x-0="menuOpen"
          >
            <div class="flow-sidebar-section flow-sidebar-repositories">
              <details open>
                <summary class="flow-sidebar-heading">
                  <i class="ph ph-caret-right flow-disclosure-icon"></i><span>Repositories</span>
                </summary>
                <nav class="flow-sidebar-content flex flex-col gap-1">
                  <template for="repo of orgRepositories"
                    ><a
                      attr-href="repositoryNavHref(repo)"
                      class="flow-sidebar-item flex items-center gap-2 transition-colors"
                      class-selected="isSelected(repo)"
                      on-click="closeMenu()"
                      ><i class="ph ph-book-bookmark text-sm text-gray-400"></i>{{ repo.repo }}</a
                    ></template
                  >
                </nav>
              </details>
              <template if="canWrite"
                ><button
                  popovertarget="create-repo-popover"
                  style="anchor-name: --create-repository-anchor"
                  class="flow-sidebar-action"
                  aria-label="Create repository"
                >
                  <i class="ph ph-plus"></i></button
              ></template>
              <template if="!canWrite"
                ><span class="flow-sidebar-readonly" title="Repository write access is required"
                  >Read-only</span
                ></template
              >
              <template if="canWrite"
                ><div
                  popover="auto"
                  id="create-repo-popover"
                  style="position-anchor: --create-repository-anchor"
                  class="flow-popover w-56 rounded-lg border border-gray-200 bg-white p-4 text-gray-900 shadow-xl dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100"
                >
                  <form on-submit.prevent="createRepository()" class="space-y-4">
                    <h2 class="text-lg font-semibold">Create repository</h2>
                    <label class="block text-sm text-gray-600 dark:text-gray-300"
                      >Repository name<input
                        class="flow-input mt-1 w-full px-3 py-2"
                        placeholder="my-project"
                        required
                        on-input="setRepoName($event.target.value)"
                    /></label>
                    <template if="errorMessage"
                      ><p class="text-xs text-red-600 dark:text-red-400" role="alert">{{ errorMessage }}</p></template
                    >
                    <div class="flex justify-end gap-2">
                      <button
                        type="button"
                        class="rounded-md px-3 py-2 text-gray-500 dark:text-gray-300"
                        popovertarget="create-repo-popover"
                        popovertargetaction="hide"
                      >
                        Cancel
                      </button>
                      <button class="flow-action rounded-lg px-3 py-2 font-medium text-white" type="submit">
                        Create
                      </button>
                    </div>
                  </form>
                </div></template
              >
            </div>
            <template if="authStatus === 'authenticated' && repo && !settings">
              <div class="flow-sidebar-section">
                <details>
                  <summary class="flow-sidebar-heading">
                    <i class="ph ph-caret-right flow-disclosure-icon"></i><span>Branches</span>
                  </summary>
                  <ul class="flow-sidebar-content space-y-0.5">
                    <template for="branch of branches"
                      ><li>
                        <a attr-href="refHref(branch)" class="flow-sidebar-item block transition-colors"
                          >{{ branch }}</a
                        >
                      </li></template
                    >
                    <template if="!branches.length"
                      ><li class="flow-sidebar-empty">
                        No branches.
                        <template if="canWrite"
                          ><button
                            type="button"
                            class="text-brand hover:text-green-800 dark:text-green-300 dark:hover:text-green-200"
                            popovertarget="branch-popover"
                          >
                            Create one
                          </button></template
                        >
                      </li></template
                    >
                  </ul>
                </details>
                <template if="canWrite"
                  ><button
                    popovertarget="branch-popover"
                    style="anchor-name: --branch-popover-anchor"
                    class="flow-sidebar-action"
                    aria-label="Create branch"
                  >
                    <i class="ph ph-plus"></i></button
                ></template>
                <template if="canWrite"
                  ><div
                    popover="auto"
                    id="branch-popover"
                    style="position-anchor: --branch-popover-anchor"
                    class="flow-popover w-48 rounded-lg border border-gray-200 bg-white p-4 text-gray-900 shadow-xl dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100"
                  >
                    <form on-submit.prevent="createBranch()" class="space-y-4">
                      <h3 class="text-sm font-semibold">Create branch</h3>
                      <label class="block text-xs text-gray-600 dark:text-gray-300"
                        >Branch name<input
                          class="flow-input mt-1 w-full px-3 py-2"
                          placeholder="main"
                          required
                          on-input="setBranchName($event.target.value)"
                      /></label>
                      <template if="errorMessage"
                        ><p class="text-xs text-red-600 dark:text-red-400" role="alert">{{ errorMessage }}</p></template
                      >
                      <div class="flex justify-end gap-2">
                        <button
                          type="button"
                          class="rounded-md px-2 py-1 text-gray-500 dark:text-gray-300"
                          popovertarget="branch-popover"
                          popovertargetaction="hide"
                        >
                          Cancel
                        </button>
                        <button class="flow-action rounded-lg px-2 py-1 text-sm font-medium text-white" type="submit">
                          Create
                        </button>
                      </div>
                    </form>
                  </div></template
                >
              </div>
              <div class="flow-sidebar-section">
                <details>
                  <summary class="flow-sidebar-heading">
                    <i class="ph ph-caret-right flow-disclosure-icon"></i><span>Tags</span>
                  </summary>
                  <ul class="flow-sidebar-content space-y-0.5">
                    <template for="tag of tags"
                      ><li>
                        <a attr-href="refHref(tag)" class="flow-sidebar-item flex items-center gap-2 transition-colors"
                          ><i class="ph ph-tag text-xs text-gray-400"></i>{{ tag }}</a
                        >
                      </li></template
                    >
                    <template if="!tags.length"
                      ><li class="flow-sidebar-empty">
                        No tags.
                        <template if="canWrite"
                          ><button
                            type="button"
                            class="text-brand hover:text-green-800 dark:text-green-300 dark:hover:text-green-200"
                            popovertarget="tag-popover"
                          >
                            Create one
                          </button></template
                        >
                      </li></template
                    >
                  </ul>
                </details>
                <template if="canWrite"
                  ><button
                    popovertarget="tag-popover"
                    style="anchor-name: --tag-popover-anchor"
                    class="flow-sidebar-action"
                    aria-label="Create tag"
                  >
                    <i class="ph ph-plus"></i></button
                ></template>
                <template if="canWrite"
                  ><div
                    popover="auto"
                    id="tag-popover"
                    style="position-anchor: --tag-popover-anchor"
                    class="flow-popover w-48 rounded-lg border border-gray-200 bg-white p-4 text-gray-900 shadow-xl dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100"
                  >
                    <form on-submit.prevent="createTag()" class="space-y-4">
                      <h3 class="text-sm font-semibold">Create tag</h3>
                      <label class="block text-xs text-gray-600 dark:text-gray-300"
                        >Tag name<input
                          class="flow-input mt-1 w-full px-3 py-2"
                          placeholder="v1.0.0"
                          required
                          on-input="setTagName($event.target.value)"
                      /></label>
                      <template if="errorMessage"
                        ><p class="text-xs text-red-600 dark:text-red-400" role="alert">{{ errorMessage }}</p></template
                      >
                      <div class="flex justify-end gap-2">
                        <button
                          type="button"
                          class="rounded-md px-2 py-1 text-gray-500 dark:text-gray-300"
                          popovertarget="tag-popover"
                          popovertargetaction="hide"
                        >
                          Cancel
                        </button>
                        <button class="flow-action rounded-lg px-2 py-1 text-sm font-medium text-white" type="submit">
                          Create
                        </button>
                      </div>
                    </form>
                  </div></template
                >
              </div>
            </template>
          </aside>
          <template if="menuOpen"
            ><div class="fixed inset-0 z-30 bg-black/40 md:hidden" on-click="closeMenu()"></div
          ></template>
        </template>
        <main class="flow-main flex min-w-0 flex-1 flex-col overflow-hidden md:flex-row">
          <section
            class="flow-main-content flex min-h-0 min-w-0 flex-1 flex-col overflow-y-auto"
            on-dragover.prevent="setDragging(true)"
            on-dragleave="setDragging(false)"
            on-drop.prevent="upload($event)"
          >
            <template if="authStatus === 'loading'"
              ><div
                class="flex min-h-full flex-1 items-center justify-center text-gray-600 dark:text-gray-300"
                role="status"
              >
                Checking sign-in status…
              </div></template
            >
            <template if="authStatus === 'anonymous'"
              ><sign-in-landing bind-sign-in-url="userUrl"></sign-in-landing
            ></template>
            <template if="authStatus === 'authenticated'">
              <template if="!canWrite"
                ><div
                  class="mb-4 rounded-md border border-amber-300 bg-amber-50 p-3 text-sm text-amber-900 dark:border-amber-800 dark:bg-amber-950/40 dark:text-amber-100"
                  role="status"
                >
                  Read-only access: this session does not have repository write access (repo:write). Ask your Git Store
                  administrator to enable it. You can browse repositories, but cannot create repositories or upload/add
                  files.
                </div></template
              >
              <template if="authStatus === 'authenticated' && settings"
                ><organization-settings
                  bind-can-write="canWrite"
                  bind-organizations="orgs"
                  bind-created="orgCreated"
                  bind-error="orgError"
                  on-createorg="createOrganization($event.detail)"

              <template if="repo && !settings"
                ><div class="flow-repo-page" data-repository-view>
                  <div
                    class="mb-4 flex items-center justify-between gap-2 text-sm font-medium text-gray-600 dark:text-gray-300"

                    <template if="canWrite"
                      ><button

                    >

                  <template if="errorMessage"
                    ><p class="mb-3 text-xs text-red-600 dark:text-red-400" role="alert">
                      {{ errorMessage }}
                    </p></template
                  >
                  <template if="canWrite"
                    ><div
                      popover="auto"
                      id="add-file-popover"
                      style="position-anchor: --add-file-anchor"
                      class="flow-popover w-64 rounded-lg border border-gray-200 bg-white p-4 text-gray-900 shadow-xl dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100"
                    >
                      <form on-submit.prevent="addFileToRepo()" class="space-y-4">
                        <h3 class="text-sm font-semibold">Add file</h3>
                        <label class="block text-xs text-gray-600 dark:text-gray-300"
                          >Full relative path<input
                            class="flow-input mt-1 w-full px-3 py-2"
                            placeholder="src/index.html"
                            required
                            on-input="setAddFilePath($event.target.value)"
                        /></label>
                        <template if="addFileError"
                          ><p class="text-xs text-red-600 dark:text-red-400" role="alert">
                            {{ addFileError }}
                          </p></template
                        >
                        <div class="flex justify-end gap-2">
                          <button
                            type="button"
                            class="rounded-md px-2 py-1 text-gray-500 dark:text-gray-300"
                            popovertarget="add-file-popover"
                            popovertargetaction="hide"
                          >
                            Cancel
                          </button>
                          <button class="flow-action rounded-lg px-2 py-1 text-sm font-medium text-white" type="submit">
                            Create
                          </button>
                        </div>
                      </form>
                    </div></template
                  >
                  <template if="commits.length > 0">
                    <div class="flow-repository-card flex flex-1 flex-col overflow-hidden">
                      <div class="flow-commit-header flex shrink-0 items-center justify-between border-b p-4">
                        <div class="flex min-w-0 items-center gap-3">
                          <div
                            class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-gray-200 text-gray-600 dark:bg-gray-800 dark:text-gray-300"
                          >
                            <i class="ph ph-git-commit text-lg"></i>
                          </div>
                          <div class="flex min-w-0 flex-col sm:flex-row sm:items-center sm:gap-2">
                            <span class="truncate text-sm font-semibold">{{ commits[0].message }}</span>
                            <span class="text-xs text-gray-500 dark:text-gray-300">{{ commits[0].author_name }}</span>
                          </div>
                        </div>
                        <code
                          class="ml-3 shrink-0 rounded-md border border-gray-300 bg-gray-200/80 px-2.5 py-1 font-mono text-xs text-gray-700 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200"
                          >{{ commits[0].hash.slice(0, 7) }}</code
                        >
                      </div>
                      <template if="hasUncommitted && canWrite"
                        ><form

                          <input

                        <template if="errorMessage"
                          ><p
                            class="border-b border-gray-100 px-4 py-2 text-xs text-red-600 dark:border-gray-800 dark:text-red-400"
                            role="alert"
                          >
                            {{ errorMessage }}
                          </p></template
                        ></template
                      >
                      <div
                        class="flex shrink-0 items-center gap-2 border-b border-gray-100 px-4 py-3 text-sm dark:border-gray-800"
                      >
                        <template if="canWrite"
                          ><label for="repo-upload-input" class="cursor-pointer font-medium text-brand hover:underline"

                          >
                          <input
                            id="repo-upload-input"
                            class="sr-only"

                          <span class="text-gray-400">No file chosen</span></template
                        >
                        <template if="!canWrite"><span class="text-gray-500">Read-only access</span></template>
                      </div>
                      <ul class="min-h-0 flex-1 divide-y divide-gray-100 overflow-y-auto dark:divide-gray-800">
                        <template for="entry of entries"
                          ><li
                            class="flow-file-row flex items-center justify-between px-4 py-2.5 hover:bg-gray-50 dark:hover:bg-gray-900/50"
                          >
                            <a attr-href="entryHref(entry)" class="flex min-w-0 flex-1 items-center gap-3">
                              <i
                                class="ph w-4 text-center text-lg text-gray-400"
                                bind-class="{ 'ph-folder': entry.type === 'directory', 'ph-file': entry.type === 'file', 'text-brand': entry.type === 'directory' }"
                              ></i>
                              <span class="truncate text-sm font-medium text-gray-700 dark:text-gray-200"
                                >{{ entry.name }}<sup class="ml-1 text-amber-500"
                                  >{{ entry.uncommitted ? '*' : '' }}</sup
                                ></span
                              >
                            </a>
                            <span class="ml-3 max-w-[45%] truncate text-xs text-gray-400"
                              >{{ entry.uncommitted ? 'Uncommitted' : entry.type }}</span
                            >
                          </li></template
                        >
                      </ul>
                      <div
                        class="flow-dropzone m-6 mt-auto flex shrink-0 flex-col items-center justify-center bg-white p-6 text-center text-sm text-gray-500 transition-colors hover:bg-gray-50 dark:bg-transparent dark:text-gray-300 dark:hover:bg-gray-900/50"
                        class-dragging="dragging"
                      >
                        <i class="ph ph-upload-simple mb-2 text-2xl text-gray-400"></i>
                        <span>Drop files here to upload them unstaged</span>
                      </div>
                    </div>
                  </template>
                  <template if="commits.length === 0">
                    <div
                      class="flow-repository-card flex min-h-0 flex-1 flex-col items-center justify-center p-6 text-center"
                    >
                      <div class="mx-auto w-full max-w-md">
                        <div
                          class="flow-icon-badge mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full"
                        >
                          <i class="ph ph-git-branch text-2xl"></i>
                        </div>
                        <h1 class="text-xl font-bold">Welcome to your Git server</h1>
                        <template if="canWrite"
                          ><p class="mt-2 text-sm text-gray-500 dark:text-gray-300">
                            Start by uploading your first file.
                          </p></template
                        >
                        <template if="!canWrite"
                          ><p class="mt-2 text-sm text-gray-500 dark:text-gray-300">
                            This repository is empty. Ask your Git Store administrator to enable repository write access
                            (repo:write) to add files.
                          </p></template
                        >
                        <template if="dragging"
                          ><p class="mt-2 text-sm font-medium text-brand dark:text-green-300">
                            Drop files to upload.
                          </p></template
                        >
                        <template if="canWrite"
                          ><label for="repo-file-input" class="sr-only">Select files to upload</label>
                          <input
                            id="repo-file-input"
                            class="sr-only"
                            type="file"
                            multiple
                            on-change="handleFileSelect($event.target.files)"
                        /></template>
                        <template if="errorMessage"
                          ><p class="mt-2 text-xs text-red-600 dark:text-red-400" role="alert">
                            {{ errorMessage }}
                          </p></template
                        >
                      </div>
                      <div
                        class="flow-dropzone mt-8 flex w-full max-w-3xl shrink-0 flex-col items-center justify-center p-6 text-sm text-gray-500"
                        class-dragging="dragging"
                      >
                        <i class="ph ph-upload-simple mb-2 text-2xl text-gray-400"></i>
                        <span>Drop files here to upload them unstaged</span>
                        <template if="canWrite"
                          ><label
                            for="repo-file-input"
                            class="mt-2 cursor-pointer font-medium text-brand hover:underline"
                            >Browse files</label
                          ></template
                        >
                      </div>
                    </div>
                  </template>
                  <template if="previewPath"
                    ><div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 md:p-10">
                      <section
                        class="flex h-full w-full max-w-5xl flex-col overflow-hidden rounded-lg border border-gray-200 bg-white text-gray-900 shadow-2xl dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100"
                        role="dialog"
                        aria-modal="true"
                        aria-label="File preview"
                      >
                        <header
                          class="flex items-center justify-between border-b border-gray-200 px-4 py-3 dark:border-gray-800"
                        >
                          <div class="font-medium">{{ previewPath }}</div>
                          <button
                            on-click="closePreview()"
                            class="rounded px-2 py-1 text-gray-500 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800"
                            aria-label="Close preview"
                          >
                            <i class="ph ph-x"></i>
                          </button>
                        </header>
                        <template if="previewLoading"
                          ><p class="flex-1 p-4 text-center text-gray-500" role="status">Loading preview…</p></template
                        >
                        <template if="!previewLoading && previewUrl"
                          ><img
                            attr-src="previewUrl"
                            alt="Image preview"
                            class="max-h-full max-w-full self-center object-contain p-4"
                        /></template>
                        <template if="!previewLoading && !previewUrl">
                          <pre class="flex-1 overflow-auto p-4 text-xs leading-5">{{ fileContent }}</pre>
                        </template>
                      </section>
                    </div></template
                  >
                </div>
              </template>
            </template>
          </section>

          <script setup>
            import { ref, computed, onInit } from "@li3/web";
            export default function () {
              const org = ref(new URL(window.location.href).searchParams.get("org") || "");
              const authStatus = ref("loading");
              const settings = ref(new URL(window.location.href).searchParams.get("settings") === "organizations");
              const profile = ref(null);
              const canWrite = ref(false);
              const userUrl = ref("#");
              const darkMode = ref(window.matchMedia("(prefers-color-scheme: dark)").matches);
              const showWorkspace = ref(false);
              const menuOpen = ref(false);
              const orgs = ref([]);
              const organizationsLoaded = ref(false);
              const orgRepositories = ref([]);
              const orgRepositoriesLoaded = ref(false);
              const orgCreated = ref(false);
              const branches = ref([]);
              const tags = ref([]);
              const branchName = ref("");
              const tagName = ref("");
              const repo = ref(null);
              const repoLabel = computed(() => repo.value?.repo || "");
              const userAlias = computed(
                () => profile.value?.name || profile.value?.email?.split("@")[0] || "Signed in",
              );
              const userEmail = computed(() => profile.value?.email || "Signed in");
              const userInitial = computed(() => userAlias.value.trim().charAt(0).toUpperCase() || "U");
              const orgHref = computed(() => `/?org=${encodeURIComponent(org.value)}`);
              const repoHref = computed(
                () => `/?org=${encodeURIComponent(org.value)}&repo=${encodeURIComponent(repoLabel.value)}`,
              );
              const repositoryNavHref = (item) =>
                `/?org=${encodeURIComponent(org.value)}&repo=${encodeURIComponent(item.repo)}`;
              const isSelected = (item) => repoLabel.value === item.repo;
              const openSettings = () => navigate("/?settings=organizations");
              const toggleTheme = () => {
                darkMode.value = !darkMode.value;
                document.documentElement.classList.toggle("dark", darkMode.value);
              };
              const toggleSidebar = () => {
                menuOpen.value = !menuOpen.value;
              };
              const closeMenu = () => {
                menuOpen.value = false;
              };
              const setBranchName = (value) => {
                branchName.value = value;
              };
              const setTagName = (value) => {
                tagName.value = value;
              };
              const refHref = (name) => {
                const current = url();
                current.searchParams.set("ref", name);
                return `${current.pathname}${current.search}${current.hash}`;
              };
              const orgError = ref("");
              const entries = ref([]);
              const commits = ref([]);
              const repoLoadError = ref("");
              const directory = ref("");
              const previewPath = ref("");
              const fileContent = ref("");
              const previewUrl = ref("");
              const previewLoading = ref(false);
              const repoName = ref("");
              const addFilePath = ref("");
              const commitMessage = ref("");
              const dragging = ref(false);
              const errorMessage = ref("");
              const addFileError = ref("");
              const hasUncommitted = computed(() => entries.value.some((entry) => entry.uncommitted));
              const url = () => new URL(window.location.href);
              let navigationRequest = 0;
              let loadRequest = 0;
              let previewRequest = 0;
              let organizationRequest = 0;
              // Li³ conditionals can retain cloned descendants across route changes; remove the old page before switching state.
              const removeRepositoryView = () => {
                document.querySelectorAll("[data-repository-view]").forEach((view) => view.remove());
              };
              const releasePreview = () => {
                if (previewUrl.value) URL.revokeObjectURL(previewUrl.value);
                previewUrl.value = "";
              };
              const navigate = async (target, push = true) => {
                const previous = url();
                const next = new URL(target, window.location.href);
                const nextPath = `${next.pathname}${next.search}${next.hash}`;
                if (push) history.pushState({}, "", nextPath);
                else history.replaceState({}, "", nextPath);
                const requestId = ++navigationRequest;
                ++loadRequest;
                ++previewRequest;
                releasePreview();
                const nextRepo = next.searchParams.get("repo");
                if (
                  !nextRepo ||
                  next.searchParams.get("settings") === "organizations" ||
                  nextRepo !== previous.searchParams.get("repo") ||
                  next.searchParams.get("org") !== previous.searchParams.get("org")
                ) {
                  removeRepositoryView();
                  repo.value = null;
                }
                orgError.value = "";
                org.value = next.searchParams.get("org") || "";
                settings.value = next.searchParams.get("settings") === "organizations";
                await refreshOrgRepositories().catch(() => {
                  if (requestId === navigationRequest) {
                    orgRepositories.value = [];
                    orgRepositoriesLoaded.value = true;
                    orgError.value = "Unable to load repositories for this organization.";
                  }
                });
                if (requestId === navigationRequest) await load();
              };
              const closePreview = () => navigate(rootHref.value);
              const base = () =>
                `/api/v1/orgs/${encodeURIComponent(new URL(window.location.href).searchParams.get("org"))}/repos/${encodeURIComponent(repo.value.repo)}`;
              const rootHref = computed(
                () =>
                  `/?org=${encodeURIComponent(url().searchParams.get("org") || "")}&repo=${encodeURIComponent(repo.value?.repo || "")}`,
              );
              const setRepoName = (value) => {
                repoName.value = value;
              };
              const createOrganization = async (requestedSlug) => {
                if (!canWrite.value) {
                  orgError.value =
                    "Read-only access: ask your Git Store administrator to enable repository write access (repo:write).";
                  return;
                }
                const slug = String(requestedSlug || "").trim();
                orgError.value = "";
                orgCreated.value = false;
                if (!/^[a-zA-Z0-9](?:[a-zA-Z0-9._-]{0,61}[a-zA-Z0-9])?$/.test(slug)) {
                  orgError.value =
                    "Use 1–63 letters, numbers, dots, underscores, or hyphens; start and end with a letter or number.";
                  return;
                }
                try {
                  const response = await fetch("/api/v1/orgs", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ slug }),
                  });
                  if (!response.ok) {
                    const result = await response.json().catch(() => ({}));
                    throw new Error(
                      response.status === 401 || response.status === 403
                        ? "Sign in with repository write access to create an organization."
                        : result.error || "Organization creation failed.",
                    );
                  }
                  const result = await response.json();
                  if (settings.value) {
                    await refreshOrganizations();
                    orgCreated.value = true;
                  } else {
                    await refreshOrganizations();
                    await navigate(`/?org=${encodeURIComponent(result.org.slug)}`);
                  }
                } catch (error) {
                  orgError.value = error.message || "Organization creation failed.";
                }
              };
              const refreshOrganizations = async () => {
                const response = await fetch("/api/v1/orgs");
                if (!response.ok) throw new Error("Unable to load organizations.");
                const result = await response.json();
                orgs.value = Array.isArray(result) ? result : Array.isArray(result.orgs) ? result.orgs : [];
                organizationsLoaded.value = true;
              };
              const refreshOrgRepositories = async () => {
                const slug = url().searchParams.get("org");
                const requestId = ++organizationRequest;
                if (!slug) {
                  orgRepositories.value = [];
                  orgRepositoriesLoaded.value = true;
                  return;
                }
                orgRepositoriesLoaded.value = false;
                const response = await fetch(`/api/v1/orgs/${encodeURIComponent(slug)}/repos`);
                if (!response.ok) {
                  if (requestId === organizationRequest) orgRepositories.value = [];
                  throw new Error("Unable to load repositories for this organization.");
                }
                const result = await response.json().catch(() => ({}));
                if (requestId !== organizationRequest) return;
                orgRepositories.value = Array.isArray(result)
                  ? result
                  : Array.isArray(result.repos)
                    ? result.repos
                    : [];
                orgRepositoriesLoaded.value = true;
                showWorkspace.value = !settings.value && orgRepositories.value.length > 0;
              };
              const retryOrganizationLoad = async () => {
                orgError.value = "";
                try {
                  await refreshOrganizations();
                } catch {
                  orgError.value = "Unable to load organizations.";
                  return;
                }
                try {
                  await refreshOrgRepositories();
                } catch {
                  orgError.value = "Unable to load repositories for this organization.";
                  return;
                }
                if (!settings.value) {
                  try {
                    await load();
                  } catch {
                    errorMessage.value = "Unable to load this repository.";
                  }
                }
              };
              const setCommitMessage = (value) => {
                commitMessage.value = value;
              };
              const setAddFilePath = (value) => {
                addFilePath.value = value;
              };
              const setDragging = (value) => {
                dragging.value = value;
              };
              const entryHref = (entry) => {
                const target = entry.type === "directory" ? { dir: entry.path } : { path: entry.path };
                const current = url();
                current.searchParams.set("repo", repo.value.repo);
                current.searchParams.delete("path");
                current.searchParams.delete("dir");
                current.searchParams.set(
                  entry.type === "directory" ? "dir" : "path",
                  target[entry.type === "directory" ? "dir" : "path"],
                );
                return `${current.pathname}${current.search}${current.hash}`;
              };
              // Keep UI requests on the cookie session; access tokens are not stored in localStorage.
              const load = async () => {
                const requestId = ++loadRequest;
                const current = url();
                const name = current.searchParams.get("repo");
                repoLoadError.value = "";
                directory.value = current.searchParams.get("dir") || "";
                previewPath.value = current.searchParams.get("path") || "";
                fileContent.value = "";
                previewLoading.value = Boolean(previewPath.value);
                releasePreview();
                if (!name || !current.searchParams.get("org")) {
                  repo.value = null;
                  entries.value = [];
                  commits.value = [];
                  branches.value = [];
                  tags.value = [];
                  previewLoading.value = false;
                  return;
                }
                repo.value = { repo: name };
                const apiBase = `/api/v1/orgs/${encodeURIComponent(current.searchParams.get("org"))}/repos/${encodeURIComponent(name)}`;
                let treeResponse;
                let logResponse;
                let branchResponse;
                let tagResponse;
                try {
                  [treeResponse, logResponse, branchResponse, tagResponse] = await Promise.all([
                    fetch(`${apiBase}/tree${directory.value ? `?path=${encodeURIComponent(directory.value)}` : ""}`),
                    fetch(`${apiBase}/log`),
                    fetch(`${apiBase}/branches`),
                    fetch(`${apiBase}/tags`),
                  ]);
                } catch {
                  if (requestId !== loadRequest) return;
                  repo.value = null;
                  previewLoading.value = false;
                  repoLoadError.value = `Could not contact the server while loading repository "${name}".`;
                  return;
                }
                if (requestId !== loadRequest) return;
                if (!treeResponse?.ok) {
                  const result = (await treeResponse?.json().catch(() => ({}))) || {};
                  repo.value = null;
                  previewLoading.value = false;
                  const status = treeResponse?.status || 0;
                  repoLoadError.value = result.error || `Could not load repository "${name}" (${status}).`;
                  return;
                }
                const [loadedEntries, loadedCommits, loadedBranches, loadedTags] = await Promise.all([
                  treeResponse.json(),
                  logResponse.ok ? logResponse.json() : [],
                  branchResponse.ok ? branchResponse.json() : [],
                  tagResponse.ok ? tagResponse.json() : [],
                ]);
                if (requestId !== loadRequest) return;
                entries.value = loadedEntries;
                commits.value = loadedCommits;
                branches.value = loadedBranches;
                tags.value = loadedTags;
                if (previewPath.value) {
                  const currentPreviewRequest = ++previewRequest;
                  try {
                    const response = await fetch(`${apiBase}/file?path=${encodeURIComponent(previewPath.value)}`);
                    if (requestId !== loadRequest || currentPreviewRequest !== previewRequest) return;
                    const mimeType = response.headers.get("content-type")?.split(";")[0];
                    if (response.ok && mimeType?.startsWith("image/")) {
                      const blob = await response.blob();
                      if (requestId === loadRequest && currentPreviewRequest === previewRequest)
                        previewUrl.value = URL.createObjectURL(blob);
                    } else {
                      const text = response.ok ? await response.text() : "Unable to load file";
                      if (requestId === loadRequest && currentPreviewRequest === previewRequest)
                        fileContent.value = text;
                    }
                  } catch {
                    if (requestId === loadRequest && currentPreviewRequest === previewRequest)
                      fileContent.value = "Unable to load file preview.";
                  } finally {
                    if (requestId === loadRequest && currentPreviewRequest === previewRequest)
                      previewLoading.value = false;
                  }
                }
              };
              const createFirstRepository = async (requestedName) => {
                if (!canWrite.value) {
                  errorMessage.value =
                    "Read-only access: repository write access (repo:write) is required to create a repository.";
                  return;
                }
                const name = String(requestedName || "").trim();
                if (!/^[a-zA-Z0-9._-]+$/.test(name)) {
                  errorMessage.value = "Use letters, numbers, dots, underscores, or hyphens.";
                  return;
                }
                try {
                  const response = await fetch(
                    `/api/v1/orgs/${encodeURIComponent(org.value)}/repos/${encodeURIComponent(name)}`,
                    {
                      method: "POST",
                    },
                  );
                  if (response.ok)
                    await navigate(`/?org=${encodeURIComponent(org.value)}&repo=${encodeURIComponent(name)}`);
                  else {
                    const result = await response.json().catch(() => ({}));
                    errorMessage.value =
                      response.status === 401 || response.status === 403
                        ? "Sign in with repository write access."
                        : `${result.error || "Repository creation failed"} (${result.code || response.status})`;
                  }
                } catch {
                  errorMessage.value = "Repository creation failed.";
                }
              };
              const createRepository = async () => {
                if (!canWrite.value) {
                  errorMessage.value =
                    "Read-only access: repository write access (repo:write) is required to create a repository.";
                  return;
                }
                const name = repoName.value.trim();
                errorMessage.value = "";
                if (!/^[a-zA-Z0-9._-]+$/.test(name)) {
                  errorMessage.value = "Use letters, numbers, dots, underscores, or hyphens.";
                  return;
                }
                try {
                  const response = await fetch(
                    `/api/v1/orgs/${encodeURIComponent(org.value)}/repos/${encodeURIComponent(name)}`,
                    { method: "POST" },
                  );
                  if (!response.ok) {
                    const result = await response.json().catch(() => ({}));
                    throw new Error(
                      response.status === 401 || response.status === 403
                        ? "Sign in with repository write access."
                        : `${result.error || "Repository creation failed"} (${result.code || response.status})`,
                    );
                  }
                  await navigate(repositoryNavHref({ repo: name }));
                } catch (error) {
                  errorMessage.value = error.message || "Repository creation failed.";
                }
              };
              const createBranch = async () => {
                if (!canWrite.value) {
                  errorMessage.value =
                    "Read-only access: ask your Git Store administrator to enable repository write access (repo:write).";
                  return;
                }
                const name = branchName.value.trim();
                if (!name) return;
                errorMessage.value = "";
                try {
                  const response = await fetch(`${base()}/branches`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name }),
                  });
                  if (response.ok) {
                    branchName.value = "";
                    await load();
                  } else throw new Error("Failed to create branch.");
                } catch (error) {
                  errorMessage.value = error.message;
                }
              };
              const createTag = async () => {
                if (!canWrite.value) {
                  errorMessage.value =
                    "Read-only access: ask your Git Store administrator to enable repository write access (repo:write).";
                  return;
                }
                const name = tagName.value.trim();
                if (!name) return;
                errorMessage.value = "";
                try {
                  const response = await fetch(`${base()}/tags`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name }),
                  });
                  if (response.ok) {
                    tagName.value = "";
                    await load();
                  } else throw new Error("Failed to create tag.");
                } catch (error) {
                  errorMessage.value = error.message;
                }
              };
              const addFileToRepo = async () => {
                if (!canWrite.value) {
                  addFileError.value =
                    "Read-only access: ask your Git Store administrator to enable repository write access (repo:write).";
                  return;
                }
                const filePath = addFilePath.value.trim();
                addFileError.value = "";
                if (!filePath) {
                  addFileError.value = "Enter a file path.";
                  return;
                }
                if (filePath.startsWith("/") || filePath.split("/").includes("..") || filePath.includes("\\")) {
                  addFileError.value = "Invalid path: use a repository-relative path without '..'.";
                  return;
                }

                try {
                  const fileResponse = await fetch(`${base()}/files`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ path: filePath, content: "" }),
                  });
                  if (!fileResponse.ok) {
                    const result = await fileResponse.json().catch(() => ({}));
                    addFileError.value =
                      fileResponse.status === 401
                        ? "Your sign-in session expired. Sign in again to create files."
                        : fileResponse.status === 403
                          ? "Your account does not have repository write access (repo:write)."
                          : result.error || `Failed to create file (${fileResponse.status}).`;
                    return;
                  }
                  const stageResponse = await fetch(`${base()}/stage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ files: [filePath] }),
                  });
                  if (!stageResponse.ok) {
                    const result = await stageResponse.json().catch(() => ({}));
                    addFileError.value = result.error || `Failed to stage file (${stageResponse.status}).`;
                    return;
                  }
                  const commitResponse = await fetch(`${base()}/commit`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: `Add ${filePath}` }),
                  });
                  if (!commitResponse.ok) {
                    const result = await commitResponse.json().catch(() => ({}));
                    addFileError.value = result.error || `Failed to commit file (${commitResponse.status}).`;
                    return;
                  }
                  await load();
                } catch (error) {
                  addFileError.value = error.message || "Could not create and commit the file.";
                }
              };
              const commitChanges = async () => {
                if (!canWrite.value) {
                  errorMessage.value =
                    "Read-only access: ask your Git Store administrator to enable repository write access (repo:write).";
                  return;
                }
                errorMessage.value = "";
                try {
                  const files = entries.value
                    .filter((entry) => entry.uncommitted && entry.type === "file")
                    .map((entry) => entry.path);
                  if (files.length) {
                    const stage = await fetch(`${base()}/stage`, {
                      method: "POST",
                      headers: { "Content-Type": "application/json" },
                      body: JSON.stringify({ files }),
                    });
                    if (!stage.ok) throw new Error("Could not stage files. Sign in and try again.");
                  }
                  const response = await fetch(`${base()}/commit`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      message: commitMessage.value || "autocommit",
                    }),
                  });
                  if (!response.ok) throw new Error("Could not commit changes. Sign in and try again.");
                  const current = url();
                  current.searchParams.delete("path");
                  await navigate(current, false);
                } catch (error) {
                  errorMessage.value = error.message;
                }
              };
              const uploadFiles = async (files) => {
                if (!canWrite.value) {
                  errorMessage.value =
                    "Read-only access: repository write access (repo:write) is required to upload files.";
                  return;
                }
                const uploadedPaths = [];
                for (const file of Array.from(files)) {
                  const content = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(String(reader.result).split(",")[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                  });
                  const filePath = directory.value ? `${directory.value}/${file.name}` : file.name;
                  const response = await fetch(`${base()}/files`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ path: filePath, content }),
                  });
                  if (!response.ok) {
                    const result = await response.json().catch(() => ({}));
                    const message =
                      response.status === 401
                        ? "Your sign-in session expired. Sign in again to upload files."
                        : response.status === 403
                          ? "Your browser session does not have repository write access (repo:write). Ask your Git Store administrator to enable it."
                          : result.error || "Upload failed.";
                    throw new Error(`${message} (${response.status})`);
                  }
                  uploadedPaths.push(filePath);
                }
                if (commits.value.length === 0 && uploadedPaths.length > 0) {
                  const stage = await fetch(`${base()}/stage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ files: uploadedPaths }),
                  });
                  if (!stage.ok) {
                    const result = await stage.json().catch(() => ({}));
                    throw new Error(result.error || `Could not stage uploaded files (${stage.status}).`);
                  }
                  const commit = await fetch(`${base()}/commit`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: "Initial commit" }),
                  });
                  if (!commit.ok) {
                    const result = await commit.json().catch(() => ({}));
                    throw new Error(result.error || `Could not commit uploaded files (${commit.status}).`);
                  }
                }
              };
              const upload = async (event) => {
                dragging.value = false;
                if (!canWrite.value) {
                  errorMessage.value =
                    "Read-only access: repository write access (repo:write) is required to upload files.";
                  return;
                }
                errorMessage.value = "";
                try {
                  await uploadFiles(event.dataTransfer.files);
                  await load();
                } catch (error) {
                  errorMessage.value = error.message;
                }
              };
              onInit(async () => {
                const themeMedia = window.matchMedia("(prefers-color-scheme: dark)");
                const syncTheme = (isDark) => {
                  darkMode.value = isDark;
                  document.documentElement.classList.toggle("dark", isDark);
                };
                syncTheme(themeMedia.matches);
                themeMedia.addEventListener("change", (event) => syncTheme(event.matches));
                window.addEventListener("keydown", (event) => {
                  if (event.key === "Escape") closeMenu();
                });
                window.addEventListener("popstate", () => navigate(window.location.href, false));
                document.addEventListener("click", (event) => {
                  const link = event.target.closest("a[href]");
                  if (
                    !link ||
                    event.defaultPrevented ||
                    event.button !== 0 ||
                    event.metaKey ||
                    event.ctrlKey ||
                    event.shiftKey ||
                    event.altKey ||
                    link.target ||
                    link.origin !== location.origin
                  )
                    return;
                  const target = new URL(link.href);
                  if (target.pathname !== "/" && target.pathname !== "/ui/") return;
                  event.preventDefault();
                  navigate(target.href);
                });
                const config = await fetch("/ui/config")
                  .then((response) => response.json())
                  .catch(() => ({}));
                const currentUrl = url();
                const returnTo = `${currentUrl.pathname}${currentUrl.search}${currentUrl.hash}`;
                userUrl.value = config.oidcLoginUrl
                  ? `${config.oidcLoginUrl}?returnTo=${encodeURIComponent(returnTo)}`
                  : "#";
                const sessionResponse = await fetch("/ui/session", {
                  credentials: "same-origin",
                }).catch(() => null);
                const session = sessionResponse?.ok
                  ? await sessionResponse.json().catch(() => ({ authenticated: false }))
                  : { authenticated: false };
                if (!session.authenticated) {
                  profile.value = null;
                  authStatus.value = "anonymous";
                  return;
                }
                profile.value = session.profile || null;
                canWrite.value = session.canWrite === true;
                const params = currentUrl.searchParams;
                org.value = params.get("org") || "";
                settings.value = params.get("settings") === "organizations";
                try {
                  await refreshOrganizations();
                } catch {
                  orgError.value = "Unable to load organizations.";
                }
                const requestedOrg = params.get("org");
                if (
                  requestedOrg &&
                  organizationsLoaded.value &&
                  !orgs.value.some((item) => item.slug === requestedOrg)
                ) {
                  if (orgs.value.length > 0) {
                    org.value = orgs.value[0].slug;
                    currentUrl.searchParams.set("org", org.value);
                  } else {
                    org.value = "";
                    currentUrl.searchParams.delete("org");
                  }
                  currentUrl.searchParams.delete("repo");
                  currentUrl.searchParams.delete("path");
                  currentUrl.searchParams.delete("dir");
                  await navigate(currentUrl, false);
                  return;
                }
                try {
                  await refreshOrgRepositories();
                } catch {
                  orgError.value = "Unable to load repositories for this organization.";
                }
                if (!settings.value) {
                  try {
                    await load();
                  } catch {
                    errorMessage.value = "Unable to load this repository.";
                  }
                }
                authStatus.value = "authenticated";
              });
              const handleFileSelect = async (files) => {
                if (!canWrite.value) {
                  errorMessage.value =
                    "Read-only access: repository write access (repo:write) is required to upload files.";
                  return;
                }
                errorMessage.value = "";
                try {
                  await uploadFiles(files);
                  await load();
                } catch (error) {
                  errorMessage.value = error.message;
                }
              };
              return {
                profile,
                canWrite,
                userUrl,
                darkMode,
                showWorkspace,
                menuOpen,
                userAlias,
                userEmail,
                userInitial,
                repoLabel,
                repoHref,
                repositoryNavHref,
                isSelected,
                openSettings,
                closePreview,
                toggleTheme,
                toggleSidebar,
                closeMenu,
                repo,
                settings,
                orgs,
                organizationsLoaded,
                orgRepositories,
                orgRepositoriesLoaded,
                orgCreated,
                orgHref,
                retryOrganizationLoad,
                org,
                orgError,
                entries,
                commits,
                directory,
                previewPath,
                fileContent,
                previewUrl,
                previewLoading,
                repoName,
                addFilePath,
                commitMessage,
                dragging,
                errorMessage,
                repoLoadError,
                addFileError,
                authStatus,
                hasUncommitted,
                rootHref,
                branches,
                tags,
                refHref,
                setBranchName,
                setTagName,
                createBranch,
                createTag,
                setRepoName,
                setAddFilePath,
                setCommitMessage,
                setDragging,
                entryHref,
                createFirstRepository,
                createOrganization,
                createRepository,
                addFileToRepo,
                commitChanges,
                upload,
                handleFileSelect,
              };
            }
          </script>
        </main>
      </div>
    </template>
  </body>
</html>
