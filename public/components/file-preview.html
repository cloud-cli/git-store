<template component="file-preview">
  <section
    data-testid="file-page"
    class="flex min-h-0 flex-1 flex-col overflow-hidden rounded-xl border border-gray-200 bg-white shadow-[0_1px_2px_rgba(28,32,30,0.08)] dark:border-[#344039] dark:bg-[#171e19]"
  >
    <header
      class="flex min-h-[76px] shrink-0 items-center gap-3 border-b border-gray-200 bg-[#f8faf9] px-4 py-3 dark:border-[#344039] dark:bg-[#1d2620] sm:px-5"
    >
      <div class="flex min-w-0 flex-1 items-center gap-3">
        <span
          class="flex size-9 shrink-0 items-center justify-center rounded-lg bg-white text-brand dark:bg-[#111713] dark:text-[#a4d1ae]"
        >
          <lucide-icon data-testid="file-page-icon" bind-icon="icon" size="18"></lucide-icon>
        </span>
        <div class="min-w-0">
          <h1 class="truncate text-sm font-semibold text-gray-900 dark:text-gray-100">{{ fileName }}</h1>
          <p class="truncate text-xs text-gray-500 dark:text-gray-400" attr-title="path">{{ path }}</p>
        </div>
      </div>
      <span
        data-testid="file-language"
        class="hidden shrink-0 rounded-md bg-white px-2 py-1 font-mono text-[11px] text-gray-500 dark:bg-[#111713] dark:text-gray-300 sm:inline-flex"
        >{{ language }}</span
      >
      <button
        type="button"
        on-click="backToFiles()"
        class="inline-flex shrink-0 items-center gap-1.5 rounded-lg border border-gray-300 bg-white px-3 py-2 text-xs font-medium text-gray-700 transition-colors hover:bg-gray-100 dark:border-gray-700 dark:bg-[#111713] dark:text-gray-200 dark:hover:bg-gray-800"
        aria-label="Back to files"
      >
        <lucide-icon icon="arrow-left" size="14"></lucide-icon>
        <span>Back to files</span>
      </button>
    </header>
    <div class="flex min-h-0 flex-1 overflow-hidden">
      <template if="loading"
        ><div
          class="flex flex-1 items-center justify-center p-6 text-sm text-gray-500 dark:text-gray-400"
          role="status"
        >
          Loading file…
        </div></template
      >
      <template if="!loading && imageUrl"
        ><div class="flex min-h-0 flex-1 items-center justify-center overflow-auto bg-gray-50 p-4 dark:bg-[#111713]">
          <img attr-src="imageUrl" attr-alt="fileName" class="max-h-full max-w-full object-contain" /></div
      ></template>
      <template if="!loading && !imageUrl"
        ><div
          class="min-h-0 min-w-0 flex-1 overflow-auto bg-[#fbfcfb] dark:bg-[#111713]"
          role="region"
          aria-label="File source"
          data-testid="file-code-block"
        >
          <code-block
            class="block min-h-full min-w-full p-5 font-mono text-sm leading-6 [tab-size:2]"
            bind-source="content"
            bind-language="language"
            bind-theme="theme"
          ></code-block></div
      ></template>
    </div>
  </section>
  <script setup>
    import { computed, defineEvent, defineProp } from "@li3/web";
    export default function () {
      const path = defineProp("path", { default: "" });
      const content = defineProp("content", { default: "" });
      const imageUrl = defineProp("imageUrl", { default: "" });
      const loading = defineProp("loading", { default: false });
      const language = defineProp("language", { default: "plaintext" });
      const icon = defineProp("icon", { default: "file" });
      const darkMode = defineProp("darkMode", { default: false });
      const emitBack = defineEvent("back");
      const fileName = computed(() => path.value.split("/").at(-1) || path.value);
      const theme = computed(() => (darkMode.value ? "atom-one-dark" : "github"));
      const backToFiles = () => emitBack();
      return { path, content, imageUrl, loading, language, icon, darkMode, fileName, theme, backToFiles };
    }
  </script>
</template>
