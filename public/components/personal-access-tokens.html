<template component="personal-access-tokens">
  <div class="flex h-full min-h-0 min-w-0 flex-1 flex-col gap-4 md:flex-row md:gap-6">
    <nav class="w-full flex-shrink-0 pb-2 md:w-52 md:pb-0" aria-label="Settings navigation">
      <h1 class="mb-4 px-3 text-xs font-bold uppercase tracking-[0.1em] text-[#78847c] dark:text-[#aab6ac]">
        Settings
      </h1>
      <a
        href="/?settings=organizations"
        class="block rounded-lg px-3 py-2.5 font-medium text-[#455149] hover:bg-white/60 dark:text-gray-300 dark:hover:bg-white/10"
        >Organizations</a
      >
      <a
        href="/?settings=tokens"
        aria-current="page"
        class="mb-1 block rounded-lg border border-[#cdded0] bg-white px-3 py-2.5 font-semibold text-brand dark:border-[#3d5844] dark:bg-[#1a231d] dark:text-[#a4d1ae]"
        >Personal access tokens</a
      >
    </nav>
    <section
      class="min-h-0 min-w-0 flex-1 overflow-y-auto rounded-2xl border border-[#dce3dc] bg-white p-4 shadow-[0_2px_8px_rgba(28,32,30,0.06)] sm:p-6 dark:border-[#344039] dark:bg-[#1a231d]"
    >
      <h2 class="mb-2 text-2xl font-bold">Personal access tokens</h2>
      <p class="mb-6 max-w-3xl text-sm text-gray-600 dark:text-gray-300">
        Tokens require explicit organization grants. <code>repo:read</code> reads repositories;
        <code>repo:write</code> writes repositories; <code>org:create</code> creates an organization;
        <code>org:manage</code> deletes empty organizations and manages webhook settings.
      </p>

      <template if="loading">
        <p role="status" class="py-4 text-sm text-gray-600 dark:text-gray-300">Loading personal access tokens…</p>
      </template>
      <template if="error">
        <p role="alert" class="mb-3 text-sm text-red-700 dark:text-red-300">{{ error }}</p>
        <button type="button" on-click="loadTokens()" class="mb-4 rounded-lg border px-3 py-2">Try again</button>
      </template>
      <template if="!loading && !error && tokens.length === 0">
        <p
          class="mb-5 rounded-lg border border-gray-200 p-4 text-sm text-gray-600 dark:border-gray-700 dark:text-gray-300"
        >
          No personal access tokens yet.
        </p>
      </template>
      <template if="!loading && tokens.length > 0">
        <h2 class="mb-3 text-lg font-semibold">Existing tokens</h2>
        <ul class="mb-6 space-y-3">
          <template for="token of tokens">
            <li
              class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-gray-200 bg-white p-4 dark:border-gray-700 dark:bg-gray-900"
            >
              <div class="min-w-0">
                <p class="break-words font-medium">{{ token.label }}</p>
                <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">
                  {{ token.scopes.join(", ") }} · Organizations: {{ token.orgs.join(", ") || "none" }} · Created {{
                  token.createdAt }}<template if="token.expiresAt"> · Expires {{ token.expiresAt }}</template>
                </p>
              </div>
              <button
                type="button"
                on-click="revokeToken(token.id)"
                class="rounded-lg border border-red-300 px-3 py-2 text-sm font-medium text-red-700 hover:bg-red-50 disabled:opacity-50 dark:border-red-900 dark:text-red-300 dark:hover:bg-red-950"
              >
                Revoke
              </button>
              <button type="button" on-click="beginEdit(token)" class="rounded-lg border px-3 py-2 text-sm">
                Edit grants
              </button>
            </li>
          </template>
        </ul>
      </template>

      <template if="createdToken">
        <aside
          class="mb-6 rounded-xl border border-amber-400 bg-amber-50 p-4 dark:border-amber-700 dark:bg-amber-950/40"
          aria-labelledby="token-created-title"
        >
          <h2 id="token-created-title" class="font-semibold">Copy your token now</h2>
          <p class="my-2 text-sm">
            This secret is shown only once. Store it securely; leaving or reloading this page clears it.
          </p>
          <div class="flex flex-col gap-2 sm:flex-row">
            <code class="min-w-0 flex-1 overflow-x-auto rounded bg-white p-3 text-sm dark:bg-gray-950"
              ><span class="break-all">{{ createdToken }}</span></code
            >
            <button type="button" on-click="copyToken()" class="rounded-lg border px-3 py-2 font-medium">
              {{ copied ? "Copied" : "Copy token" }}
            </button>
          </div>
        </aside>
      </template>

      <template if="canRead">
        <h2 class="mb-3 text-lg font-semibold">Create a token</h2>
        <form
          id="token-grants-form"
          class="flex max-w-xl flex-col gap-3 rounded-xl border border-gray-200 p-4 dark:border-gray-700"
          on-submit.prevent="submitToken()"
        >
          <label class="flex flex-col gap-1 text-sm font-medium"
            >Label
            <input
              required
              maxlength="100"
              autocomplete="off"
              on-input="setLabel($event.target.value)"
              class="rounded-lg border border-gray-300 bg-white px-3 py-2 dark:border-gray-600 dark:bg-gray-950"
              placeholder="e.g. Laptop"
            />
          </label>
          <fieldset class="flex flex-col gap-1 text-sm font-medium">
            <legend>Scope</legend>
            <template for="scopeOption of scopeOptions">
              <label class="flex items-center gap-2 font-normal"
                ><input
                  type="checkbox"
                  value="{{ scopeOption }}"
                  on-change="toggleScope(scopeOption, $event.target.checked)"
                />{{ scopeOption }}</label
              >
            </template>
          </fieldset>
          <label class="flex flex-col gap-1 text-sm font-medium"
            >Optional expiry date
            <input
              type="date"
              on-input="setExpiry($event.target.value)"
              class="rounded-lg border border-gray-300 bg-white px-3 py-2 dark:border-gray-600 dark:bg-gray-950"
            />
          </label>
          <p class="text-sm text-gray-600 dark:text-gray-300">Select one or more owned organizations to grant.</p>
          <template for="organizationItem of organizations"
            ><label class="flex items-center gap-2 text-sm"
              ><input
                type="checkbox"
                value="{{ organizationItem }}"
                on-change="toggleOrg(organizationItem, $event.target.checked)"
              />{{ organizationItem }}</label
            ></template
          >
          <button
            type="submit"
            class="self-start rounded-lg bg-brand px-4 py-2 font-medium text-white hover:bg-brand-hover"
          >
            {{ busy ? "Saving…" : editingTokenId ? "Save grants" : "Create token" }}
          </button>
        </form>
      </template>
      <template if="canRead">
        <h2 class="mb-3 mt-8 text-lg font-semibold">Bind an existing GitMini Auth token</h2>
        <form class="flex max-w-xl flex-col gap-3 rounded-xl border p-4" on-submit.prevent="bindToken()">
          <p class="text-sm text-gray-600 dark:text-gray-300">
            The token must be issued for this GitMini OIDC client; tokens minted for a different Auth client cannot be
            introspected here.
          </p>
          <label
            >External token<input
              required
              type="password"
              autocomplete="new-password"
              on-input="setExternalToken($event.target.value)"
              class="block w-full rounded border px-3 py-2"
          /></label>
          <label
            >Label<input
              required
              maxlength="100"
              on-input="setExternalLabel($event.target.value)"
              class="block w-full rounded border px-3 py-2"
          /></label>
          <fieldset class="flex flex-col gap-1 text-sm font-medium">
            <legend>GitMini capabilities</legend>
            <template for="scopeOption of scopeOptions">
              <label class="flex items-center gap-2 font-normal"
                ><input
                  type="checkbox"
                  value="{{ scopeOption }}"
                  on-change="toggleBindingScope(scopeOption, $event.target.checked)"
                />{{ scopeOption }}</label
              >
            </template>
          </fieldset>
          <p class="text-sm text-gray-600 dark:text-gray-300">Grant only organizations this token should access.</p>
          <template for="organizationItem of organizations"
            ><label class="flex items-center gap-2 text-sm"
              ><input
                type="checkbox"
                value="{{ organizationItem }}"
                on-change="toggleBindingOrg(organizationItem, $event.target.checked)"
              />{{ organizationItem }}</label
            ></template
          >
          <button type="submit" class="self-start rounded-lg border px-4 py-2">
            {{ busy ? "Binding…" : "Bind token" }}
          </button>
        </form>
      </template>
      <template if="!canRead">
        <p
          class="rounded-lg border border-amber-300 p-4 text-sm text-amber-800 dark:border-amber-800 dark:text-amber-200"
          role="status"
        >
          Token management requires repository read access (repo:read) or write access (repo:write).
        </p>
      </template>
    </section>
  </div>
  <script setup>
    import { defineProp, ref, onInit } from "@li3/web";
    export default function () {
      const canRead = defineProp("canRead", { default: false });
      const canWrite = defineProp("canWrite", { default: false });
      const tokens = ref([]);
      const loading = ref(true);
      const busy = ref(false);
      const error = ref("");
      const createdToken = ref("");
      const copied = ref(false);
      const label = ref("");
      const expiresAt = ref("");
      const organizations = ref([]);
      const selectedScopes = ref([]);
      const selectedOrgs = ref([]);
      const bindingScopes = ref(["repo:read"]);
      const bindingOrgs = ref([]);
      const editingTokenId = ref("");
      const externalToken = ref("");
      const externalLabel = ref("");
      const scopeOptions = canWrite.value ? ["repo:read", "repo:write", "org:create", "org:manage"] : ["repo:read"];

      const responseError = async (response) => {
        let body = {};
        try {
          body = await response.json();
        } catch {}
        return body.error || `Request failed (${response.status})`;
      };
      const loadTokens = async () => {
        loading.value = true;
        error.value = "";
        createdToken.value = "";
        try {
          const response = await fetch("/api/v1/personal-access-tokens", {
            headers: { Accept: "application/json" },
            cache: "no-store",
          });
          if (!response.ok) {
            throw new Error(await responseError(response));
          }
          const body = await response.json();
          tokens.value = Array.isArray(body.tokens) ? body.tokens : [];
          const orgResponse = await fetch("/api/v1/orgs", {
            headers: { Accept: "application/json" },
            cache: "no-store",
          });
          if (orgResponse.ok) {
            const organizationBody = await orgResponse.json();
            organizations.value = (organizationBody.orgs || []).map((organization) => organization.slug);
          }
        } catch (err) {
          error.value = err.message || "Unable to load tokens";
        } finally {
          loading.value = false;
        }
      };
      const createToken = async () => {
        createdToken.value = "";
        copied.value = false;
        error.value = "";
        if (!canRead.value || busy.value) {
          return;
        }
        if (selectedScopes.value.includes("repo:write") && !canWrite.value) {
          return;
        }
        busy.value = true;
        try {
          const payload = { label: label.value.trim(), scopes: selectedScopes.value, orgs: selectedOrgs.value };
          if (expiresAt.value) {
            payload.expiresAt = expiresAt.value;
          }
          const response = await fetch("/api/v1/personal-access-tokens", {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify(payload),
          });
          if (!response.ok) {
            throw new Error(await responseError(response));
          }
          const body = await response.json();
          createdToken.value = body.token || "";
          tokens.value = [body.record, ...tokens.value.filter((item) => item.id !== body.record?.id)].filter(Boolean);
          await loadTokensPreservingSecret();
        } catch (err) {
          error.value = err.message || "Unable to create token";
        } finally {
          busy.value = false;
        }
      };
      const submitToken = async () => {
        if (!editingTokenId.value) {
          await createToken();
          return;
        }
        if (busy.value || !selectedScopes.value.length) return;
        busy.value = true;
        error.value = "";
        try {
          const response = await fetch(`/api/v1/personal-access-tokens/${encodeURIComponent(editingTokenId.value)}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({ label: label.value.trim(), scopes: selectedScopes.value, orgs: selectedOrgs.value }),
          });
          if (!response.ok) throw new Error(await responseError(response));
          editingTokenId.value = "";
          await loadTokens();
        } catch (err) {
          error.value = err.message || "Unable to update token";
        } finally {
          busy.value = false;
        }
      };
      const beginEdit = (token) => {
        editingTokenId.value = token.id;
        label.value = token.label;
        selectedScopes.value = [...token.scopes];
        selectedOrgs.value = [...(token.orgs || [])];
        const labelInput = document.querySelector('input[placeholder="e.g. Laptop"]');
        if (labelInput) {
          labelInput.value = token.label;
        }
        document.querySelectorAll('#token-grants-form input[type="checkbox"]').forEach((input) => {
          input.checked = selectedScopes.value.includes(input.value) || selectedOrgs.value.includes(input.value);
        });
      };
      const bindToken = async () => {
        const secret = externalToken.value;
        if (!secret || !externalLabel.value.trim() || !bindingScopes.value.length || busy.value) return;
        if (bindingScopes.value.includes("repo:write") && !canWrite.value) return;
        busy.value = true;
        error.value = "";
        try {
          const response = await fetch("/api/v1/token-authorizations", {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({
              token: secret,
              label: externalLabel.value,
              scopes: bindingScopes.value,
              orgs: bindingOrgs.value,
            }),
          });
          if (!response.ok) throw new Error(await responseError(response));
          externalToken.value = "";
          const passwordInput = document.querySelector('input[type="password"]');
          if (passwordInput) {
            passwordInput.value = "";
          }
          await loadTokens();
        } catch (err) {
          error.value = err.message || "Unable to bind token";
        } finally {
          busy.value = false;
        }
      };
      const loadTokensPreservingSecret = async () => {
        const secret = createdToken.value;
        await loadTokens();
        createdToken.value = secret;
      };
      const revokeToken = async (id) => {
        if (busy.value) {
          return;
        }
        const token = tokens.value.find((item) => item.id === id);
        if (!token || !window.confirm(`Revoke the token “${token.label}”?`)) {
          return;
        }
        error.value = "";
        busy.value = true;
        try {
          const response = await fetch(`/api/v1/personal-access-tokens/${encodeURIComponent(id)}`, {
            method: "DELETE",
          });
          if (!response.ok) {
            throw new Error(await responseError(response));
          }
          tokens.value = tokens.value.filter((item) => item.id !== id);
        } catch (err) {
          error.value = err.message || "Unable to revoke token";
        } finally {
          busy.value = false;
        }
      };
      const copyToken = async () => {
        try {
          await navigator.clipboard.writeText(createdToken.value);
          copied.value = true;
        } catch {
          error.value = "Could not access the clipboard. Select and copy the token manually.";
        }
      };
      onInit(loadTokens);
      return {
        canRead,
        canWrite,
        tokens,
        loading,
        busy,
        error,
        createdToken,
        copied,
        setLabel: (value) => {
          label.value = value;
        },
        scopeOptions,
        organizations,
        editingTokenId,
        beginEdit,
        submitToken,
        toggleScope: (scope, enabled) => {
          selectedScopes.value = enabled
            ? [...new Set([...selectedScopes.value, scope])]
            : selectedScopes.value.filter((item) => item !== scope);
        },
        toggleOrg: (org, enabled) => {
          selectedOrgs.value = enabled
            ? [...new Set([...selectedOrgs.value, org])]
            : selectedOrgs.value.filter((item) => item !== org);
        },
        toggleBindingScope: (scope, enabled) => {
          bindingScopes.value = enabled
            ? [...new Set([...bindingScopes.value, scope])]
            : bindingScopes.value.filter((item) => item !== scope);
        },
        toggleBindingOrg: (org, enabled) => {
          bindingOrgs.value = enabled
            ? [...new Set([...bindingOrgs.value, org])]
            : bindingOrgs.value.filter((item) => item !== org);
        },
        setExternalToken: (value) => {
          externalToken.value = value;
        },
        setExternalLabel: (value) => {
          externalLabel.value = value;
        },
        bindToken,
        setExpiry: (value) => {
          expiresAt.value = value;
        },
        loadTokens,
        createToken,
        revokeToken,
        copyToken,
      };
    }
  </script>
</template>
