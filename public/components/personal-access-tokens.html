<template component="personal-access-tokens">
  <div class="flex min-h-full flex-1 gap-4 p-4 sm:gap-6 md:p-8">
    <nav
      class="w-32 flex-shrink-0 border-r border-gray-200 pr-3 sm:w-44 sm:pr-4 dark:border-gray-800"
      aria-label="Settings navigation"
    >
      <h1 class="mb-4 text-xl font-bold">Settings</h1>
      <a
        href="/?settings=organizations"
        class="block rounded-lg px-3 py-2 font-medium text-gray-600 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-900"
        >Organizations</a
      >
      <a
        href="/?settings=tokens"
        aria-current="page"
        class="mt-2 block rounded-lg border border-green-200 bg-green-50 px-3 py-2 font-medium text-green-800 dark:border-green-900 dark:bg-green-950 dark:text-green-200"
        >Personal access tokens</a
      >
    </nav>
    <section class="min-w-0 flex-1">
      <h2 class="mb-2 text-2xl font-bold">Personal access tokens</h2>
      <p class="mb-6 max-w-3xl text-sm text-gray-600 dark:text-gray-300">
        Tokens grant access to resources owned by your account across all organizations and repositories. A
        <code>repo:read</code> token can read repositories; <code>repo:write</code> can also make changes. Tokens are
        not limited to a particular organization or repository.
      </p>

      <template if="loading">
        <p role="status" class="py-4 text-sm text-gray-600 dark:text-gray-300">Loading personal access tokens…</p>
      </template>
      <template if="error">
        <p role="alert" class="mb-3 text-sm text-red-700 dark:text-red-300">{{ error }}</p>
        <button type="button" on-click="loadTokens()" class="mb-4 rounded-lg border px-3 py-2">Try again</button>
      </template>
      <template if="!loading && !error && tokens.length === 0">
        <p
          class="mb-5 rounded-lg border border-gray-200 p-4 text-sm text-gray-600 dark:border-gray-700 dark:text-gray-300"
        >
          No personal access tokens yet.
        </p>
      </template>
      <template if="!loading && tokens.length > 0">
        <h2 class="mb-3 text-lg font-semibold">Existing tokens</h2>
        <ul class="mb-6 space-y-3">
          <template for="token of tokens">
            <li
              class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-gray-200 bg-white p-4 dark:border-gray-700 dark:bg-gray-900"
            >
              <div class="min-w-0">
                <p class="break-words font-medium">{{ token.label }}</p>
                <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">
                  {{ token.scopes.join(", ") }} ·
                  <template if="token.org && token.repo">{{ token.org }}/{{ token.repo }}</template
                  ><template if="!token.org || !token.repo">All owned repositories</template> · Created {{
                  token.createdAt }}<template if="token.expiresAt"> · Expires {{ token.expiresAt }}</template>
                </p>
              </div>
              <button
                type="button"
                on-click="revokeToken(token.id)"
                class="rounded-lg border border-red-300 px-3 py-2 text-sm font-medium text-red-700 hover:bg-red-50 disabled:opacity-50 dark:border-red-900 dark:text-red-300 dark:hover:bg-red-950"
              >
                Revoke
              </button>
            </li>
          </template>
        </ul>
      </template>

      <template if="createdToken">
        <aside
          class="mb-6 rounded-xl border border-amber-400 bg-amber-50 p-4 dark:border-amber-700 dark:bg-amber-950/40"
          aria-labelledby="token-created-title"
        >
          <h2 id="token-created-title" class="font-semibold">Copy your token now</h2>
          <p class="my-2 text-sm">
            This secret is shown only once. Store it securely; leaving or reloading this page clears it.
          </p>
          <div class="flex flex-col gap-2 sm:flex-row">
            <code class="min-w-0 flex-1 overflow-x-auto rounded bg-white p-3 text-sm dark:bg-gray-950"
              ><span class="break-all">{{ createdToken }}</span></code
            >
            <button type="button" on-click="copyToken()" class="rounded-lg border px-3 py-2 font-medium">
              {{ copied ? "Copied" : "Copy token" }}
            </button>
          </div>
        </aside>
      </template>

      <template if="canRead">
        <h2 class="mb-3 text-lg font-semibold">Create a token</h2>
        <form
          class="flex max-w-xl flex-col gap-3 rounded-xl border border-gray-200 p-4 dark:border-gray-700"
          on-submit.prevent="createToken()"
        >
          <label class="flex flex-col gap-1 text-sm font-medium"
            >Label
            <input
              required
              maxlength="100"
              autocomplete="off"
              on-input="setLabel($event.target.value)"
              class="rounded-lg border border-gray-300 bg-white px-3 py-2 dark:border-gray-600 dark:bg-gray-950"
              placeholder="e.g. Laptop"
            />
          </label>
          <label class="flex flex-col gap-1 text-sm font-medium"
            >Scope
            <select
              on-change="setScope($event.target.value)"
              class="rounded-lg border border-gray-300 bg-white px-3 py-2 dark:border-gray-600 dark:bg-gray-950"
            >
              <option value="repo:read" selected>repo:read — read repositories</option>
              <template if="canWrite"
                ><option value="repo:write">repo:write — read and write repositories</option></template
              >
            </select>
          </label>
          <label class="flex flex-col gap-1 text-sm font-medium"
            >Optional expiry date
            <input
              type="date"
              on-input="setExpiry($event.target.value)"
              class="rounded-lg border border-gray-300 bg-white px-3 py-2 dark:border-gray-600 dark:bg-gray-950"
            />
          </label>
          <p class="text-sm text-gray-600 dark:text-gray-300">
            The selected scope applies owner-wide to all of your organizations and repositories.
          </p>
          <button
            type="submit"
            class="self-start rounded-lg bg-brand px-4 py-2 font-medium text-white hover:bg-brand-hover"
          >
            {{ busy ? "Creating…" : "Create token" }}
          </button>
        </form>
      </template>
      <template if="!canRead">
        <p
          class="rounded-lg border border-amber-300 p-4 text-sm text-amber-800 dark:border-amber-800 dark:text-amber-200"
          role="status"
        >
          Token management requires repository read access (repo:read) or write access (repo:write).
        </p>
      </template>
    </section>
  </div>
  <script setup>
    import { defineProp, ref, onInit } from "@li3/web";
    export default function () {
      const canRead = defineProp("canRead", { default: false });
      const canWrite = defineProp("canWrite", { default: false });
      const tokens = ref([]);
      const loading = ref(true);
      const busy = ref(false);
      const error = ref("");
      const createdToken = ref("");
      const copied = ref(false);
      const label = ref("");
      const scope = ref("repo:read");
      const expiresAt = ref("");

      const responseError = async (response) => {
        let body = {};
        try {
          body = await response.json();
        } catch {}
        return body.error || `Request failed (${response.status})`;
      };
      const loadTokens = async () => {
        loading.value = true;
        error.value = "";
        createdToken.value = "";
        try {
          const response = await fetch("/api/v1/personal-access-tokens", {
            headers: { Accept: "application/json" },
            cache: "no-store",
          });
          if (!response.ok) {
            throw new Error(await responseError(response));
          }
          const body = await response.json();
          tokens.value = Array.isArray(body.tokens) ? body.tokens : [];
        } catch (err) {
          error.value = err.message || "Unable to load tokens";
        } finally {
          loading.value = false;
        }
      };
      const createToken = async () => {
        createdToken.value = "";
        copied.value = false;
        error.value = "";
        if (!canRead.value || busy.value) {
          return;
        }
        if (scope.value === "repo:write" && !canWrite.value) {
          return;
        }
        busy.value = true;
        try {
          const payload = { label: label.value.trim(), scopes: [scope.value] };
          if (expiresAt.value) {
            payload.expiresAt = expiresAt.value;
          }
          const response = await fetch("/api/v1/personal-access-tokens", {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify(payload),
          });
          if (!response.ok) {
            throw new Error(await responseError(response));
          }
          const body = await response.json();
          createdToken.value = body.token || "";
          tokens.value = [body.record, ...tokens.value.filter((item) => item.id !== body.record?.id)].filter(Boolean);
          await loadTokensPreservingSecret();
        } catch (err) {
          error.value = err.message || "Unable to create token";
        } finally {
          busy.value = false;
        }
      };
      const loadTokensPreservingSecret = async () => {
        const secret = createdToken.value;
        await loadTokens();
        createdToken.value = secret;
      };
      const revokeToken = async (id) => {
        if (busy.value) {
          return;
        }
        const token = tokens.value.find((item) => item.id === id);
        if (!token || !window.confirm(`Revoke the token “${token.label}”?`)) {
          return;
        }
        error.value = "";
        busy.value = true;
        try {
          const response = await fetch(`/api/v1/personal-access-tokens/${encodeURIComponent(id)}`, {
            method: "DELETE",
          });
          if (!response.ok) {
            throw new Error(await responseError(response));
          }
          tokens.value = tokens.value.filter((item) => item.id !== id);
        } catch (err) {
          error.value = err.message || "Unable to revoke token";
        } finally {
          busy.value = false;
        }
      };
      const copyToken = async () => {
        try {
          await navigator.clipboard.writeText(createdToken.value);
          copied.value = true;
        } catch {
          error.value = "Could not access the clipboard. Select and copy the token manually.";
        }
      };
      onInit(loadTokens);
      return {
        canRead,
        canWrite,
        tokens,
        loading,
        busy,
        error,
        createdToken,
        copied,
        setLabel: (value) => {
          label.value = value;
        },
        setScope: (value) => {
          scope.value = value;
        },
        setExpiry: (value) => {
          expiresAt.value = value;
        },
        loadTokens,
        createToken,
        revokeToken,
        copyToken,
      };
    }
  </script>
</template>
