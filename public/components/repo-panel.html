<template component="repo-panel">
  <template if="repo"
    ><aside
      class="hidden w-64 flex-shrink-0 overflow-y-auto border-l border-gray-200 bg-gray-50 p-4 dark:border-gray-800 dark:bg-gray-900 md:block"
    >
      <div class="mb-6">
        <h3
          class="mb-3 flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-300"
        >
          <lucide-icon icon="git-branch" size="16"></lucide-icon> Branches
          <button
            popovertarget="branch-popover"
            class="[anchor-name:--branch-popover-anchor] rounded p-1 text-brand hover:bg-gray-200/70 dark:text-green-300 dark:hover:bg-gray-800"
            aria-label="Create branch"
          >
            <lucide-icon icon="plus" size="16"></lucide-icon>
          </button>
        </h3>
        <div
          popover="auto"
          id="branch-popover"
          class="[position:fixed] inset-auto m-0 [position-anchor:--branch-popover-anchor] [top:anchor(bottom)] [left:anchor(left)] open:max-md:left-4 open:max-md:w-auto open:max-md:max-w-[calc(100vw-32px)] open:max-md:max-h-[calc(100dvh-96px)] open:max-md:overflow-y-auto text-gray-900 dark:text-gray-100"
        >
          <form
            on-submit.prevent="createBranch()"
            class="space-y-4 rounded-lg border border-gray-200 bg-white p-4 text-gray-900 shadow-xl dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100"
          >
            <h3 class="text-sm font-semibold">Create branch</h3>
            <label class="block text-xs text-gray-600 dark:text-gray-300"
              >Branch name<input
                class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 focus:border-brand focus:outline-2 focus:outline-brand/20 focus:outline-offset-1 dark:border-[#46544a] dark:bg-[#111713] dark:text-gray-100 dark:placeholder:text-[#98a49a]"
                placeholder="main"
                required
                on-input="setBranchName($event.target.value)"
            /></label>
            <p
              class="text-xs text-red-600 dark:text-red-400"
              role="alert"
              if="errorMessage"
            >
              {{ errorMessage }}
            </p>
            <div class="flex justify-end gap-2">
              <button
                type="button"
                class="rounded-md px-2 py-1 text-gray-500 dark:text-gray-300"
                popovertarget="branch-popover"
                popovertargetaction="hide"
              >
                Cancel
              </button>
              <button
                class="rounded-lg bg-brand px-2 py-1 text-sm font-medium text-white transition-colors hover:bg-brand-hover"
                type="submit"
              >
                Create
              </button>
            </div>
          </form>
        </div>
        <ul class="space-y-1">
          <template for="branch of branches"
            ><li>
              <a
                href="#"
                class="block rounded px-2 py-1.5 text-sm text-gray-600 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800"
                on-click.prevent="selectBranch(branch)"
                >{{ branch }}</a
              >
            </li></template
          >
          <template if="!branches.length"
            ><p class="px-2 py-1 text-xs text-gray-500 dark:text-gray-300">
              No branches.
              <button
                type="button"
                class="underline text-brand hover:text-green-800 dark:text-green-300 dark:hover:text-green-200"
                popovertarget="branch-popover"
              >
                Create one
              </button>
            </p></template
          >
        </ul>
      </div>
      <div>
        <h3
          class="mb-3 flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-300"
        >
          <lucide-icon icon="tag" size="16"></lucide-icon> Tags
          <button
            popovertarget="tag-popover"
            class="[anchor-name:--tag-popover-anchor] rounded p-1 text-brand hover:bg-gray-200/70 dark:text-green-300 dark:hover:bg-gray-800"
            aria-label="Create tag"
          >
            <lucide-icon icon="plus" size="16"></lucide-icon>
          </button>
        </h3>
        <div
          popover="auto"
          id="tag-popover"
          class="[position:fixed] inset-auto m-0 [position-anchor:--tag-popover-anchor] [top:anchor(bottom)] [left:anchor(left)] open:max-md:left-4 open:max-md:w-auto open:max-md:max-w-[calc(100vw-32px)] open:max-md:max-h-[calc(100dvh-96px)] open:max-md:overflow-y-auto text-gray-900 dark:text-gray-100"
        >
          <form
            on-submit.prevent="createTag()"
            class="space-y-4 rounded-lg border border-gray-200 bg-white p-4 text-gray-900 shadow-xl dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100"
          >
            <h3 class="text-sm font-semibold">Create tag</h3>
            <label class="block text-xs text-gray-600 dark:text-gray-300"
              >Tag name<input
                class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 focus:border-brand focus:outline-2 focus:outline-brand/20 focus:outline-offset-1 dark:border-[#46544a] dark:bg-[#111713] dark:text-gray-100 dark:placeholder:text-[#98a49a]"
                placeholder="v1.0.0"
                required
                on-input="setTagName($event.target.value)"
            /></label>
            <p
              class="text-xs text-red-600 dark:text-red-400"
              role="alert"
              if="errorMessage"
            >
              {{ errorMessage }}
            </p>
            <div class="flex justify-end gap-2">
              <button
                type="button"
                class="rounded-md px-2 py-1 text-gray-500 dark:text-gray-300"
                popovertarget="tag-popover"
                popovertargetaction="hide"
              >
                Cancel
              </button>
              <button
                class="rounded-lg bg-brand px-2 py-1 text-sm font-medium text-white transition-colors hover:bg-brand-hover"
                type="submit"
              >
                Create
              </button>
            </div>
          </form>
        </div>
        <ul class="space-y-1">
          <template for="tag of tags"
            ><li>
              <a
                href="#"
                class="flex items-center gap-2 rounded px-2 py-1.5 text-sm text-gray-600 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800"
                on-click.prevent="selectTag(tag)"
                ><lucide-icon
                  icon="tag"
                  size="14"
                  class="opacity-50"
                ></lucide-icon
                >{{ tag }}</a
              >
            </li></template
          >
          <template if="!tags.length"
            ><p class="px-2 py-1 text-xs text-gray-500 dark:text-gray-300">
              No tags.
              <button
                type="button"
                class="underline text-brand hover:text-green-800 dark:text-green-300 dark:hover:text-green-200"
                popovertarget="tag-popover"
              >
                Create one
              </button>
            </p></template
          >
        </ul>
      </div>
    </aside></template
  >
  <script setup>
    import { defineProp, ref } from "@li3/web";
    export default function () {
      const repo = defineProp("repo", { default: null });
      const branches = defineProp("branches", { default: () => [] });
      const tags = defineProp("tags", { default: () => [] });
      const branchName = ref("");
      const tagName = ref("");
      const errorMessage = ref("");
      const setBranchName = (value) => {
        branchName.value = value;
      };
      const setTagName = (value) => {
        tagName.value = value;
      };
      const selectRef = (ref) => {
        const query = new URL(window.location.href).searchParams;
        query.set(
          "org",
          new URL(window.location.href).searchParams.get("org") || "",
        );
        query.set("repo", repo.value.repo);
        query.set("ref", ref);
        window.history.pushState(
          {},
          "",
          `${window.location.pathname}?${query}${window.location.hash}`,
        );
        window.dispatchEvent(new PopStateEvent("popstate"));
      };
      const selectBranch = (branch) => selectRef(branch);
      const selectTag = (tag) => selectRef(tag);
      const createBranch = async () => {
        const name = branchName.value.trim();
        if (!name) return;
        errorMessage.value = "";
        try {
          const org = new URL(window.location.href).searchParams.get("org");
          const response = await fetch(
            `/api/v1/orgs/${encodeURIComponent(org)}/repos/${encodeURIComponent(repo.value.repo)}/branches`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ name }),
            },
          );
          if (response.ok) {
            window.location.reload();
          } else {
            errorMessage.value = "Failed to create branch.";
          }
        } catch {
          errorMessage.value = "Failed to create branch.";
        }
      };
      const createTag = async () => {
        const name = tagName.value.trim();
        if (!name) return;
        errorMessage.value = "";
        try {
          const org = new URL(window.location.href).searchParams.get("org");
          const response = await fetch(
            `/api/v1/orgs/${encodeURIComponent(org)}/repos/${encodeURIComponent(repo.value.repo)}/tags`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ name }),
            },
          );
          if (response.ok) {
            window.location.reload();
          } else {
            errorMessage.value = "Failed to create tag.";
          }
        } catch {
          errorMessage.value = "Failed to create tag.";
        }
      };
      return {
        repo,
        branches,
        tags,
        branchName,
        tagName,
        errorMessage,
        setBranchName,
        setTagName,
        selectBranch,
        selectTag,
        createBranch,
        createTag,
      };
    }
  </script>
</template>
