<template component="repo-viewer">
  <section class="flex min-w-0 flex-1 flex-col overflow-y-auto p-4 md:p-6">
    <template if="!repo"><div class="flex flex-1 items-center justify-center text-center"><div><i class="fa-solid fa-code-branch mb-3 text-3xl text-gray-300"></i><h1 class="text-lg font-semibold">Select a repository</h1><p class="mt-1 text-gray-500">Choose a repository from the sidebar to browse its files.</p></div></div></template>
    <template if="repo"><div class="mb-6"><div class="flex items-center gap-3 rounded-lg border border-gray-200 bg-gray-50 p-3 dark:border-gray-800 dark:bg-gray-900/50"><div class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-200 text-gray-600 dark:bg-gray-800 dark:text-gray-300"><i class="fa-solid fa-code-commit"></i></div><div class="flex-1"><div class="font-medium">{{ commits[0] ? commits[0].message : 'No commits yet' }}</div><div class="mt-0.5 text-xs text-gray-500">{{ commits[0] ? commits[0].author_name : 'Empty repository' }}</div></div><code class="rounded bg-gray-200 px-2 py-1 font-mono text-xs dark:bg-gray-800">{{ commits[0] ? commits[0].hash : '—' }}</code></div></div><div class="overflow-hidden rounded-lg border border-gray-200 dark:border-gray-800"><div class="flex justify-between border-b border-gray-200 bg-gray-100 px-4 py-2 text-xs font-medium text-gray-600 dark:border-gray-800 dark:bg-gray-900 dark:text-gray-300"><span>Name</span><span>Last commit</span></div><ul class="divide-y divide-gray-100 dark:divide-gray-800"><template for="entry of entries"><li class="flex cursor-pointer items-center justify-between px-4 py-2.5 hover:bg-gray-50 dark:hover:bg-gray-900/50" on-click="$$emit('select-file', entry)"><div class="flex items-center gap-3"><i class="fa-solid w-4 text-center text-base" bind-class="{ 'fa-folder': entry.type === 'directory', 'fa-file-lines': entry.type === 'file', 'text-blue-400': entry.type === 'directory', 'text-gray-400': entry.type === 'file' }"></i><span>{{ entry.name }}</span></div><span class="max-w-[50%] truncate text-xs text-gray-500">{{ entry.type }}</span></li></template></ul></div></template>
  </section>
  <script setup>
    import { defineProp } from '@li3/web';
    export default function () { const repo = defineProp('repo', { default: null }); const entries = defineProp('entries', { default: () => [] }); const commits = defineProp('commits', { default: () => [] }); return { repo, entries, commits }; }
  </script>
</template>
