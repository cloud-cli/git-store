<template component="organization-settings">
  <div class="flex min-h-full flex-1 gap-6 p-4 md:p-8">
    <nav
      class="w-32 flex-shrink-0 border-r border-gray-200 pr-3 sm:w-44 sm:pr-4 dark:border-gray-800"
      aria-label="Settings navigation"
    >
      <h1 class="mb-4 text-xl font-bold">Settings</h1>
      <a
        href="/?settings=organizations"
        aria-current="page"
        class="block rounded-lg border border-green-200 bg-green-50 px-3 py-2 font-medium text-green-800 dark:border-green-900 dark:bg-green-950 dark:text-green-200"
        >Organizations</a
      >
    </nav>
    <div class="min-w-0 flex-1">
      <h2 class="mb-4 text-2xl font-bold">Organizations</h2>
      <ul class="mb-6 space-y-2">
        <template for="item of organizations"
          ><li>
            <a
              attr-href="organizationHref(item)"
              class="flow-onboarding-card flex items-center gap-3 px-4 py-3 transition-colors hover:border-green-300 dark:hover:border-green-800"
              ><i class="ph ph-buildings text-lg text-brand"></i><span class="font-medium">{{ item.slug }}</span></a
            >
          </li></template
        >
      </ul>
      <template if="canWrite"
        ><form
          class="flow-onboarding-card flex max-w-xl flex-col gap-3 p-4 sm:flex-row"
          on-submit.prevent="createOrganization()"
        >
          <input
            aria-label="Organization slug"
            placeholder="e.g. homebots-inc"
            class="flow-input min-w-0 flex-1 px-3 py-2"
            required
            on-input="setOrganizationName($event.target.value)"
          /><button class="flow-action rounded-lg px-4 py-2 font-medium text-white" type="submit">
            Create organization
          </button>
        </form></template
      >
      <template if="!canWrite"
        ><p class="text-sm text-amber-700 dark:text-amber-300" role="status">
          Read-only access: ask your Git Store administrator to enable repository write access (repo:write).
        </p></template
      >
      <template if="created"
        ><p role="status" class="mt-3 text-sm text-green-700 dark:text-green-300">Organization created.</p></template
      >
      <template if="error"
        ><p role="alert" class="mt-3 text-sm text-red-600 dark:text-red-400">{{ error }}</p>
        <button class="mt-2 text-sm text-brand hover:underline dark:text-green-300" type="button" on-click="retry()">
          Try again
        </button></template
      >
    </div>
  </div>
  <script setup>
    import { defineProp, defineEvent, ref } from "@li3/web";
    export default function () {
      const organizations = defineProp("organizations", { default: () => [] });
      const canWrite = defineProp("canWrite", { default: false });
      const created = defineProp("created", { default: false });
      const error = defineProp("error", { default: "" });
      const emitCreate = defineEvent("createorg");
      const emitRetry = defineEvent("retry");
      const organizationName = ref("");
      const organizationHref = (item) => `/?org=${encodeURIComponent(item.slug)}`;
      const setOrganizationName = (value) => {
        organizationName.value = value;
      };
      const createOrganization = () => emitCreate(organizationName.value.trim());
      const retry = () => emitRetry();
      return {
        organizations,
        canWrite,
        created,
        error,
        organizationHref,
        setOrganizationName,
        createOrganization,
        retry,
      };
    }
  </script>
</template>
