<template component="machine-git-credentials">
  <section class="max-w-3xl space-y-4" aria-labelledby="machine-git-credentials-heading">
    <div>
      <h3 id="machine-git-credentials-heading" class="text-xl font-semibold">Machine Git credentials</h3>
      <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">
        Headless HTTPS Git access for scripts. Credentials are limited to this organization and never authorize API
        requests. Use the secret as the password for Git over HTTPS; the username is ignored. The secret is shown only
        once.
      </p>
    </div>

    <template if="secret">
      <aside class="rounded-xl border border-amber-400 bg-amber-50 p-4 dark:border-amber-700 dark:bg-amber-950/40">
        <h4 class="font-semibold">Copy this credential now</h4>
        <p class="my-2 text-sm">It cannot be viewed again. Store it in your CI secret manager.</p>
        <div class="flex flex-col gap-2 sm:flex-row">
          <code class="min-w-0 flex-1 break-all rounded bg-white p-3 text-sm dark:bg-gray-950">{{ secret }}</code>
          <button type="button" on-click="copySecret()" class="rounded-lg border px-3 py-2 font-medium">
            {{ copied ? "Copied" : "Copy credential" }}
          </button>
        </div>
      </aside>
    </template>
    <template if="notice"
      ><p role="status" class="text-sm text-green-700 dark:text-green-300">{{ notice }}</p></template
    >
    <template if="error"><p role="alert" class="text-sm text-red-700 dark:text-red-300">{{ error }}</p></template>

    <form class="grid gap-3 rounded-xl border border-gray-200 p-4 dark:border-gray-800" on-submit.prevent="create()">
      <h4 class="font-semibold">Create a credential</h4>
      <label class="grid gap-1 text-sm font-medium"
        >Label
        <input
          aria-label="Credential label"
          required
          maxlength="100"
          autocomplete="off"
          placeholder="e.g. CI deploy"
          on-input="setLabel($event.target.value)"
          class="rounded-lg border border-gray-300 bg-transparent px-3 py-2 dark:border-gray-700"
        />
      </label>
      <label class="grid gap-1 text-sm font-medium"
        >Repository restriction (optional)
        <input
          aria-label="Repository restriction"
          autocomplete="off"
          placeholder="Blank grants access to every repository in this organization"
          on-input="setRepo($event.target.value)"
          class="rounded-lg border border-gray-300 bg-transparent px-3 py-2 dark:border-gray-700"
        />
      </label>
      <fieldset class="grid gap-1 text-sm">
        <legend class="mb-1 font-medium">Git permissions</legend>
        <label class="flex items-center gap-2"
          ><input type="checkbox" checked on-change="toggleScope('repo:read', $event.target.checked)" />repo:read</label
        >
        <label class="flex items-center gap-2"
          ><input type="checkbox" on-change="toggleScope('repo:write', $event.target.checked)" />repo:write</label
        >
      </fieldset>
      <label class="grid w-fit gap-1 text-sm font-medium"
        >Optional expiry date
        <input type="date" aria-label="Credential expiry" on-input="setExpiry($event.target.value)" />
      </label>
      <button type="submit" class="w-fit rounded-lg bg-brand px-4 py-2 font-medium text-white">
        {{ busy ? "Creating…" : "Create credential" }}
      </button>
    </form>

    <div>
      <h4 class="mb-2 font-semibold">Existing credentials</h4>
      <template if="credentials.length">
        <ul class="space-y-2">
          <template for="credential of credentials"
            ><li class="flex flex-wrap items-center justify-between gap-3 rounded-xl border p-4">
              <div class="min-w-0">
                <p class="break-words font-medium">{{ credential.label }}</p>
                <p class="text-sm text-gray-600 dark:text-gray-300">
                  {{ credential.repo || "All repositories" }} · {{ credential.scopes.join(", ") }} · Created {{
                  credential.createdAt }}<template if="credential.expiresAt">
                    · Expires {{ credential.expiresAt }}</template
                  >
                </p>
              </div>
              <button
                type="button"
                on-click="revoke(credential.id)"
                class="rounded-lg border border-red-300 px-3 py-2 text-sm text-red-700 hover:bg-red-50 dark:border-red-900 dark:text-red-300 dark:hover:bg-red-950"
              >
                Revoke
              </button>
            </li></template
          >
        </ul>
      </template>
      <template if="!credentials.length">
        <p class="rounded-lg border border-gray-200 p-3 text-sm text-gray-600 dark:border-gray-800 dark:text-gray-300">
          No machine credentials for this organization.
        </p>
      </template>
    </div>
  </section>
  <script setup>
    import { defineProp, ref, onInit } from "@li3/web";
    export default function () {
      const org = defineProp("org", {
        default: () => new URL(window.location.href).searchParams.get("org") || "",
      });
      const credentials = ref([]);
      const label = ref("");
      const repo = ref("");
      const scopes = ref(["repo:read"]);
      const expiresAt = ref("");
      const secret = ref("");
      const copied = ref(false);
      const busy = ref(false);
      const error = ref("");
      const notice = ref("");
      const endpoint = () => `/api/v1/orgs/${encodeURIComponent(org.value)}/machine-git-credentials`;
      const load = async () => {
        const response = await fetch(endpoint(), { cache: "no-store" });
        const body = await response.json();
        if (!response.ok) {
          throw new Error(body.error || "Unable to load machine credentials.");
        }
        credentials.value = Array.isArray(body.credentials) ? body.credentials : [];
      };
      const create = async () => {
        if (busy.value || !label.value.trim() || scopes.value.length === 0) {
          return;
        }
        busy.value = true;
        error.value = "";
        notice.value = "";
        secret.value = "";
        copied.value = false;
        try {
          const response = await fetch(endpoint(), {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({
              label: label.value.trim(),
              repo: repo.value.trim() || null,
              scopes: scopes.value,
              expiresAt: expiresAt.value || null,
            }),
          });
          const body = await response.json();
          if (!response.ok) {
            throw new Error(body.error || `Unable to create credential (${response.status}).`);
          }
          secret.value = body.token;
          credentials.value = [body.record, ...credentials.value];
          label.value = "";
          repo.value = "";
          expiresAt.value = "";
          scopes.value = ["repo:read"];
          document.querySelector('[aria-label="Credential label"]').value = "";
          document.querySelector('[aria-label="Repository restriction"]').value = "";
          document.querySelector('[aria-label="Credential expiry"]').value = "";
          document.querySelectorAll('fieldset input[type="checkbox"]').forEach((input, index) => {
            input.checked = index === 0;
          });
          notice.value = "Credential created. Copy the secret now and save it in your CI secret manager.";
        } catch (cause) {
          error.value = cause.message || "Unable to create credential.";
        } finally {
          busy.value = false;
        }
      };
      const revoke = async (id) => {
        const credential = credentials.value.find((item) => item.id === id);
        if (!credential || !window.confirm(`Revoke the machine credential “${credential.label}”?`)) {
          return;
        }
        error.value = "";
        notice.value = "";
        try {
          const response = await fetch(`${endpoint()}/${encodeURIComponent(id)}`, { method: "DELETE" });
          if (!response.ok) {
            const body = await response.json().catch(() => ({}));
            throw new Error(body.error || "Unable to revoke credential.");
          }
          credentials.value = credentials.value.filter((item) => item.id !== id);
          notice.value = "Credential revoked.";
        } catch (cause) {
          error.value = cause.message || "Unable to revoke credential.";
        }
      };
      const copySecret = async () => {
        try {
          await navigator.clipboard.writeText(secret.value);
          copied.value = true;
        } catch {
          error.value = "Could not access the clipboard. Select and copy the secret manually.";
        }
      };
      onInit(() => {
        load().catch((cause) => {
          error.value = cause.message || "Unable to load machine credentials.";
        });
      });
      return {
        org,
        credentials,
        secret,
        copied,
        busy,
        error,
        notice,
        setLabel: (value) => {
          label.value = value;
        },
        setRepo: (value) => {
          repo.value = value;
        },
        setExpiry: (value) => {
          expiresAt.value = value;
        },
        toggleScope: (scope, enabled) => {
          scopes.value = enabled
            ? [...new Set([...scopes.value, scope])]
            : scopes.value.filter((item) => item !== scope);
        },
        create,
        revoke,
        copySecret,
      };
    }
  </script>
</template>
