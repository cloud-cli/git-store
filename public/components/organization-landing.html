<template component="organization-landing">
  <div class="flex min-h-0 flex-1 items-stretch justify-center py-6 text-center">
    <div class="mx-auto flex min-h-0 w-full max-w-5xl flex-col p-4 sm:p-8">
      <template if="orgError"
        ><div class="mx-auto mb-4 max-w-md">
          <p class="mb-2 text-sm text-red-600 dark:text-red-400" role="alert">{{ orgError }}</p>
          <button
            class="text-sm font-medium text-brand hover:underline dark:text-green-300"
            type="button"
            on-click="retry()"
          >
            Try again
          </button>
        </div></template
      >
      <template if="!org && !organizationsLoaded && !orgError"
        ><p class="text-sm text-gray-600 dark:text-gray-300" role="status">Loading organizations…</p></template
      >
      <template if="org && !repositoriesLoaded && !orgError"
        ><p class="text-sm text-gray-600 dark:text-gray-300" role="status">Loading repositories…</p></template
      >
      <template if="org && repositoriesLoaded && !eventsLoaded && !orgError"
        ><p class="text-sm text-gray-600 dark:text-gray-300" role="status">Loading audit events…</p></template
      >
      <template if="!org && organizationsLoaded && organizations.length === 0"
        ><section
          class="mx-auto w-full max-w-md rounded-xl border border-[#e1e5e1] bg-white p-8 shadow-[0_1px_2px_rgba(28,32,30,0.10)] dark:border-[#344039] dark:bg-[#1a231d]"
        >
          <div class="mb-6 text-center">
            <div
              class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-app-bg text-brand dark:bg-[#23362a] dark:text-[#a4d1ae]"
            >
              <lucide-icon icon="building-2" size="24"></lucide-icon>
            </div>
            <h1 class="text-xl font-bold">Create your first Organization</h1>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-300">
              Start by setting up a workspace for your repositories.
            </p>
          </div>
          <template if="canWrite"
            ><form class="flex flex-col gap-4 text-left" on-submit.prevent="createOrganization()">
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-200" for="first-org-name"
                >Organization Name</label
              >
              <input
                id="first-org-name"
                class="-mt-3 w-full rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm text-gray-900 placeholder:text-gray-400 focus:border-brand focus:outline-2 focus:outline-brand/20 focus:outline-offset-1 dark:border-[#46544a] dark:bg-[#111713] dark:text-gray-100 dark:placeholder:text-[#98a49a]"
                placeholder="e.g. homebots-inc"
                required
                on-input="setOrganizationName($event.target.value)"
              />
              <button
                class="flex w-full items-center justify-center gap-2 rounded-lg bg-brand py-2.5 font-medium text-white transition-colors hover:bg-brand-hover"
                type="submit"
              >
                Create Organization <lucide-icon icon="arrow-right" size="18"></lucide-icon>
              </button></form
          ></template>
          <template if="!canWrite"
            ><p class="mt-4 text-sm text-amber-700 dark:text-amber-300" role="status">
              Read-only access: ask your Git Store administrator to enable repository write access (repo:write).
            </p></template
          >
        </section></template
      >
      <template if="!org && organizationsLoaded && organizations.length > 0"
        ><div class="mx-auto w-full max-w-lg text-left">
          <h1 class="mb-4 text-2xl font-bold">Your organizations</h1>
          <ul class="space-y-2">
            <template for="item of organizations"
              ><li>
                <a
                  attr-href="organizationHref(item)"
                  class="flex items-center gap-3 rounded-xl border border-[#e1e5e1] bg-white px-4 py-3 shadow-[0_1px_2px_rgba(28,32,30,0.10)] transition-colors hover:border-green-300 dark:border-[#344039] dark:bg-[#1a231d] dark:hover:border-green-800"
                  ><lucide-icon icon="building-2" size="18" class="text-brand"></lucide-icon
                  ><span class="font-medium">{{ item.slug }}</span></a
                >
              </li></template
            >
          </ul>
        </div></template
      >
      <template if="org && eventsLoaded"
        ><section class="flex min-h-0 flex-1 flex-col text-left">
          <div class="mb-5 shrink-0 border-b border-gray-200 pb-4 dark:border-gray-700">
            <h1 class="text-2xl font-bold">Event stream</h1>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Audited activity in {{ org }}</p>
          </div>
          <template if="eventsError"
            ><p class="mb-3 text-sm text-red-600 dark:text-red-400" role="alert">{{ eventsError }}</p></template
          >
          <template if="events.length === 0 && !eventsError"
            ><p class="py-8 text-center text-sm text-gray-500 dark:text-gray-400">
              No events have been recorded for this organization yet.
            </p></template
          >
          <ol data-testid="organization-event-stream" class="min-h-0 flex-1 space-y-3 overflow-y-auto pb-2">
            <template for="item of events"
              ><li
                class="rounded-xl border border-[#e1e5e1] bg-white p-4 shadow-[0_1px_2px_rgba(28,32,30,0.08)] dark:border-[#344039] dark:bg-[#1a231d]"
              >
                <div class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
                  <p class="min-w-0 break-words">
                    <span class="font-semibold">{{ actorLabel(item) }}</span>
                    <span class="mx-1 text-gray-500 dark:text-gray-400">{{ item.event }}</span>
                    <code class="break-all text-xs text-brand dark:text-green-300">{{ item.object }}</code>
                  </p>
                  <time class="shrink-0 text-xs text-gray-500 dark:text-gray-400" attr-datetime="item.occurredAt"
                    >{{ formatEventDate(item.occurredAt) }}</time
                  >
                </div>
                <p class="mt-2 text-xs text-gray-500 dark:text-gray-400">{{ item.origin }}</p>
              </li></template
            >
          </ol>
          <template if="hasMoreEvents"
            ><button
              class="mt-3 self-center rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:border-brand hover:text-brand dark:border-gray-700 dark:bg-[#1a231d] dark:text-gray-200"
              type="button"
              on-click="loadMore()"
            >
              Load more events
            </button></template
          >
        </section></template
      >
      <template if="org && repositoriesLoaded && repositories.length === 0"
        ><section
          class="mx-auto w-full max-w-md rounded-xl border border-[#e1e5e1] bg-white p-8 shadow-[0_1px_2px_rgba(28,32,30,0.10)] dark:border-[#344039] dark:bg-[#1a231d]"
        >
          <div class="mb-6 text-center">
            <div
              class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-app-bg text-brand dark:bg-[#23362a] dark:text-[#a4d1ae]"
            >
              <lucide-icon icon="git-branch" size="24"></lucide-icon>
            </div>
            <h1 class="text-xl font-bold">Create your first Repository</h1>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-300">Initialize a new Git repository.</p>
            <span class="sr-only">No repositories found in {{ org }}</span>
          </div>
          <template if="canWrite"
            ><form class="flex flex-col gap-4 text-left" on-submit.prevent="createRepository()">
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-200" for="first-repo-name"
                >Repository Name</label
              >
              <div class="-mt-3 flex overflow-hidden rounded-lg">
                <span
                  class="inline-flex items-center border border-r-0 border-gray-300 bg-gray-50 px-3 font-mono text-sm text-gray-500 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-300"
                  >{{ org }} /</span
                >
                <input
                  id="first-repo-name"
                  class="min-w-0 flex-1 rounded-r-lg rounded-l-none border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 placeholder:text-gray-400 focus:border-brand focus:outline-2 focus:outline-brand/20 focus:outline-offset-1 dark:border-[#46544a] dark:bg-[#111713] dark:text-gray-100 dark:placeholder:text-[#98a49a]"
                  placeholder="e.g. web-design-system"
                  required
                  on-input="setRepositoryName($event.target.value)"
                />
              </div>
              <button
                class="mt-2 flex w-full items-center justify-center gap-2 rounded-lg bg-brand py-2.5 font-medium text-white transition-colors hover:bg-brand-hover"
                type="submit"
              >
                Create Repository <lucide-icon icon="circle-check" size="18"></lucide-icon>
              </button></form
          ></template>
          <template if="!canWrite"
            ><p class="mt-4 text-sm text-amber-700 dark:text-amber-300" role="status">
              Read-only access: ask your Git Store administrator to enable repository write access (repo:write).
            </p></template
          >
          <template if="errorMessage"
            ><p class="mt-3 text-left text-sm text-red-600 dark:text-red-400" role="alert">
              {{ errorMessage }}
            </p></template
          >
        </section></template
      >
    </div>
  </div>

  <script setup>
    import { defineProp, defineEvent, ref } from "@li3/web";
    export default function () {
      const org = defineProp("org", { default: "" });
      const canWrite = defineProp("canWrite", { default: false });
      const organizations = defineProp("organizations", { default: () => [] });
      const organizationsLoaded = defineProp("organizationsLoaded", { default: false });
      const repositories = defineProp("repositories", { default: () => [] });
      const repositoriesLoaded = defineProp("repositoriesLoaded", { default: false });
      const events = defineProp("events", { default: () => [] });
      const eventsLoaded = defineProp("eventsLoaded", { default: false });
      const eventsError = defineProp("eventsError", { default: "" });
      const hasMoreEvents = defineProp("hasMoreEvents", { default: false });
      const profile = defineProp("profile", { default: () => ({}) });
      const orgError = defineProp("orgError", { default: "" });
      const errorMessage = defineProp("errorMessage", { default: "" });
      const emitCreateOrganization = defineEvent("createorg");
      const emitCreateRepository = defineEvent("createrepo");
      const emitRetry = defineEvent("retry");
      const emitLoadMore = defineEvent("loadmore");
      const organizationName = ref("");
      const repositoryName = ref("");
      const organizationHref = (item) => `/?org=${encodeURIComponent(item.slug)}`;
      const setOrganizationName = (value) => {
        organizationName.value = value;
      };
      const setRepositoryName = (value) => {
        repositoryName.value = value;
      };
      const createOrganization = () => emitCreateOrganization(organizationName.value.trim());
      const createRepository = () => emitCreateRepository(repositoryName.value.trim());
      const retry = () => emitRetry();
      const loadMore = () => emitLoadMore();
      const formatEventDate = (value) => {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? "Unknown time" : date.toLocaleString();
      };
      const actorLabel = (item) => {
        if (!item.subject) return "Unknown actor";
        if (item.actorName) return item.actorName;
        if (profile.value?.sub === item.subject) {
          return profile.value.name || profile.value.preferred_username || item.subject;
        }
        return item.subject;
      };
      return {
        org,
        canWrite,
        organizations,
        organizationsLoaded,
        repositories,
        repositoriesLoaded,
        events,
        eventsLoaded,
        eventsError,
        hasMoreEvents,
        profile,
        orgError,
        errorMessage,
        organizationHref,
        setOrganizationName,
        setRepositoryName,
        createOrganization,
        createRepository,
        retry,
        loadMore,
        formatEventDate,
        actorLabel,
      };
    }
  </script>
</template>
