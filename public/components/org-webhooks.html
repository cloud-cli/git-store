<template component="org-webhooks">
  <section class="max-w-3xl space-y-5">
    <div>
      <h3 class="text-xl font-semibold">Webhooks</h3>
      <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">
        Deliveries require a public HTTPS URL. Delivery is best effort: retries are limited, queued deliveries may be
        dropped, and pending deliveries are lost on restart.
      </p>
      <details class="rounded-lg border border-gray-200 p-3 text-sm dark:border-gray-800">
        <summary class="cursor-pointer font-medium">What data is sent?</summary>
        <p class="mt-2 text-gray-600 dark:text-gray-300">
          Each matching event is sent as a signed JSON POST. The event-specific
          <code>details</code> object can contain commit messages or repository-controlled ref and file names.
        </p>
        <pre class="mt-2 overflow-x-auto rounded bg-gray-50 p-3 text-xs dark:bg-gray-900">
 {"id":"delivery-id","org":"your-org","event":"git.branch","action":"created","occurredAt":"2026-01-01T12:00:00.000Z","object":"your-org/repo@refs/heads/main","details":{"ref":"refs/heads/main","before":null,"after":"abc123"}}</pre>
        <p class="mt-2 text-gray-600 dark:text-gray-300">
          Receivers should verify <code>X-GitMini-Signature</code> against the exact request body and deduplicate with
          <code>id</code>.
        </p>
      </details>
    </div>
    <form class="flex flex-col gap-3 rounded-xl border p-4" on-submit.prevent="create()">
      <label class="text-sm font-medium"
        >Endpoint URL<input
          aria-label="Webhook URL"
          type="url"
          required
          placeholder="https://example.com/hooks"
          class="mt-1 block w-full rounded-lg border bg-white px-3 py-2 dark:bg-gray-900"
          on-input="setUrl($event.target.value)"
      /></label>
      <fieldset>
        <legend class="mb-2 text-sm font-medium">Events</legend>
        <div class="grid gap-2 sm:grid-cols-2">
          <div class="rounded border p-2">
            <label class="flex items-center gap-2 text-sm font-medium"
              ><input type="checkbox" on-change="toggleEvent('repository', $event.target.checked)" />Repository
              (all)</label
            >
            <details class="ml-5 mt-2">
              <summary class="cursor-pointer text-xs">Choose individual families</summary>
              <div class="mt-2 grid gap-2">
                <label class="flex items-center gap-2 text-sm"
                  ><input
                    type="checkbox"
                    on-change="toggleEvent('repository.commit', $event.target.checked)"
                  />repository.commit</label
                >
                <label class="flex items-center gap-2 text-sm"
                  ><input
                    type="checkbox"
                    on-change="toggleEvent('repository.file', $event.target.checked)"
                  />repository.file</label
                >
              </div>
            </details>
          </div>
          <div class="rounded border p-2">
            <label class="flex items-center gap-2 text-sm font-medium"
              ><input type="checkbox" on-change="toggleEvent('git', $event.target.checked)" />Git (all)</label
            >
            <details class="ml-5 mt-2">
              <summary class="cursor-pointer text-xs">Choose individual families</summary>
              <div class="mt-2 grid gap-2">
                <label class="flex items-center gap-2 text-sm"
                  ><input type="checkbox" on-change="toggleEvent('git.push', $event.target.checked)" />git.push</label
                >
                <label class="flex items-center gap-2 text-sm"
                  ><input
                    type="checkbox"
                    on-change="toggleEvent('git.branch', $event.target.checked)"
                  />git.branch</label
                >
                <label class="flex items-center gap-2 text-sm"
                  ><input type="checkbox" on-change="toggleEvent('git.tag', $event.target.checked)" />git.tag</label
                >
                <label class="flex items-center gap-2 text-sm"
                  ><input type="checkbox" on-change="toggleEvent('git.ref', $event.target.checked)" />git.ref</label
                >
              </div>
            </details>
          </div>
        </div>
      </fieldset>
      <button class="self-start rounded-lg bg-brand px-4 py-2 font-medium text-white" type="submit">
        Create webhook
      </button>
    </form>
    <template if="secret"
      ><div role="status" class="rounded-lg border border-green-300 bg-green-50 p-4 dark:bg-green-950">
        <strong>Copy your secret now</strong>
        <p>This secret is shown only once.</p>
        <code>{{ secret }}</code>
      </div></template
    >
    <template if="error"><p role="alert" class="text-red-600">{{ error }}</p></template>
    <ul class="space-y-2">
      <template for="hook of hooks"
        ><li class="flex flex-wrap items-center justify-between gap-3 rounded-xl border p-4">
          <div class="min-w-0">
            <strong class="break-all">{{ hook.url }}</strong>
            <p class="text-sm">{{ hook.events.join(', ') }}</p>
          </div>
          <button type="button" class="rounded-lg px-3 py-2 text-red-700" on-click="remove(hook.id)">Delete</button>
        </li></template
      >
    </ul>
  </section>
  <script setup>
    import { defineProp, ref, onInit } from "@li3/web";
    export default function () {
      const org = defineProp("org", {
        default: () => new URL(window.location.href).searchParams.get("org") || "",
      });
      const hooks = ref([]);
      const selected = ref([]);
      const endpoint = ref("");
      const secret = ref("");
      const error = ref("");
      const path = () => `/api/v1/orgs/${encodeURIComponent(org.value)}/webhooks`;
      const load = async () => {
        const response = await fetch(path());
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Unable to load webhooks.");
        hooks.value = result.webhooks || [];
      };
      const setUrl = (value) => {
        endpoint.value = value;
      };
      const toggleEvent = (event, checked) => {
        selected.value = checked
          ? [...new Set([...selected.value, event])]
          : selected.value.filter((item) => item !== event);
      };
      const create = async () => {
        error.value = "";
        secret.value = "";
        try {
          const response = await fetch(path(), {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              url: endpoint.value,
              events: selected.value,
            }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Unable to create webhook.");
          secret.value = result.secret || "";
          endpoint.value = "";
          selected.value = [];
          await load();
        } catch (cause) {
          error.value = cause.message;
        }
      };
      const remove = async (id) => {
        error.value = "";
        try {
          const response = await fetch(`${path()}/${encodeURIComponent(id)}`, {
            method: "DELETE",
          });
          if (!response.ok) throw new Error("Unable to delete webhook.");
          await load();
        } catch (cause) {
          error.value = cause.message;
        }
      };
      onInit(() =>
        load().catch((cause) => {
          error.value = cause.message;
        }),
      );
      return {
        org,
        hooks,
        selected,
        secret,
        error,
        setUrl,
        toggleEvent,
        create,
        remove,
      };
    }
  </script>
</template>
