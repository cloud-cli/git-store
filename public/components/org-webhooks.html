<template component="org-webhooks">
  <section class="max-w-3xl space-y-5">
    <div>
      <h3 class="text-xl font-semibold">Webhooks</h3>
      <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">
        Deliveries require an HTTPS URL. Private or otherwise non-public addresses are blocked unless they match an
        allowed CIDR range below. Delivery is best effort: retries are limited, queued deliveries may be dropped, and
        pending deliveries are lost on restart.
      </p>
      <details class="rounded-lg border border-gray-200 p-3 text-sm dark:border-gray-800">
        <summary class="cursor-pointer font-medium">What data is sent?</summary>
        <p class="mt-2 text-gray-600 dark:text-gray-300">
          Each matching event is sent as a signed JSON POST. The top-level
          <code>action</code> is created, updated, deleted, or pushed. Git ref names and push changes are included in
          <code>details</code>.
        </p>
        <p class="mt-2 text-gray-600 dark:text-gray-300">
          Thread delivery is coming soon. Its planned payload will anchor a thread to an immutable commit SHA and
          include repository, ref, path, line ranges, selected lines, and immutable comments (comment IDs and bodies).
        </p>
        <pre class="mt-2 overflow-x-auto rounded bg-gray-50 p-3 text-xs dark:bg-gray-900">
 {"id":"delivery-id","org":"your-org","event":"git.branch","action":"created","occurredAt":"2026-01-01T12:00:00.000Z","object":"your-org/repo@refs/heads/main","details":{"ref":"refs/heads/main","before":null,"after":"abc123"}}</pre
        >
        <p class="mt-2 text-gray-600 dark:text-gray-300">
          Receivers should verify <code>X-GitMini-Signature</code> against the exact request body and deduplicate with
          <code>id</code>.
        </p>
      </details>
    </div>
    <form class="flex flex-col gap-3 rounded-xl border p-4" on-submit.prevent="create()">
      <label class="text-sm font-medium"
        >Endpoint URL<input
          aria-label="Webhook URL"
          type="url"
          required
          placeholder="https://example.com/hooks"
          class="mt-1 block w-full rounded-lg border bg-white px-3 py-2 dark:bg-gray-900"
          on-input="setUrl($event.target.value)"
      /></label>
      <label class="text-sm font-medium"
        >Signing secret<input
          aria-label="Webhook secret"
          type="password"
          required
          autocomplete="new-password"
          placeholder="Enter a secret key"
          class="mt-1 block w-full rounded-lg border bg-white px-3 py-2 dark:bg-gray-900"
          on-input="setSecret($event.target.value)"
      /></label>
      <fieldset>
        <legend class="mb-2 text-sm font-medium">Events</legend>
        <div class="grid gap-2 sm:grid-cols-2">
          <label class="flex items-start gap-2 rounded border p-3 text-sm"
            ><input type="checkbox" aria-label="git" on-change="toggleEvent('git', $event.target.checked)" />
            <span><strong>Git</strong><br />Pushes and branch/tag ref changes.</span></label
          >
          <label class="flex items-start gap-2 rounded border p-3 text-sm"
            ><input type="checkbox" aria-label="repo" on-change="toggleEvent('repo', $event.target.checked)" />
            <span><strong>Repositories</strong><br />Repository created or deleted.</span></label
          >
          <label class="flex items-start gap-2 rounded border p-3 text-sm"
            ><input type="checkbox" aria-label="thread" on-change="toggleEvent('thread', $event.target.checked)" />
            <span><strong>Threads</strong><br />Coming soon — thread delivery is not available yet.</span></label
          >
        </div>
      </fieldset>
      <label class="text-sm font-medium"
        >Allowed IP ranges (optional)<textarea
          aria-label="Allowed IP ranges"
          rows="3"
          placeholder="192.168.1.20/32&#10;10.0.0.0/24"
          class="mt-1 block w-full rounded-lg border bg-white px-3 py-2 font-mono dark:bg-gray-900"
          on-input="setAllowedIpRanges($event.target.value)"
        ></textarea>
        <span class="mt-1 block font-normal text-gray-600 dark:text-gray-300"
          >One IPv4 or IPv6 CIDR range per line. Only matching resolved endpoint IPs are permitted.</span
        ></label
      >
      <button class="self-start rounded-lg bg-brand px-4 py-2 font-medium text-white" type="submit">
        Create webhook
      </button>
    </form>
    <template if="error"><p role="alert" class="text-red-600">{{ error }}</p></template>
    <ul class="space-y-2">
      <template for="hook of hooks"
        ><li class="flex flex-wrap items-center justify-between gap-3 rounded-xl border p-4">
          <div class="min-w-0">
            <strong class="break-all">{{ hook.url }}</strong>
            <p class="text-sm">{{ hook.events.join(', ') }}</p>
            <template if="hook.allowedIpRanges.length"
              ><p class="break-all text-xs text-gray-600 dark:text-gray-300">
                Allowed IP ranges: {{ hook.allowedIpRanges.join(', ') }}
              </p></template
            >
          </div>
          <button type="button" class="rounded-lg px-3 py-2 text-red-700" on-click="remove(hook.id)">Delete</button>
        </li></template
      >
    </ul>
  </section>
  <script setup>
    import { defineProp, ref, onInit } from "@li3/web";
    export default function () {
      const org = defineProp("org", {
        default: () => new URL(window.location.href).searchParams.get("org") || "",
      });
      const hooks = ref([]);
      const selected = ref([]);
      const endpoint = ref("");
      const secret = ref("");
      const allowedIpRanges = ref("");
      const error = ref("");
      const path = () => `/api/v1/orgs/${encodeURIComponent(org.value)}/webhooks`;
      const load = async () => {
        const response = await fetch(path());
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Unable to load webhooks.");
        hooks.value = result.webhooks || [];
      };
      const setUrl = (value) => {
        endpoint.value = value;
      };
      const setSecret = (value) => {
        secret.value = value;
      };
      const setAllowedIpRanges = (value) => {
        allowedIpRanges.value = value;
      };
      const toggleEvent = (event, checked) => {
        selected.value = checked
          ? [...new Set([...selected.value, event])]
          : selected.value.filter((item) => item !== event);
      };
      const create = async () => {
        error.value = "";
        try {
          const response = await fetch(path(), {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              url: endpoint.value,
              events: selected.value,
              secret: secret.value,
              allowedIpRanges: allowedIpRanges.value,
            }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Unable to create webhook.");
          endpoint.value = "";
          secret.value = "";
          document.querySelector('[aria-label="Webhook secret"]').value = "";
          allowedIpRanges.value = "";
          document.querySelector('[aria-label="Allowed IP ranges"]').value = "";
          selected.value = [];
          await load();
        } catch (cause) {
          error.value = cause.message;
        }
      };
      const remove = async (id) => {
        error.value = "";
        try {
          const response = await fetch(`${path()}/${encodeURIComponent(id)}`, {
            method: "DELETE",
          });
          if (!response.ok) throw new Error("Unable to delete webhook.");
          await load();
        } catch (cause) {
          error.value = cause.message;
        }
      };
      onInit(() =>
        load().catch((cause) => {
          error.value = cause.message;
        }),
      );
      return {
        org,
        hooks,
        selected,
        secret,
        error,
        setUrl,
        setSecret,
        setAllowedIpRanges,
        toggleEvent,
        create,
        remove,
      };
    }
  </script>
</template>
